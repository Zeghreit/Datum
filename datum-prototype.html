<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DATUM — step-crawler prototype</title>
<style>
  /* ── DATUM interface ────────────────────────────────────────────
     Rules taken from the reference sheets, minus the decoration:
       · corners are CUT at 45 degrees, never rounded, and never all four
       · frames are hairlines; where a full frame is too loud, use corner ticks
       · bars are SEGMENTED — the empty part stays visible as hatching
       · every block carries a service code, small and dim and meaningless
       · amber is the only colour, and only where it means something
     No fake telemetry, no spinning rings, no invented numbers.        */

  :root {
    --ink:   #05060700;
    --plate: rgba(7,8,9,.86);
    --line:  #24262a;
    --line2: #14161a;
    --dim:   #6f737a;
    --mid:   #a7abb3;
    --hi:    #eeebe4;
    --amb:   #e8a63c;
    --bad:   #e0563a;
    --good:  #a2d68a;
    --cut:   9px;
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; background:#000; overflow:hidden;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  canvas { display:block; }

  /* the shared surface: a plate with two corners cut off */
  .pl {
    background: var(--plate);
    border: 1px solid var(--line);
    clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)),
                       calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut));
  }
  .pl.alt {
    clip-path: polygon(0 0, calc(100% - var(--cut)) 0, 100% var(--cut),
                       100% 100%, var(--cut) 100%, 0 calc(100% - var(--cut)));
  }
  /* service code, bottom right of a plate */
  .code { position:absolute; right:6px; bottom:3px; font-size:10px; letter-spacing:.22em;
    color:#4c5057; pointer-events:none; }

  /* segmented bar: filled part solid, empty part still visible as hatching */
  .seg { position:relative; height:7px; overflow:hidden;
    background:
      repeating-linear-gradient(115deg, #191b1f 0 3px, transparent 3px 7px),
      #0b0c0e;
    border:1px solid var(--line2); }
  .seg > i { display:block; height:100%; transition:width .12s linear;
    background:
      repeating-linear-gradient(115deg, var(--hi) 0 4px, transparent 4px 7px),
      linear-gradient(var(--hi), var(--hi)); }

  #hud { position:fixed; top:16px; left:18px; padding:9px 16px 9px 13px;
    color:var(--mid); font-size:16px; line-height:1.7; letter-spacing:.03em;
    background:var(--plate); border-left:2px solid var(--amb);
    border-top:1px solid var(--line); border-right:1px solid var(--line);
    border-bottom:1px solid var(--line);
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - 9px), calc(100% - 9px) 100%, 0 100%); }
  #hud b { color:var(--hi); font-weight:500; }
  #hud .amber { color:var(--amb); }

  /* ── party ─────────────────────────────────────────────────── */
  #vitals { position:fixed; bottom:14px; left:50%; transform:translateX(-50%);
    display:flex; gap:10px; user-select:none;
    font-family: ui-monospace, Menlo, monospace; }
  #vitals .cel { width:116px; opacity:.42; transition:opacity .1s linear;
    background:var(--plate); border:1px solid var(--line2); padding:5px 5px 4px;
    clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px),
                       calc(100% - 10px) 100%, 0 100%, 0 10px); }
  #vitals .cel.act { opacity:1; border-color:var(--amb); }
  #vitals .cel.out { opacity:.22; }

  #vitals .ico { height:14px; display:flex; justify-content:center; align-items:center; }
  #vitals .ico .clamp { display:none; font-size:11px; letter-spacing:.16em;
    color:#0a0b0c; background:var(--bad); padding:1px 7px;
    clip-path: polygon(4px 0, 100% 0, calc(100% - 4px) 100%, 0 100%); }
  #vitals .cel.held .ico .clamp { display:inline-block; }

  #vitals .pf { position:relative; line-height:0; }
  #vitals .cel.hit .pf { animation: shellHit .34s steps(9) 1; }
  @keyframes shellHit {
    0%   { transform: translate( 0px, 0px) }
    12%  { transform: translate(-4px, 2px) }
    25%  { transform: translate( 3px,-3px) }
    37%  { transform: translate(-3px,-1px) }
    50%  { transform: translate( 2px, 3px) }
    62%  { transform: translate(-2px, 1px) }
    75%  { transform: translate( 2px,-1px) }
    87%  { transform: translate(-1px, 1px) }
    100% { transform: translate( 0px, 0px) }
  }
  #vitals canvas { display:block; width:104px; height:104px; image-rendering:pixelated;
    background:#0a0b0c; }
  /* corner ticks instead of a full frame */
  #vitals .pf::before, #vitals .pf::after { content:''; position:absolute; width:13px;
    height:13px; border:1px solid var(--dim); pointer-events:none; }
  #vitals .pf::before { left:0; top:0; border-right:0; border-bottom:0; }
  #vitals .pf::after  { right:0; bottom:0; border-left:0; border-top:0; }
  #vitals .cel.act .pf::before, #vitals .cel.act .pf::after { border-color:var(--amb); }
  #vitals .cel.held .pf::before, #vitals .cel.held .pf::after { border-color:var(--bad); }

  #vitals .noent { display:none; position:absolute; left:50%; top:50%; width:58px;
    height:58px; margin:-29px 0 0 -29px; border:3px solid var(--bad); border-radius:50%;
    box-shadow:0 0 0 2px rgba(0,0,0,.6), inset 0 0 0 2px rgba(0,0,0,.6); }
  #vitals .noent::after { content:''; position:absolute; left:-3px; top:24px; width:58px;
    height:3px; background:var(--bad); transform:rotate(-45deg);
    box-shadow:0 0 0 2px rgba(0,0,0,.6); }
  #vitals .cel.held .noent { display:block; }

  #vitals .off { display:none; position:absolute; left:0; right:0; bottom:7px;
    text-align:center; font-size:14px; letter-spacing:.24em; color:var(--bad);
    text-shadow:0 0 5px #000, 0 0 2px #000; }
  #vitals .cel.out .off { display:block; }

  #vitals .bar { margin-top:5px; }
  #vitals .cel.act .seg > i { background:
      repeating-linear-gradient(115deg, #efeade 0 4px, transparent 4px 7px),
      linear-gradient(#efeade, #efeade); }
  #vitals .cel.low .seg > i { background:
      repeating-linear-gradient(115deg, var(--amb) 0 4px, transparent 4px 7px),
      linear-gradient(var(--amb), var(--amb)); }
  #vitals .cel.out .seg > i { background:#38201c; }

  #vitals .nm { font-size:13px; letter-spacing:.12em; color:var(--mid); text-align:center;
    margin-top:4px; }
  #vitals .cel.act .nm { color:var(--amb); }
  #vitals .cel.out .nm { color:#5a3a36; }
  #vitals .n { font-size:12px; color:var(--dim); letter-spacing:.05em; margin-top:1px;
    display:flex; justify-content:space-between; }

  /* ── boss ──────────────────────────────────────────────────── */
  #boss { position:fixed; top:20px; left:50%; transform:translateX(-50%); width:540px;
    display:none; user-select:none; pointer-events:none;
    font-family: ui-monospace, Menlo, monospace; }
  #boss .bn { font-size:14px; letter-spacing:.34em; color:var(--bad); text-align:center;
    margin-bottom:9px; text-shadow:0 0 7px #000; }
  #boss .row { display:flex; align-items:center; gap:9px; margin-bottom:6px; }
  #boss .lbl { font-size:12px; letter-spacing:.18em; color:var(--mid); width:66px;
    text-shadow:0 0 4px #000; }
  #boss .seg { flex:1; height:9px; }
  #boss .seg > i { background:
      repeating-linear-gradient(115deg, var(--bad) 0 5px, transparent 5px 9px),
      linear-gradient(var(--bad), var(--bad)); }
  #boss .row.gone .lbl { color:#33353a; }
  #boss .row.gone .seg > i { background:#301c18; }

  /* ── log ───────────────────────────────────────────────────── */
  #log { position:fixed; bottom:16px; right:18px; width:400px;
    display:flex; flex-direction:column; align-items:flex-end;
    font-family: ui-monospace, Menlo, monospace; font-size:15px; line-height:1.6;
    user-select:none; pointer-events:none; }
  #log div { color:var(--mid); animation:logIn .18s linear; display:inline-block;
    background:var(--plate); padding:2px 9px 2px 11px; margin-top:2px;
    border-left:1px solid var(--line);
    clip-path: polygon(7px 0, 100% 0, 100% 100%, 0 100%, 0 7px); }
  #log div.dim  { color:#6a6e75; }
  #log div.warn { color:var(--amb); }
  #log div.good { color:var(--good); }
  #log div.bad  { color:var(--bad); border-left-color:var(--bad); }
  #log div b { color:var(--hi); font-weight:500; }
  @keyframes logIn { from { opacity:0; transform:translateX(6px) } to { opacity:1 } }

  /* ── key hints ─────────────────────────────────────────────── */
  #keys { position:fixed; bottom:16px; left:18px; color:var(--dim); font-size:15px;
    line-height:1.85; font-family:inherit; user-select:none; letter-spacing:.02em;
    background:var(--plate); border:1px solid var(--line2); padding:8px 14px 8px 11px;
    border-left:2px solid var(--line);
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%); }
  #keys b { color:var(--mid); font-weight:500; }

  #mini { position:fixed; bottom:196px; right:18px; border:1px solid var(--line);
    background:rgba(7,8,9,.84);
    clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px),
                       calc(100% - 12px) 100%, 0 100%, 0 12px); }

  #fxc { position:fixed; inset:0; pointer-events:none; }
  #flash { position:fixed; inset:0; pointer-events:none; opacity:0;
    box-shadow: inset 0 0 130px 34px rgba(192,60,30,.85); }
  #punish { position:fixed; inset:0; pointer-events:none; opacity:0; background:#fff; }
  #fade { position:fixed; inset:0; background:#000; pointer-events:none; opacity:0;
    transition:opacity .18s linear; }
  #dead { position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    color:var(--mid); font-size:16px; letter-spacing:.26em;
    font-family: ui-monospace, Menlo, monospace; }

  /* ── tuning panel (debug) ──────────────────────────────────── */
  #panel { position:fixed; top:16px; right:18px; width:250px; background:rgba(6,7,8,.88);
    border:1px solid var(--line); padding:12px 13px 10px; backdrop-filter:blur(3px);
    color:var(--mid); font-size:13px; line-height:1.55; letter-spacing:.02em;
    clip-path: polygon(11px 0, 100% 0, 100% calc(100% - 11px),
                       calc(100% - 11px) 100%, 0 100%, 0 11px); }
  #panel h2 { font-size:12px; font-weight:500; color:var(--dim); margin:0 0 10px;
    letter-spacing:.24em; }
  #panel label { display:flex; justify-content:space-between; align-items:center;
    margin-bottom:5px; color:#6d7076; }
  #panel label span:last-child { color:var(--amb); font-variant-numeric:tabular-nums; }
  #panel input[type=range] { width:100%; height:2px; margin:0 0 9px; -webkit-appearance:none;
    appearance:none; background:#262a2e; outline:none; }
  #panel input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:9px;
    height:9px; background:var(--amb); cursor:pointer; }
  #panel input[type=range]::-moz-range-thumb { width:9px; height:9px; border:0;
    background:var(--amb); cursor:pointer; }

  /* ── prologue ──────────────────────────────────────────────── */
  #boot { position:fixed; inset:0; background:#000; z-index:60; display:flex;
    align-items:center; justify-content:center;
    font-family: ui-monospace, Menlo, monospace; }
  #bootbox { width:min(1120px,88vw); font-size:34px; line-height:1.9; color:#6e7178;
    letter-spacing:.05em; }
  #bootbox .ln { opacity:0; animation:bootin .5s linear forwards; }
  #bootbox i { font-style:normal; color:#3c3f44; display:inline-block; width:min(480px,42vw);
    letter-spacing:.10em; }
  #bootbox b { color:var(--amb); font-weight:500; }
  #bootbox .d { color:var(--mid); }
  #bootbox .big { color:var(--amb); font-size:42px; letter-spacing:.06em; }
  #bootbox .q { color:var(--dim); font-size:30px; }
  #bootskip { position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    font:16px ui-monospace,Menlo,monospace; color:#33353a; letter-spacing:.26em; }
  @keyframes bootin { from { opacity:0 } to { opacity:1 } }

  /* ── shell selection ───────────────────────────────────────── */
  #menu { position:fixed; inset:0; background:rgba(4,5,6,.95); z-index:50;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family: ui-monospace, Menlo, monospace; color:var(--mid); }
  #menu h1 { font-size:15px; font-weight:500; letter-spacing:.38em; color:var(--amb);
    margin-bottom:7px; }
  #menu .sub { font-size:13px; color:var(--dim); letter-spacing:.12em; margin-bottom:24px;
    max-width:540px; text-align:center; line-height:1.8; }
  #grid { display:grid; grid-template-columns:repeat(4,138px); gap:11px; }
  .slot { position:relative; border:1px solid var(--line2); background:rgba(8,9,10,.9);
    padding:9px; cursor:pointer; transition:border-color .1s linear;
    clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px),
                       calc(100% - 12px) 100%, 0 100%, 0 12px); }
  .slot canvas { display:block; width:120px; height:120px; image-rendering:pixelated;
    background:#0a0b0c; }
  .slot .nm { font-size:13px; letter-spacing:.14em; color:var(--hi); margin-top:7px; }
  .slot .st { font-size:12px; color:var(--dim); margin-top:4px; line-height:1.55; }
  .slot .st b { color:var(--mid); font-weight:500; }
  .slot.pick { border-color:var(--amb); }
  .slot.pick .nm { color:var(--amb); }
  .slot.lock { cursor:not-allowed; opacity:.30; }
  .slot.lock .nm { color:var(--dim); }
  #graft { margin-top:16px; width:597px; border:1px solid var(--line2);
    background:rgba(8,9,10,.9); padding:11px 14px; opacity:.42; position:relative;
    clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px)); }
  #graft .h { font-size:13px; letter-spacing:.18em; color:var(--dim); }
  #graft .b { font-size:12px; color:#5a5e65; margin-top:5px; line-height:1.65; }
  #start { margin-top:20px; border:1px solid var(--amb); background:transparent;
    color:var(--amb); font-family:inherit; font-size:14px; letter-spacing:.26em;
    padding:10px 38px; cursor:pointer;
    clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px),
                       calc(100% - 10px) 100%, 0 100%, 0 10px); }
  #start:hover:not(:disabled) { background:rgba(201,144,47,.10); }
  #start:disabled { border-color:#3a3d42; color:#5a5e65; cursor:not-allowed; }
  #menuhint { margin-top:13px; font-size:12px; color:#4c5057; letter-spacing:.12em; }
</style>
</head>
<body>
<div id="hud"></div>
<canvas id="mini" width="248" height="248"></canvas>
<div id="vitals"></div>
<div id="flash"></div>
<div id="punish"></div>
<div id="dead">A L L &nbsp; S H E L L S &nbsp; L O S T</div>
<div id="keys">
  <b>W A S D</b> step / strafe &nbsp; <b>Q E</b> turn &nbsp; <b>SPACE</b> act &nbsp; <b>X</b> hold<br>
  <b>1 2 3 4</b> inhabit body &nbsp; <b>ENTER</b> print (on terminal)<br>
  <b>ESC</b> shells &nbsp; <b>M</b> map mode<br>
  <span style="color:#33332f">G reseed · TAB zone · H debug · drop a PNG to swap art</span>
</div>
<div id="boss"></div>
<div id="fade"></div>

<div id="panel" style="display:none">
  <h2>TUNING</h2>
  <div id="sliders"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ─────────────────────────────────────────────────────────────
   DATUM — step-based first-person crawler, prototype 0.1
   Draft art only. Everything here is a placeholder except the
   movement feel and the scale grammar, which are the point.
   ───────────────────────────────────────────────────────────── */

// ── Tunables ───────────────────────────────────────────────────
const C = {
  eyeHeight:    1.70,   // metres — CONSTANT across zones. this is what sells scale.
  stepBaseDur:  260,    // ms for a 3m step
  stepScaleExp: 0.45,   // how much longer a big step takes. 1.0 = literal, 0 = flat
  turnDur:      210,
  bob:          0.055,  // vertical dip during a step
  lurch:        0.9,    // forward pitch kick, degrees
  fogK:         0.34,   // fog density = fogK / tileSize
  lightRange:   2.9,    // player light radius, in tiles
  lightPower:   1.45,
  ambient:      0.035,
  greeble:      0.55,   // 0..1 surface detail density
  wallHMul:     1.15,   // corridor wall height as multiple of tile size

  // combat — every value here is a tick, not a second.
  enemyCount:   3,
  aggro:        7,      // tiles of line-of-sight before it wakes
  windTicks:    2,      // telegraph length. YOUR window to answer.
  recoverTicks: 2,      // punish window after it swings
  enemyHP:      100,
  enemyDmg:     26,
  tallyTicks:   3,      // ticks a TALLY needs to finish counting you
  sight:        3,      // tiles you map around yourself without line of sight
  dmgScale:     1.0,
  crush:        9,      // damage a clamped shell takes every tick it stays clamped

  // PS1 pipeline
  renderH:      272,    // internal vertical resolution, upscaled with no filtering
  jitter:       160,    // vertex snap grid. 0 = off. lower = more wobble
  texelM:       1.6,    // metres per 32×32 texture tile
  props:        0.75,   // pipes / fans / cables / junction boxes
  auVol:        0.55,
  muVol:        0.34,
};

// ── Zones ──────────────────────────────────────────────────────
// tile  = metres per grid cell. THE key variable.
// wallH = metres. decoupled from tile on purpose.
const HALL = [
  '######D#######',      // the way down, past it
  '#............#',
  '#..#......#..#',
  '#..#......#..#',
  '#............#',
  '#.##......##.#',
  '#............#',
  '#..##....##..#',
  '#............#',      // it wakes about here
  '#..##....##..#',
  '#............#',
  '#.##......##.#',
  '#............#',
  '#..#..P...#..#',
  '#............#',
  '#.....@......#',
  '######B#######',      // the way you came in
];
const VISTA = (() => {
  const W = 11, H = 26, rows = [];
  for (let y = 0; y < H; y++) {
    const r = ' '.repeat(W).split('');
    r[5] = '=';                                     // one tile wide, most of the way
    if ([5,6,12,13,19,20].includes(y)) { r[4] = '='; r[6] = '='; }   // landings
    rows.push(r.join(''));
  }
  const put = (y, ch) => { const r = rows[y].split(''); r[5] = ch; rows[y] = r.join(''); };
  put(H - 2, '@');
  put(1, 'D');
  return rows;
})();

const ZONES = [
  { id:'vent',  name:'VENT STRATA',   kind:'maze', tile:3,  wallH:3.4, ceiling:true,  w:21, h:21 },
  { id:'hall',  name:'ASSEMBLY HALL', kind:'map',  tile:4.5, wallH:26,  ceiling:true,  map:HALL, boss:true },
  // fogD and fogCol are explicit here: deriving density from tile size works
  // inside corridors and is catastrophic in a void — it hid everything past
  // sixty metres, which is where this whole zone lives.
  { id:'span',  name:'SPAN 04',       kind:'map',  tile:11, wallH:0,   ceiling:false,
    map:VISTA, vista:true, fogD:0.00072, fogCol:0x121620, far:26000 },
];
let zoneIdx = 0;

// ── Seeded RNG ─────────────────────────────────────────────────
let seed = 0x9e3779b9;
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296; }; }
let rnd = mulberry32(seed);

// ── Maze generation (recursive backtracker + loop carving) ─────
// Pure mazes are miserable to play. We punch holes to create loops
// so the corridor zone reads as infrastructure, not as a puzzle.
function genMaze(w, h) {
  const g = Array.from({length:h}, () => Array(w).fill('#'));
  const stack = [[1,1]];
  g[1][1] = '.';
  const dirs = [[0,-2],[2,0],[0,2],[-2,0]];
  while (stack.length) {
    const [x,y] = stack[stack.length-1];
    const opts = [];
    for (const [dx,dy] of dirs) {
      const nx=x+dx, ny=y+dy;
      if (nx>0 && ny>0 && nx<w-1 && ny<h-1 && g[ny][nx]==='#') opts.push([nx,ny,dx,dy]);
    }
    if (!opts.length) { stack.pop(); continue; }
    const [nx,ny,dx,dy] = opts[(rnd()*opts.length)|0];
    g[y+dy/2][x+dx/2] = '.';
    g[ny][nx] = '.';
    stack.push([nx,ny]);
  }
  // carve loops
  const loops = Math.floor(w*h*0.035);
  for (let i=0;i<loops;i++){
    const x = 1 + ((rnd()*(w-2))|0), y = 1 + ((rnd()*(h-2))|0);
    if (g[y][x] !== '#') continue;
    const horiz = g[y][x-1]==='.' && g[y][x+1]==='.';
    const vert  = g[y-1] && g[y+1] && g[y-1][x]==='.' && g[y+1][x]==='.';
    if (horiz || vert) g[y][x] = '.';
  }
  g[1][1] = '@';

  // Fixtures are solid, so a fixture in a corridor is a wall across the route.
  // Put them in dead ends only — a cell with exactly one open neighbour — and
  // carve one if the loop-punching left none.
  const openN = (x,y) => [[1,0],[-1,0],[0,1],[0,-1]]
    .filter(([dx,dy]) => g[y+dy] && g[y+dy][x+dx] !== '#').length;

  const ends = [];
  for (let y=1;y<h-1;y++) for (let x=1;x<w-1;x++)
    if (g[y][x] === '.' && openN(x,y) === 1) ends.push([x,y]);

  const carve = () => {                    // no dead end left: make an alcove
    for (let k=0;k<600;k++) {
      const x = 1 + ((rnd()*(w-2))|0), y = 1 + ((rnd()*(h-2))|0);
      if (g[y][x] !== '#') continue;
      if (openN(x,y) !== 1) continue;      // touches exactly one corridor
      g[y][x] = '.'; return [x,y];
    }
    return null;
  };

  const far = (list) => list.reduce((best, c) =>
    (!best || (c[0]+c[1]) > (best[0]+best[1])) ? c : best, null);
  const mid = (list) => list.reduce((best, c) => {
    const d = Math.abs(c[0]-(w>>1)) + Math.abs(c[1]-(h>>1));
    return (!best || d < best.d) ? { c, d } : best;
  }, null);

  let door = far(ends);
  if (!door) door = carve();
  if (door) { g[door[1]][door[0]] = 'D';
              const i = ends.findIndex(c => c[0]===door[0] && c[1]===door[1]);
              if (i >= 0) ends.splice(i, 1); }

  let pr = mid(ends);
  let prc = pr ? pr.c : carve();
  if (prc && g[prc[1]][prc[0]] === '.') g[prc[1]][prc[0]] = 'P';

  return g.map(r => r.join(''));
}

// ── Procedural texture forge (everything is 32×32, PS1-era budget) ──
function mkc(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h;
  const x=c.getContext('2d'); x.imageSmoothingEnabled=false; return [c,x]; }
function px(x,a,b,w,h,col){ x.fillStyle=col; x.fillRect(a|0,b|0,w|0,h|0); }
function shade(hex, f){                       // multiply a hex colour
  const n=parseInt(hex.slice(1),16);
  const r=Math.min(255,(n>>16)*f)|0, g=Math.min(255,((n>>8)&255)*f)|0, b=Math.min(255,(n&255)*f)|0;
  return 'rgb('+r+','+g+','+b+')';
}

function texPanel(base, opt={}) {
  const [c,x] = mkc(32,32); const R = mulberry32(opt.seed || 7);
  px(x,0,0,32,32, base);
  // panel seams — the grid that says "assembled, not grown"
  px(x,0,0,32,1, shade(base,0.52)); px(x,0,31,32,1, shade(base,1.34));
  px(x,0,0,1,32, shade(base,0.52)); px(x,31,0,1,32, shade(base,1.22));
  if (opt.split) { px(x,0,15,32,1, shade(base,0.55)); px(x,0,16,32,1, shade(base,1.18)); }
  // rivets
  for (const [rx,ry] of [[3,3],[28,3],[3,28],[28,28]]) {
    px(x,rx,ry,2,2, shade(base,1.45)); px(x,rx,ry+1,2,1, shade(base,0.6));
  }
  // grime, uneven and everywhere — no focal point
  for (let i=0;i<190;i++) {
    const a=(R()*32)|0, b=(R()*32)|0;
    px(x,a,b,1,1, shade(base, 0.7 + R()*0.62));
  }
  // vertical drips — oil, coolant, whatever this place bleeds
  for (let i=0;i<(opt.drips||3);i++) {
    const a=(R()*32)|0, len=4+(R()*18)|0, top=(R()*20)|0;
    for (let j=0;j<len;j++) px(x,a,top+j,1,1, shade(base, 0.44 + R()*0.16));
  }
  if (opt.vent) for (let j=8;j<24;j+=3) px(x,10,j,12,1, shade(base,0.42));
  const t = new THREE.CanvasTexture(c);
  t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestMipmapNearestFilter;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

function texSpark() {
  const [c,x] = mkc(8,8);
  px(x,3,0,2,8,'#fff'); px(x,0,3,8,2,'#fff');
  px(x,2,2,4,4,'#fff');
  const t = new THREE.CanvasTexture(c);
  t.magFilter = t.minFilter = THREE.NearestFilter;
  return t;
}

// PS1 vertex snapping — the wobble comes from low-precision clip space
function ps1ify(mat) {
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.uJit = { get value(){ return C.jitter; } };
    sh.vertexShader = 'uniform float uJit;\n' + sh.vertexShader.replace(
      '#include <project_vertex>',
      `#include <project_vertex>
       if (uJit > 0.5) {
         vec4 sp = gl_Position; sp.xyz /= sp.w;
         sp.xy = floor(sp.xy * uJit) / uJit;
         sp.xyz *= sp.w; gl_Position = sp;
       }`);
  };
  mat.needsUpdate = true;
  return mat;
}


function texPipe() {
  const [c,x] = mkc(32,32); const R = mulberry32(77);
  px(x,0,0,32,32,'#4e4a42');
  for (let i=0;i<32;i++) px(x,0,i,32,1, shade('#4e4a42', 0.62 + 0.55*Math.sin(i/32*Math.PI)));
  for (const b of [3,16,29]) { px(x,0,b,32,2,'#33302a'); px(x,0,b+2,32,1,'#6b665a'); }
  for (let i=0;i<120;i++) px(x,(R()*32)|0,(R()*32)|0,1,1, shade('#4e4a42', 0.5+R()*0.7));
  const t = new THREE.CanvasTexture(c);
  t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestMipmapNearestFilter;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

// ── Materials (32×32 procedural, nearest-filtered, vertex-snapped) ──
const TEX = {
  wall:  texPanel('#4a4a45', { seed:11, split:true, drips:4 }),
  floor: texPanel('#3c3c37', { seed:23, split:true, drips:1 }),
  ceil:  texPanel('#2c2c29', { seed:41, vent:true, drips:2 }),
  greeb: texPanel('#565650', { seed:59, drips:0 }),
  pipe:  texPipe(),
};
const M = {
  floor:   ps1ify(new THREE.MeshLambertMaterial({ map:TEX.floor, color:0xb8b8b0 })),
  wall:    ps1ify(new THREE.MeshLambertMaterial({ map:TEX.wall,  color:0xc0c0b8 })),
  ceil:    ps1ify(new THREE.MeshLambertMaterial({ map:TEX.ceil,  color:0x9a9a94 })),
  greeble: ps1ify(new THREE.MeshLambertMaterial({ map:TEX.greeb, color:0xa8a8a0 })),
  pipe:    ps1ify(new THREE.MeshLambertMaterial({ map:TEX.pipe,  color:0xb0aca2 })),
  metal:   ps1ify(new THREE.MeshLambertMaterial({ map:TEX.pipe, color:0x8e8a80 })),
  dark:    ps1ify(new THREE.MeshLambertMaterial({ map:TEX.pipe, color:0x3a3830 })),
  far:     new THREE.MeshLambertMaterial({ color:0x191a1c }),
  term:    new THREE.MeshBasicMaterial({ color:0xc9902f }),
};
const SPARK = texSpark();

// ── Particles: sparks, motes, the small bright lies that sell a hit ──
const PMAX = 260;
const pPos = new Float32Array(PMAX*3), pCol = new Float32Array(PMAX*3);
const pVel = new Float32Array(PMAX*3), pLife = new Float32Array(PMAX);
let pHead = 0;
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos,3));
pGeo.setAttribute('color',    new THREE.BufferAttribute(pCol,3));
const pts = new THREE.Points(pGeo, new THREE.PointsMaterial({
  size:0.16, map:SPARK, vertexColors:true, transparent:true, depthWrite:false,
  blending:THREE.AdditiveBlending, sizeAttenuation:true }));
pts.frustumCulled = false; scene.add(pts);

function burst(x,y,z, n, col, spread, up, sc) {
  const t = sc || (Z ? Z.tile/3 : 1);
  for (let i=0;i<n;i++) {
    const j = pHead; pHead = (pHead+1) % PMAX;
    pPos[j*3]=x; pPos[j*3+1]=y; pPos[j*3+2]=z;
    pVel[j*3]   = (Math.random()-0.5)*spread*t;
    pVel[j*3+1] = (Math.random()-0.2)*spread*t + (up||0)*t;
    pVel[j*3+2] = (Math.random()-0.5)*spread*t;
    const f = 0.6 + Math.random()*0.6;
    pCol[j*3]=col[0]*f; pCol[j*3+1]=col[1]*f; pCol[j*3+2]=col[2]*f;
    pLife[j] = 0.34 + Math.random()*0.4;
  }
}

function updateParticles(dt) {
  const t = Z ? Z.tile/3 : 1;
  for (let i=0;i<PMAX;i++) {
    if (pLife[i] <= 0) { if (pCol[i*3]||pCol[i*3+1]||pCol[i*3+2]) { pCol[i*3]=pCol[i*3+1]=pCol[i*3+2]=0; } continue; }
    pLife[i] -= dt;
    pVel[i*3+1] -= 9.2 * t * dt;
    pPos[i*3]   += pVel[i*3]  *dt;
    pPos[i*3+1] += pVel[i*3+1]*dt;
    pPos[i*3+2] += pVel[i*3+2]*dt;
    const f = Math.max(0, pLife[i]) * 2.2;
    pCol[i*3]*=Math.min(1,f); pCol[i*3+1]*=Math.min(1,f); pCol[i*3+2]*=Math.min(1,f);
  }
  pGeo.attributes.position.needsUpdate = true;
  pGeo.attributes.color.needsUpdate = true;
  pts.material.size = 0.09 + 0.05 * (Z ? Z.tile/3 : 1);
}

// ── Enemies ────────────────────────────────────────────────────
// One rule holds this together: the world advances only when you act.
// A step is a turn. A TURN is a turn. Facing the wrong way is how you die.
let enemies = [];
let tickClock = null, tickBusy = false, tickNo = 0;

// ── Enemy sprite sheet ─────────────────────────────────────────
// 2 types × 6 states × 3 views. Nihei anatomy: too tall, forearms longer than
// upper arms, bulbous joints, ribbed torso, elongated skull, no face.
const SP_W = 320, SP_H = 440;
const SP_STATES = ['dormant','stalk','stalk2','wind','strike','recover','dead'];
const SP_VIEWS = ['front','side','back'];
// The sheet has ONE column until per-state art exists. Storing seven identical
// copies of every frame cost a megabyte that buys nothing; spend it on texels.
const SP_COLS = 1;
const SP_TYPES = 6;
const PAL = { BONE:'#a49d8c', BN_D:'#6b6457', BN_L:'#cdc5b0',
              VOID:'#0c0c0a', DARK:'#26241d', AMB:'#c9902f' };

function pixLine(x, x0,y0, x1,y1, th, col) {   // staircase, not antialiased
  const n = Math.max(1, Math.round(Math.hypot(x1-x0, y1-y0)));
  x.fillStyle = col;
  for (let i=0;i<=n;i++) {
    const a = Math.round(x0 + (x1-x0)*i/n - th/2);
    const b = Math.round(y0 + (y1-y0)*i/n - th/2);
    x.fillRect(a, b, th, th);
  }
}
function joint(x, cx, cy, r, col) { x.fillStyle=col;
  x.fillRect(Math.round(cx-r), Math.round(cy-r+1), r*2, r*2-2);
  x.fillRect(Math.round(cx-r+1), Math.round(cy-r), r*2-2, r*2); }

function poseOf(state) {
  const s = state === 'stalk2' ? 'stalk' : state;
  if (s==='dormant')  return { arm: 1.05, lean: 0.34, glow:0,    crouch:0.20 };
  if (s==='stalk')    return { arm: 0.62, lean: 0.10, glow:0.10, crouch:0.03 };
  if (s==='wind')     return { arm:-2.35, lean:-0.24, glow:1,    crouch:-0.07 };
  if (s==='strike')   return { arm:-2.80, lean: 0.40, glow:1,    crouch:0.05 };
  if (s==='recover')  return { arm: 1.30, lean: 0.60, glow:0,    crouch:0.32 };
  return                     { arm: 1.60, lean: 1.42, glow:0,    crouch:0.74 };
}

// type 0 — hunter. thin, vertical, all reach.
function drawHunter(x, ox, oy, state, view) {
  const { BONE, BN_D, BN_L, VOID, DARK, AMB } = PAL;
  const p = poseOf(state), nar = view==='side' ? 0.5 : 1, back = view==='back';
  const ph = state === 'stalk2' ? 1 : 0;      // walk frame: opposite leg leads
  const cx = ox + SP_W/2, base = oy + SP_H - 4 - ph;
  const Hh = (SP_H-8) * (1 - p.crouch);
  const hip = base - Hh*0.44, sh = base - Hh*0.86, tilt = Math.sin(p.lean)*Hh*0.17;

  // digitigrade legs — knee forward, hock back
  for (const s of [-1,1]) {
    const lead = ph ? -s : s;                 // one leg swings through, one plants
    const sw = (state==='stalk'||state==='stalk2') ? lead*Hh*0.055 : 0;
    const hx = cx + s*3.2*nar;
    const kx = hx + s*1.6*nar + sw, ky = hip + Hh*0.22;
    const ax = hx - s*0.6*nar + sw*1.6, ay = base - Hh*0.07 - Math.max(0,sw)*0.5;
    pixLine(x, hx, hip, kx, ky, 3, BN_D);
    pixLine(x, kx, ky, ax, ay, 3, BONE);
    joint(x, kx, ky, 2.5, BN_L);
    pixLine(x, ax, ay, ax + s*3*nar + sw, base - Math.max(0,sw)*0.5, 3, BN_D);
  }
  // ribbed torso — narrow, segmented, a spine you can count
  for (let i=0;i<7;i++) {
    const u = i/6, yy = hip + (sh-hip)*u, w = (8.5 - Math.abs(u-0.35)*4.5)*nar;
    px(x, cx + tilt*u - w/2, yy - 1, w, 2, i%2 ? BONE : BN_D);
    px(x, cx + tilt*u - w/2, yy - 1, 1, 2, BN_L);
    px(x, cx + tilt*u + w/2 - 1, yy - 1, 1, 2, VOID);
  }
  // shoulder yoke
  px(x, cx + tilt - 7*nar, sh - 3, 14*nar, 4, BN_D);
  px(x, cx + tilt - 7*nar, sh - 3, 14*nar, 1, BN_L);

  // arms: forearm LONGER than upper arm. this is the whole silhouette.
  for (const s of [-1,1]) {
    const sx = cx + tilt + s*5.6*nar, sy = sh - 1;
    const swA = ph ? s*0.20 : -s*0.20;        // arms counter-swing the legs
    const arm = p.arm + ((state==='stalk'||state==='stalk2') ? swA : 0);
    const ex = sx + Math.sin(arm)*Hh*0.24*(back?-1:1), ey = sy + Math.cos(arm)*Hh*0.24;
    pixLine(x, sx, sy, ex, ey, 3, BN_D);
    joint(x, ex, ey, 3, BN_L);
    const fa = arm*1.3 + (s>0 ? 0.12 : -0.06);        // asymmetric, always
    const fx = ex + Math.sin(fa)*Hh*0.32*(back?-1:1), fy = ey + Math.cos(fa)*Hh*0.32;
    pixLine(x, ex, ey, fx, fy, 3, BONE);
    // claws
    for (let cq=-1; cq<2; cq++) {
      const ca = fa + cq*0.34;
      pixLine(x, fx, fy, fx + Math.sin(ca)*Hh*0.09*(back?-1:1), fy + Math.cos(ca)*Hh*0.09,
              2, p.glow>0.4 ? AMB : BN_L);
    }
  }
  // neck + elongated skull, jutting forward
  const nx = cx + tilt*1.25, ny = sh - Hh*0.05;
  pixLine(x, cx+tilt, sh-3, nx, ny, 3, BN_D);
  const dirf = back ? -1 : 1, sk = Hh*0.13;
  pixLine(x, nx, ny, nx + dirf*sk*0.75*nar, ny - sk*0.30, 5, BONE);
  px(x, nx - 2*nar, ny - 4, 4*nar, 4, BN_D);
  if (!back) {
    px(x, nx + sk*0.30*nar, ny - sk*0.22, Math.max(1,3*nar), 2, p.glow>0.05 ? AMB : '#241d12');
  }
  // dorsal cabling
  for (let i=0;i<3;i++) {
    const bx = cx + tilt*0.4 - dirf*4*nar;
    pixLine(x, bx, sh + i*3, bx - dirf*(5+i*3)*nar, sh + Hh*(0.16+i*0.07), 2, DARK);
  }
}

// type 1 — mason. squat, wide carapace, short limbs, built to carry.
function drawMason(x, ox, oy, state, view) {
  const { BONE, BN_D, BN_L, VOID, DARK, AMB } = PAL;
  const p = poseOf(state), nar = view==='side' ? 0.62 : 1, back = view==='back';
  const ph = state === 'stalk2' ? 1 : 0;
  const cx = ox + SP_W/2, base = oy + SP_H - 4 - ph*2;
  const Hh = (SP_H-8) * (1 - p.crouch) * 0.78;
  const hip = base - Hh*0.40, sh = base - Hh*0.80, tilt = Math.sin(p.lean)*Hh*0.20;

  for (const s of [-1,1]) {                       // stumpy braced legs
    const lead = ph ? -s : s;
    const sw = (state==='stalk'||state==='stalk2') ? lead*Hh*0.05 : 0;
    const hx = cx + s*6*nar;
    pixLine(x, hx, hip, hx + s*2.5*nar + sw, base - Hh*0.05, 5, BN_D);
    px(x, hx + s*2.5*nar + sw - 4, base - Hh*0.05, 8, 3, BONE);
  }
  // carapace — wide plated shell, the widest thing in the sprite
  for (let i=0;i<5;i++) {
    const u=i/4, yy = hip + (sh-hip)*u, w = (20 - u*5)*nar;
    px(x, cx + tilt*u - w/2, yy-2, w, 3, i%2 ? BONE : BN_D);
    px(x, cx + tilt*u - w/2, yy-2, 2, 3, BN_L);
    px(x, cx + tilt*u + w/2 - 2, yy-2, 2, 3, VOID);
  }
  px(x, cx + tilt - 11*nar, sh-4, 22*nar, 5, BN_D);
  px(x, cx + tilt - 11*nar, sh-4, 22*nar, 1, BN_L);

  for (const s of [-1,1]) {                       // thick short arms, blunt tools
    const sx = cx + tilt + s*9*nar, sy = sh;
    const ex = sx + Math.sin(p.arm)*Hh*0.26*(back?-1:1), ey = sy + Math.cos(p.arm)*Hh*0.26;
    pixLine(x, sx, sy, ex, ey, 5, BN_D);
    joint(x, ex, ey, 3.5, BN_L);
    const fa = p.arm*1.15;
    const fx = ex + Math.sin(fa)*Hh*0.22*(back?-1:1), fy = ey + Math.cos(fa)*Hh*0.22;
    pixLine(x, ex, ey, fx, fy, 5, BONE);
    px(x, fx-4, fy-3, 8, 6, p.glow>0.4 ? AMB : DARK);
  }
  // sunken head, barely clears the shell
  const nx = cx + tilt*1.1, ny = sh - Hh*0.06;
  px(x, nx-5*nar, ny-5, 10*nar, 7, BN_D);
  px(x, nx-5*nar, ny-5, 10*nar, 1, BN_L);
  if (!back) for (let i=-1;i<2;i++)
    px(x, nx + i*3*nar - 1, ny-2, 2, 2, p.glow>0.05 ? AMB : '#241d12');
}

// fallback art only — SEAM and DRAY are squat, TALLY is the spindly one
const DRAWERS = [drawMason, drawMason, drawHunter, drawMason, drawHunter, drawMason];

// The sheet is procedural by default but swappable: drop a PNG on the window
// and it takes over, same grid. Lets generated art drop straight in.
function buildSheet() {
  const [c,x] = mkc(SP_W*SP_COLS, SP_H*SP_VIEWS.length*SP_TYPES);
  for (let ty=0; ty<SP_TYPES; ty++)
    SP_VIEWS.forEach((v,vi) =>
      DRAWERS[ty](x, 0, (ty*SP_VIEWS.length + vi)*SP_H, 'stalk', v));
  const t = new THREE.CanvasTexture(c);
  t.magFilter = t.minFilter = THREE.NearestFilter;
  return t;
}
let SHEET = buildSheet();
let sheetIsCustom = false;
const SH_ROWS = SP_VIEWS.length * SP_TYPES;

function makeEnemyMesh(height, type) {
  const map = SHEET.clone(); map.needsUpdate = true;
  map.repeat.set(1/SP_COLS, 1/SH_ROWS);
  const mat = new THREE.MeshLambertMaterial({ map, transparent:true, alphaTest:0.42,
    side:THREE.DoubleSide, color:0xffffff });
  const spr = new THREE.Mesh(new THREE.PlaneGeometry(height*SP_W/SP_H, height), mat);
  spr.position.y = height/2;
  const g = new THREE.Group(); g.add(spr);
  const glow = new THREE.PointLight(0xc9902f, 0, height*3.2, 2);
  glow.position.y = height*0.9; g.add(glow);
  g.userData = { spr, mat, map, glow, height };
  return g;
}

function setFrame(e, state, view, mirror) {
  const row = e.type*SP_VIEWS.length + Math.max(0, SP_VIEWS.indexOf(view));
  const m = e.g.userData.map;
  m.repeat.x = mirror ? -1/SP_COLS : 1/SP_COLS;
  m.offset.x = mirror ? 1/SP_COLS : 0;
  m.offset.y = 1 - (row+1)/SH_ROWS;
}

// ── Enemy roster ───────────────────────────────────────────────
// Sector 1 has no predators. Everything that hurts you is doing its job.
// h is METRES, absolute. Tile size is architectural scale, not creature scale —
// tying them together made a welder six metres tall inside a hall.
const ETYPE = [
  { id:'SEAM',  ai:'fighter',  hp:100, h:2.30, mat:1,
    note:'seals gaps. you are a gap.' },
  { id:'DRAY',  ai:'hauler',   hp:70,  h:1.35, mat:2,
    note:'hauls material. does not care.' },
  { id:'TALLY', ai:'surveyor', hp:45,  h:2.70, mat:1,
    note:'counts. reports.' },
  // The cadaver: one machine filed under two contradicting work orders.
  // SEAL clamps a shell and holds it. BREAK hits whatever SEAL is holding.
  // Neither half can finish while the other is working. It has been like
  // this for a very long time.
  { id:'SEAL',  ai:'sealer',  hp:190, h:2.90, mat:0, boss:true,
    note:'holds. will not let go.' },
  { id:'BREAK', ai:'breaker', hp:220, h:3.20, mat:0, boss:true,
    note:'removes obstructions.' },
  // Phase one: both orders running through one chassis, alternating, never
  // finishing either. Break it and the contradiction comes apart into two.
  { id:'CADAVER', ai:'cadaver', hp:300, h:4.10, mat:0, boss:true, phase1:true,
    note:'filed twice. cannot finish.' },
];
const MIX = [0,0,1,2,0,1,2,0];              // composition, cycled

function addEnemy(x, y, type, face) {
  const T = ETYPE[type], t = Z.tile;
  const key = type + '@' + x + ',' + y;
  if (zstate().killed.has(key)) return null;      // this one is already down
  const g = makeEnemyMesh(T.h, type);
  g.position.set(x*t, 0, y*t);
  world.add(g);
  const e = { x, y, type, T, face: face === undefined ? (rnd()*4)|0 : face,
              hp:T.hp, state:'dormant', timer:0, count:0,
              g, fx:x, fy:y, lunge:0, flash:0, height:T.h, holds:-1, key };
  enemies.push(e);
  return e;
}

function spawnEnemies() {
  enemies = [];
  if (Z.vista) return;                      // nothing to fight on the span. yet.
  const H = grid.length, W = grid[0].length, t = Z.tile;

  if (Z.boss) {                             // it guards the way down
    let dx = -1, dy = -1;
    for (let y=0;y<H;y++) for (let x=0;x<W;x++) if (grid[y][x] === 'D') { dx=x; dy=y; }
    if (dx >= 0) {
      // nearest free tiles to the door — the map shape must not decide whether
      // half the boss exists
      const cand = [];
      for (let y=0;y<H;y++) for (let x=0;x<W;x++) {
        if (!canEnter(x,y) || grid[y][x] === '@') continue;
        const d = Math.max(Math.abs(x-dx), Math.abs(y-dy));
        if (d >= 1 && d <= 3) cand.push([d, x, y]);
      }
      cand.sort((a,b) => a[0] - b[0]);
      if (cand[0]) {
        const boss = addEnemy(cand[0][1], cand[0][2], 5, 2); // phase 1: one machine
        if (boss) {                                          // dormant until you commit
          const d0 = Math.abs(boss.x - spawn.x) + Math.abs(boss.y - spawn.y);
          boss.asleep = true;
          boss.wakeAt = Math.max(2, Math.round(d0 / 2));
        }
      }
    }
    return;                                   // nothing else works this floor
  }
  let placed = 0, guard = 0;
  while (placed < C.enemyCount && guard++ < 5000) {
    const x = (rnd()*W)|0, y = (rnd()*H)|0;
    if (!canEnter(x,y)) continue;
    if (Math.abs(x-spawn.x) + Math.abs(y-spawn.y) < 5) continue;
    if (enemies.some(e => e.x===x && e.y===y)) continue;
    addEnemy(x, y, MIX[placed % MIX.length]);
    placed++;
  }
}

function occupied(x,y) { return enemies.some(e => e.hp>0 && e.x===x && e.y===y); }

function los(x0,y0,x1,y1) {                  // Bresenham, blocked by '#'
  let dx=Math.abs(x1-x0), dy=Math.abs(y1-y0);
  let sx=x0<x1?1:-1, sy=y0<y1?1:-1, err=dx-dy, x=x0, y=y0, n=0;
  while (n++ < 80) {
    if (x===x1 && y===y1) return true;
    if (!(x===x0&&y===y0) && !isWalk(x,y)) return false;
    const e2 = 2*err;
    if (e2 > -dy) { err -= dy; x += sx; }
    if (e2 <  dx) { err += dx; y += sy; }
  }
  return false;
}

function faceToward(e, tx, ty) {             // greedy: bigger axis first
  const dx = tx - e.x, dy = ty - e.y;
  if (Math.abs(dx) >= Math.abs(dy)) return dx > 0 ? 1 : 3;
  return dy > 0 ? 2 : 0;
}

// Halfway across the hall it stops working and turns round.
function wakeBoss(e) {
  e.state = 'stalk'; e.alerted = true;
  e.face = faceToward(e, P.x, P.y);
  say('IT HAS NOTICED YOU', 'bad');
  note('CONTACT');
  screenFlash(flashEl, '0.34', 620);
  bossRoar();
  workshopOn = false;
}

// A held shell is being squeezed, every tick, until you go and pull it out.
// Without this the clamp was only inconvenient; now it has a clock on it.
function crushHeld() {
  if (C.crush <= 0) return;
  for (let i = 0; i < bodies.length; i++) {
    const b = bodies[i];
    if (!b.held || b.hp <= 0) continue;
    damageShell(i, C.crush, 'crush');
  }
}

function enemyTurn() {
  for (const e of enemies) {
    if (e.hp <= 0) continue;
    if (e.asleep) {                          // it is working, and has not noticed
      const d = Math.abs(e.x-P.x) + Math.abs(e.y-P.y);
      if (d > e.wakeAt) { e.state = 'dormant'; continue; }
      e.asleep = false;
      wakeBoss(e);
    }
    e.fx = e.x; e.fy = e.y; e.lunge = 0;
    const ai = e.T ? e.T.ai : 'fighter';
    if (ai === 'hauler')        aiHauler(e);
    else if (ai === 'surveyor') aiSurveyor(e);
    else if (ai === 'sealer')   aiSealer(e);
    else if (ai === 'breaker')  aiBreaker(e);
    else if (ai === 'cadaver')  aiCadaver(e);
    else                        aiFighter(e);
  }
  crushHeld();
}

// SEAM — the only thing in sector 1 that swings at you, and only because
// an unregistered object is standing in a gap it was told to close.
function aiFighter(e) {
  const dist = Math.abs(e.x-P.x) + Math.abs(e.y-P.y);
  const seen = (dist <= C.aggro && los(e.x, e.y, P.x, P.y)) || e.alerted;
  const front = DIR[e.face];
  const facingPlayer = (e.x+front[0] === P.x && e.y+front[1] === P.y);

  switch (e.state) {
    case 'dormant':
      if (seen) e.state = 'stalk';
      break;

    case 'stalk': {
      if (facingPlayer) { e.state = 'wind'; e.timer = C.windTicks; break; }
      const want = faceToward(e, P.x, P.y);
      if (e.face !== want) { e.face = want; break; }     // turning costs its turn too
      const nx = e.x + front[0], ny = e.y + front[1];
      if (canEnter(nx,ny) && !occupied(nx,ny) && !(nx===P.x && ny===P.y)) { e.x=nx; e.y=ny; }
      break;
    }

    case 'wind':
      if (e.timer === C.windTicks) tellFor(e);
      if (--e.timer <= 0) e.state = 'strike';
      break;

    case 'strike': {
      const tx = e.x+front[0], ty = e.y+front[1];
      // damage lands mid-swing, not at tick start — the arm has to come down first
      if (tx===P.x && ty===P.y) setTimeout(() => damagePlayer(C.enemyDmg),
                                           (tickClock ? tickClock.dur : 260) * 0.55);
      else if (canEnter(tx,ty) && !occupied(tx,ty)) { e.x=tx; e.y=ty; }  // kiting isn't free
      e.lunge = 1;
      e.state = 'recover'; e.timer = C.recoverTicks;
      break;
    }

    case 'recover':
      if (--e.timer <= 0) e.state = 'stalk';
      break;
  }
}

// DRAY — walks its route and never attacks. If you are in the way it shoves
// you aside, which can put you inside somebody else's swing. Killing it is
// pure profit and entirely your idea.
function aiHauler(e) {
  const d = DIR[e.face];
  const nx = e.x + d[0], ny = e.y + d[1];
  e.state = 'stalk';
  if (nx === P.x && ny === P.y) {
    const px = P.x + d[0], py = P.y + d[1];
    if (canEnter(px,py) && !occupied(px,py)) {
      shovePlayer(px, py);
      e.x = nx; e.y = ny;                    // and keeps going — it has a route
    } else {
      e.state = 'recover'; e.timer = 2;      // jammed against a wall: stalls, wide open
      say('DRAY is jammed', 'dim');
    }
    return;
  }
  if (canEnter(nx,ny) && !occupied(nx,ny)) { e.x = nx; e.y = ny; return; }
  for (const turn of [1, 3, 2]) {                       // right, left, back
    const f = (e.face + turn) & 3, dd = DIR[f];
    if (canEnter(e.x+dd[0], e.y+dd[1])) { e.face = f; return; }
  }
}

function shovePlayer(nx, ny) {
  const t = Z.tile;
  P.x = nx; P.y = ny;
  anim = { kind:'move', t0: performance.now(), dur: tickClock ? tickClock.dur : 260,
           from: rig.position.clone(),
           to: new THREE.Vector3(nx*t, rig.position.y, ny*t) };
  bumpT = performance.now(); SFX.bump();
  say('DRAY shoves you aside', 'warn');
}

// TALLY — never attacks. It counts. Finish the count and you are in the
// registry as an unlogged object, and every SEAM in the sector is told where.
function aiSurveyor(e) {
  const dist = Math.abs(e.x-P.x) + Math.abs(e.y-P.y);
  const seen = dist <= C.aggro * 1.7 && los(e.x, e.y, P.x, P.y);
  if (!seen) { e.count = 0; e.state = 'dormant'; return; }

  e.face = faceToward(e, P.x, P.y);
  e.count++;
  if (e.count === 1) { tellFor(e); say('TALLY begins counting', 'warn'); }

  if (e.count >= C.tallyTicks) {
    e.count = 0; e.state = 'strike';
    flagPlayer();
    return;
  }
  e.state = 'wind';
  if (dist <= 1) {                                      // fragile: keeps its distance
    const d = DIR[e.face];
    const bx = e.x - d[0], by = e.y - d[1];
    if (canEnter(bx,by) && !occupied(bx,by)) { e.x = bx; e.y = by; }
  }
}

let logged = false;
function flagPlayer() {
  logged = true;
  for (const f of enemies) {
    if (f.hp > 0 && f.T && f.T.ai === 'fighter') { f.alerted = true; if (f.state === 'dormant') f.state = 'stalk'; }
  }
  screenFlash(flashEl, '0.30', 420);
  SFX.crit();
  note('LOGGED — UNREGISTERED OBJECT');
  say('LOGGED — unregistered object', 'bad');
}

// One chassis running both work orders in turn. It clamps, then it strikes
// what it clamped, then it lets go to clamp again — and so it never finishes
// either job. That is the whole fight, and the whole character.
function aiCadaver(e) {
  const dist = Math.abs(e.x-P.x) + Math.abs(e.y-P.y);
  if (dist > 9 || !los(e.x, e.y, P.x, P.y)) {
    e.face = faceToward(e, P.x, P.y); e.state = 'dormant'; return;
  }
  if (!inReach(e) && e.state !== 'wind' && e.state !== 'strike') {
    e.state = 'stalk';
    if (stepToward(e, P.x, P.y)) return;
  }
  e.face = faceToward(e, P.x, P.y);

  const hi = heldIndex();
  switch (e.state) {
    // 'stalk' used to fall through this switch and do nothing at all, which is
    // why it walked up to you and then stood there forever.
    case 'dormant': case 'recover': case 'stalk':
      if (e.state === 'recover' && --e.timer > 0) break;
      if (!inReach(e) && hi < 0) { e.state = 'stalk'; break; }
      e.state = 'wind'; e.timer = C.windTicks; e.job = hi >= 0 ? 'break' : 'seal';
      tellFor(e);
      break;

    case 'wind':
      if (--e.timer > 0) break;
      e.state = 'strike';
      break;

    case 'strike': {
      e.lunge = 1;
      if (e.job === 'seal') {
        const free = freeShells();
        let pick = (!bodies[active].held && bodies[active].hp > 0 && free > 1)
          ? active : bodies.findIndex(b => b.hp > 0 && !b.held);
        if (pick >= 0 && free > 1) {
          bodies[pick].held = true; e.holds = pick;
          SFX.seal(); say('CADAVER clamps <b>'+bodies[pick].k+'</b>', 'bad');
          if (pick === active) {
            const n = bodies.findIndex(b => b.hp > 0 && !b.held);
            if (n >= 0) { active = n; say('ejected into <b>'+bodies[n].k+'</b>', 'warn'); }
          }
          drawVitals();
        }
      } else {
        const tgt = heldIndex();
        SFX.brk();
        if (tgt >= 0) setTimeout(() => { damageShell(tgt, C.enemyDmg * 1.7);
                                         bodies[tgt].held = false; e.holds = -1; drawVitals(); },
                                 (tickClock ? tickClock.dur : 260) * 0.55);
      }
      e.state = 'recover'; e.timer = C.recoverTicks;
      break;
    }
  }
}

// Each half wants the tile beside you that its partner is furthest from, so
// the two of them end up on opposite sides instead of queuing up in one lane.
function flankTile(e) {
  const mate = enemies.find(o => o !== e && o.hp > 0 && o.T && o.T.boss);
  let best = null, bs = -1e9;
  for (const d of DIR) {
    const x = P.x + d[0], y = P.y + d[1];
    if (!canEnter(x, y)) continue;
    if (occupied(x, y) && !(e.x === x && e.y === y)) continue;
    const fromMate = mate ? Math.abs(x - mate.x) + Math.abs(y - mate.y) : 0;
    const toUs     = Math.abs(x - e.x) + Math.abs(y - e.y);
    const score = fromMate * 3 - toUs;      // far from the partner, near to us
    if (score > bs) { bs = score; best = [x, y]; }
  }
  return best;
}

// One tick of walking: turning to face costs the tick, same as it does for you.
function stepToward(e, tx, ty) {
  if (e.x === tx && e.y === ty) return false;
  const want = faceToward(e, tx, ty);
  if (e.face !== want) { e.face = want; return true; }
  const d = DIR[e.face], nx = e.x + d[0], ny = e.y + d[1];
  if (canEnter(nx, ny) && !occupied(nx, ny) && !(nx === P.x && ny === P.y)) {
    e.x = nx; e.y = ny; return true;
  }
  for (const t of [1, 3]) {                 // blocked ahead: try to go round
    const f = (e.face + t) & 3, dd = DIR[f];
    const ax = e.x + dd[0], ay = e.y + dd[1];
    if (canEnter(ax, ay) && !occupied(ax, ay) && !(ax === P.x && ay === P.y)) {
      e.x = ax; e.y = ay; return true;
    }
  }
  return false;
}

// True when the machine is standing next to you and can actually reach.
function inReach(e) {
  return Math.abs(e.x - P.x) + Math.abs(e.y - P.y) <= 1;
}

function heldIndex() { return bodies.findIndex(b => b.held && b.hp > 0); }
function freeShells()  { return bodies.filter(b => b.hp > 0 && !b.held).length; }

// SEAL — clamps one shell and will not release it. Never damages anything.
// It is armoured by whatever it is holding, so it can only be hit while empty.
function aiSealer(e) {
  const dist = Math.abs(e.x-P.x) + Math.abs(e.y-P.y);
  if (dist > 9 || !los(e.x, e.y, P.x, P.y)) {
    e.face = faceToward(e, P.x, P.y); e.state = 'dormant'; return;
  }
  if (e.solo) return aiFighter(e);            // partner gone: it took the whole order

  if (!inReach(e)) {                          // close in, from its own side
    const t = flankTile(e);
    e.state = 'stalk';
    if (t && stepToward(e, t[0], t[1])) return;
    if (stepToward(e, P.x, P.y)) return;
    return;
  }
  e.face = faceToward(e, P.x, P.y);

  const held = bodies.filter(b => b.held && b.hp > 0).length;
  const cap  = e.hp < e.T.hp * 0.5 ? 2 : 1;       // wounded, it starts holding two
  const free = freeShells();

  if (held >= cap || free <= 1) { e.state = 'hold'; return; }   // hands full: exposed

  if (e.state !== 'wind') { e.state = 'wind'; e.timer = C.windTicks; tellFor(e); return; }
  if (--e.timer > 0) return;

  // grab: prefers the shell you are standing in, so the cost lands on you now
  let pick = (!bodies[active].held && bodies[active].hp > 0 && free > 1)
    ? active
    : bodies.findIndex(b => b.hp > 0 && !b.held);
  if (pick < 0) { e.state = 'hold'; return; }

  bodies[pick].held = true;
  e.holds = pick;
  e.state = 'strike'; e.lunge = 1;
  SFX.seal();
  say('SEAL clamps <b>'+bodies[pick].k+'</b>', 'bad');
  if (pick === active) {                          // ejected, not killed
    const next = bodies.findIndex(b => b.hp > 0 && !b.held);
    if (next >= 0) { active = next; say('ejected into <b>'+bodies[next].k+'</b>', 'warn'); }
  }
  drawVitals();
}

// BREAK — hits whatever SEAL is holding, wherever you are. The clamp is the
// targeting system. With nothing held it has no work order and stands idle.
function aiBreaker(e) {
  const dist = Math.abs(e.x-P.x) + Math.abs(e.y-P.y);
  if (dist > 10 || !los(e.x, e.y, P.x, P.y)) {
    e.face = faceToward(e, P.x, P.y); e.state = 'dormant'; return;
  }
  // With nothing left to clamp for it, it stops waiting and simply swings.
  if (e.solo) return aiFighter(e);

  const hi = heldIndex();
  // nothing clamped yet, or still out of position: take the far side
  if (hi < 0 && !inReach(e) && e.state !== 'wind' && e.state !== 'strike') {
    const t = flankTile(e);
    e.state = 'stalk';
    if (t && stepToward(e, t[0], t[1])) return;
    if (stepToward(e, P.x, P.y)) return;
    return;
  }
  e.face = faceToward(e, P.x, P.y);

  switch (e.state) {
    case 'dormant': case 'stalk':
      if (hi >= 0) { e.state = 'wind'; e.timer = C.windTicks; tellFor(e); }
      else e.state = 'stalk';
      break;
    case 'wind':
      if (hi < 0) { e.state = 'stalk'; break; }    // target let go: order voided
      if (--e.timer <= 0) e.state = 'strike';
      break;
    case 'strike': {
      const tgt = heldIndex();
      e.lunge = 1;
      if (tgt >= 0) setTimeout(() => damageShell(tgt, C.enemyDmg * 1.9),
                               (tickClock ? tickClock.dur : 260) * 0.55);
      e.state = 'recover'; e.timer = C.recoverTicks;
      break;
    }
    case 'recover':
      if (--e.timer <= 0) e.state = 'stalk';
      break;
  }
}

// Phase two: the contradiction comes apart. The halves stop taking turns and
// start working at the same time, from opposite sides.
function splitCadaver(e) {
  explode(e);
  e.state = 'dead'; e.hp = 0; e.holds = -1;
  for (const b of bodies) b.held = false;
  drawVitals();
  say('THE CADAVER COMES APART', 'bad');
  note('SEPARATION');
  screenFlash(flashEl, '0.55', 700);

  const spots = [];
  for (let r = 1; r <= 4 && spots.length < 2; r++) {
    for (const [dx,dy] of [[-r,0],[r,0],[0,-r],[0,r],[-r,-r],[r,r],[-r,r],[r,-r]]) {
      const x = e.x + dx, y = e.y + dy;
      if (!canEnter(x,y) || occupied(x,y) || (x===P.x && y===P.y)) continue;
      if (spots.some(sp => sp[0]===x && sp[1]===y)) continue;
      spots.push([x,y]);
      if (spots.length >= 2) break;
    }
  }
  if (!spots[0]) spots.push([e.x, e.y]);
  if (!spots[1]) spots.push([e.x, e.y]);

  const a = addEnemy(spots[0][0], spots[0][1], 3, 2);   // SEAL
  const b = addEnemy(spots[1][0], spots[1][1], 4, 2);   // BREAK
  for (const h of [a,b]) { h.state = 'stalk'; h.alerted = true; }
  setTimeout(() => { SFX.seal(); SFX.brk(); }, 240);
}

function explode(e) {
  const U = e.g.userData, sc = U.height / 2.3;
  const x = e.g.position.x, y = U.height * 0.52, z = e.g.position.z;
  burst(x, y, z, 64, [1, 0.60, 0.18], 5.2, 1.3, sc);          // the blast
  burst(x, y, z, 28, [1, 0.96, 0.86], 2.4, 0.7, sc);          // white core
  impactLight(x, y, z, true);
  screenFlash(punishEl, '0.14', 190);
  // debris keeps arriving for a moment after the flash
  setTimeout(() => burst(x, y*0.55, z, 30, [0.48,0.47,0.44], 3.6, 0.5, sc), 110);
  setTimeout(() => burst(x, y*1.15, z, 20, [1, 0.42, 0.14], 2.0, 1.8, sc), 230);
  setTimeout(() => { clank(2.4*sc, 0.16, 0.7); nz(0.5, 700, 120, 1.1, 0.10); }, 90);
  e.blast = performance.now();
}

function fxAt(e, n, col, spread) {
  const U = e.g.userData;
  burst(e.g.position.x, U.height*0.55, e.g.position.z, n, col, spread, 0.5,
        U.height / 2.3);                    // sparks sized to the machine, not the hall
}
function screenFlash(el, amt, ms) {
  el.style.transition = 'none'; el.style.opacity = amt;
  requestAnimationFrame(() => { el.style.transition = 'opacity '+ms+'ms linear';
    el.style.opacity = '0'; });
}
const flashEl = document.getElementById('flash'), punishEl = document.getElementById('punish');

// ── Swing FX ───────────────────────────────────────────────────
// The hit mark on the enemy tells you it landed. This tells you you SWUNG —
// and each shell swings differently, so the body you're in is legible in motion.
const fxc = document.createElement('canvas');
fxc.id = 'fxc'; document.body.appendChild(fxc);
const fx2 = fxc.getContext('2d');
function sizeFX() { fxc.width = innerWidth; fxc.height = innerHeight; }
sizeFX();

let swing = null;
function swingFX(kind, hit) {
  swing = { t0: performance.now(), dur: hit ? 250 : 170, kind, hit };
}

// Callouts. A thin line leaves the object, breaks once at a small node, and
// runs flat to a label. Straight from the reference sheets, and the one thing
// that reads as diegetic instrumentation rather than as a game overlay.
const _pv = new THREE.Vector3();
function screenOf(x, y, z) {
  _pv.set(x, y, z).project(camera);
  if (_pv.z > 1) return null;                     // behind us
  return [(_pv.x * 0.5 + 0.5) * fxc.width, (-_pv.y * 0.5 + 0.5) * fxc.height];
}

function callout(x, y, z, label, sub, col, sub2) {
  const p = screenOf(x, y, z); if (!p) return;
  const [sx, sy] = p;
  const side = sx > fxc.width * 0.5 ? -1 : 1;
  const bx = sx + side * 40, by = sy - 34;         // the bend
  const ex = bx + side * 78;                       // the flat run
  const c = col || 'rgba(240,238,232,.94)';

  fx2.save();
  // a dark stroke under everything, so it survives a busy wall
  fx2.lineJoin = 'round'; fx2.lineCap = 'round';
  fx2.strokeStyle = 'rgba(0,0,0,.80)'; fx2.lineWidth = 3.4;
  fx2.beginPath(); fx2.moveTo(sx + side*6, sy);
  fx2.lineTo(bx, by); fx2.lineTo(ex, by); fx2.stroke();

  fx2.strokeStyle = c; fx2.fillStyle = c; fx2.lineWidth = 1.4;
  fx2.beginPath(); fx2.moveTo(sx + side*6, sy);
  fx2.lineTo(bx, by); fx2.lineTo(ex, by); fx2.stroke();
  fx2.lineWidth = 1.6;
  fx2.beginPath(); fx2.arc(bx, by, 4.2, 0, 6.2832); fx2.stroke();
  fx2.beginPath(); fx2.arc(sx + side*6, sy, 2.4, 0, 6.2832); fx2.fill();

  fx2.textAlign = side > 0 ? 'left' : 'right';
  const tx = ex + side * 8;
  fx2.lineWidth = 3.2; fx2.strokeStyle = 'rgba(0,0,0,.85)';

  fx2.font = '500 15px ui-monospace, Menlo, monospace';
  fx2.strokeText(label, tx, by - 4); fx2.fillText(label, tx, by - 4);

  if (sub) {
    fx2.font = '13px ui-monospace, Menlo, monospace';
    fx2.strokeText(sub, tx, by + 13);
    fx2.fillStyle = 'rgba(214,212,206,.92)'; fx2.fillText(sub, tx, by + 13);
  }
  if (sub2) {
    fx2.font = '500 13px ui-monospace, Menlo, monospace';
    fx2.strokeText(sub2, tx, by + 30);
    fx2.fillStyle = '#e8a63c'; fx2.fillText(sub2, tx, by + 30);
  }
  fx2.restore();
}

// What a machine is about to do, in words. Later this becomes a thing only a
// grafted personality can read; for now everything shows it, so the tick
// economy can be checked without guessing.
function intentOf(e) {
  const ai = e.T ? e.T.ai : 'fighter';
  const left = Math.max(0, e.timer);
  const held = heldIndex();
  const hn = held >= 0 && bodies[held] ? bodies[held].k : null;

  if (ai === 'surveyor') {
    if (e.count > 0) return ['COUNTING ' + e.count + '/' + C.tallyTicks +
                             ' — will report you', 'warn'];
    return ['WATCHING', 'idle'];
  }
  if (ai === 'hauler') {
    return e.state === 'recover' ? ['JAMMED — cannot move', 'good']
                                 : ['HAULING — will shove you aside', 'idle'];
  }
  if (ai === 'sealer') {
    if (hn && e.holds >= 0) return ['CRUSHING ' + hn + ' — armoured', 'bad'];
    if (e.state === 'wind')  return ['REACHING — clamps in ' + left, 'warn'];
    if (e.state === 'strike')return ['CLAMPING', 'bad'];
    if (e.state === 'recover')return ['OPEN — hands empty', 'good'];
    return ['CLOSING IN', 'idle'];
  }
  if (ai === 'breaker' || ai === 'cadaver') {
    if (e.state === 'wind') {
      const tgt = hn ? ' at ' + hn : '';
      return [(ai === 'cadaver' && e.job === 'seal' ? 'REACHING — clamps in '
                                                    : 'WINDING' + tgt + ' — strikes in ') +
              left, 'warn'];
    }
    if (e.state === 'strike') return ['STRIKING', 'bad'];
    if (e.state === 'recover') return ['RECOVERING — open for ' + left, 'good'];
    if (hn) return ['AIMED AT ' + hn + ' — held', 'warn'];
    return ['CLOSING IN', 'idle'];
  }
  if (e.state === 'wind')    return ['WINDING UP — strikes in ' + left, 'warn'];
  if (e.state === 'strike')  return ['STRIKING', 'bad'];
  if (e.state === 'recover') return ['RECOVERING — open for ' + left, 'good'];
  return ['CLOSING IN', 'idle'];
}

const INTENT_COL = {
  idle: 'rgba(240,238,232,.94)',
  warn: 'rgba(240,176,72,.96)',
  bad:  'rgba(224,86,58,.96)',
  good: 'rgba(150,214,120,.96)',
};

function drawCallouts() {
  for (const e of enemies) {
    if (e.hp <= 0 || e.state === 'dormant') continue;
    if (!visible.has(e.x + ',' + e.y)) continue;
    const d = Math.abs(e.x-P.x) + Math.abs(e.y-P.y);
    if (d > 4) continue;
    const U = e.g.userData;
    const [line, tone] = intentOf(e);
    const frac = e.hp / (e.T ? e.T.hp : 100);
    // colour comes from what it is doing; low health overrides, because
    // "nearly dead" is the one thing you want to notice above everything else
    const col = frac <= 0.30 ? INTENT_COL.bad : INTENT_COL[tone];
    callout(e.g.position.x, U.height * 1.06 + (U.spr ? U.spr.position.y - U.height/2 : 0),
            e.g.position.z,
            e.T.id + '  ' + Math.max(0, Math.round(e.hp)),
            line, col);
  }

  // fixtures: what it is, what it does, and the key — but only the key when
  // you are actually stood in front of it
  const f = facing();
  const H = grid.length, W = grid[0] ? grid[0].length : 0, t = Z.tile;
  for (let y = Math.max(0,P.y-6); y <= Math.min(H-1,P.y+6); y++)
    for (let x = Math.max(0,P.x-6); x <= Math.min(W-1,P.x+6); x++) {
      const c = grid[y][x];
      if (c !== 'P' && c !== 'D' && c !== 'B') continue;
      if (!visible.has(x + ',' + y)) continue;
      const here = f && f.x === x && f.y === y;
      if (!here && Math.abs(x-P.x) + Math.abs(y-P.y) > 5) continue;

      const bossUp = enemies.some(q => q.hp > 0 && q.T && q.T.boss);
      const label = c === 'D' ? 'DESCENT' : c === 'B' ? 'RETURN' : 'PRINTER';
      const sub   = c === 'D' ? (bossUp ? 'sealed while it still works'
                                        : 'the way to the next stratum')
                  : c === 'B' ? (bossUp ? 'sealed while it still works'
                                        : 'back the way you came')
                  : (zstate().spent.has(x + ',' + y)
                        ? 'spent — nothing left in it'
                        : 'reprints every shell · stock ' + material);
      const hint  = !here ? null
                  : (c === 'D' || c === 'B')
                      ? (bossUp ? 'will not open'
                                : (c === 'B' ? '[ENTER] go back' : '[ENTER] descend'))
                      : (zstate().spent.has(x + ',' + y) ? 'spent'
                         : material > 0 ? '[ENTER] print' : 'no stock');
      callout(x*t, t*0.62, y*t, label, sub,
              here ? 'rgba(240,238,232,.96)' : 'rgba(240,238,232,.55)', hint);
    }
}

function drawSwing(now) {
  fx2.clearRect(0, 0, fxc.width, fxc.height);
  if (!menuOpen && !bootEl && Z) drawCallouts();
  if (!swing) return;
  const k = (now - swing.t0) / swing.dur;
  if (k >= 1) { swing = null; return; }

  const W = fxc.width, H = fxc.height, cx = W / 2, cy = H * 0.60;
  const a = Math.pow(1 - k, 1.6) * (swing.hit ? 1 : 0.5);
  const R = Math.min(W, H);
  fx2.save();
  fx2.globalCompositeOperation = 'lighter';
  fx2.lineCap = 'butt';

  if (swing.kind === 'cut') {                    // BREACH — wide cutter arc
    const sweep = -0.9 + k * 2.5;
    for (let i = 0; i < 3; i++) {
      fx2.strokeStyle = 'rgba(232,226,214,' + (a * (0.5 - i * 0.14)) + ')';
      fx2.lineWidth = (26 - i * 8) * (1 - k * 0.6);
      fx2.beginPath();
      fx2.arc(cx, cy + R * 0.30, R * (0.44 + i * 0.03),
              sweep - 1.35, sweep - 0.15);
      fx2.stroke();
    }
  } else if (swing.kind === 'slam') {            // BALLAST — blunt shock ring
    fx2.strokeStyle = 'rgba(226,214,190,' + (a * 0.75) + ')';
    fx2.lineWidth = 30 * (1 - k);
    fx2.beginPath(); fx2.arc(cx, cy, R * (0.10 + k * 0.42), 0, 6.2832); fx2.stroke();
    fx2.fillStyle = 'rgba(240,232,214,' + (a * 0.5) + ')';
    fx2.fillRect(cx - R * 0.035, cy - R * 0.34 * (1 - k), R * 0.07, R * 0.5);
  } else if (swing.kind === 'thrust') {          // VECTOR — one thin line, no waste
    const len = R * (0.20 + k * 0.62);
    fx2.strokeStyle = 'rgba(255,250,238,' + (a * 0.95) + ')';
    fx2.lineWidth = 5 * (1 - k * 0.7);
    fx2.beginPath();
    fx2.moveTo(cx - len * 0.62, cy + len * 0.34);
    fx2.lineTo(cx + len * 0.30, cy - len * 0.18);
    fx2.stroke();
  } else {                                       // CONDUIT — outward pulse of motes
    const rr = R * (0.06 + k * 0.34);
    for (let i = 0; i < 14; i++) {
      const ang = i / 14 * 6.2832 + k * 0.8;
      fx2.fillStyle = 'rgba(120,210,140,' + (a * 0.85) + ')';
      fx2.fillRect(cx + Math.cos(ang) * rr - 3, cy + Math.sin(ang) * rr - 3, 6, 6);
    }
  }
  fx2.restore();
}

function playerStrike() {
  const b = A(); if (!b) return;
  if (b.a.repair) {                          // Conduit: mends the worst shell, hits nothing
    if (b.mends <= 0) {
      swingFX(b.a.fx, false); bump();
      say('<b>'+b.k+'</b> has nothing left to mend with', 'warn'); return;
    }
    const t = bodies.filter(v => v.hp > 0 && v !== b)
                    .sort((x,y) => x.hp/x.a.integ - y.hp/y.a.integ)[0];
    if (!t || t.hp >= t.a.integ) { swingFX(b.a.fx, false); bump(); return; }
    b.mends--;
    t.hp = Math.min(t.a.integ, t.hp + b.a.repair); drawVitals();
    swingFX(b.a.fx, true); SFX.pulse();
    say('<b>'+b.k+'</b> mends '+t.k+' — +'+b.a.repair+
        ' · '+b.mends+' left', b.mends ? 'good' : 'warn');
    const d = DIR[P.face];
    burst(rig.position.x + d[0]*Z.tile*0.4, rig.position.y - 0.3,
          rig.position.z + d[1]*Z.tile*0.4, 16, [0.35,0.9,0.45], 0.5, 1.6);
    return;
  }
  const d = DIR[P.face];
  const tx = P.x + d[0], ty = P.y + d[1];
  const e = enemies.find(v => v.hp>0 && v.x===tx && v.y===ty);
  if (!e) { swingFX(b.a.fx, false); SFX[b.a.fx](); bump();
            say('<b>'+b.k+'</b> strikes nothing', 'dim'); return; }
  if (e.T && e.T.ai === 'sealer' && bodies.some(v => v.held && v.hp > 0)) {
    swingFX(b.a.fx, false); SFX.bump(); bump();
    say('SEAL is armoured by what it holds', 'dim'); return;
  }
  const isPunish = e.state === 'recover' ||
                   (e.T && e.T.ai === 'sealer' && !bodies.some(v => v.held && v.hp > 0));
  const dmg = b.a.dmg * C.dmgScale * (isPunish ? b.a.punish : 1);
  e.hp -= dmg; e.flash = performance.now();
  swingFX(b.a.fx, true); (isPunish ? SFX.crit : SFX.clank)();
  say((isPunish ? 'punish · ' : '') + '<b>'+b.k+'</b> strikes '+e.T.id+' — '+Math.round(dmg),
      isPunish ? 'good' : null);
  impactLight(e.g.position.x, e.g.userData.height*0.55, e.g.position.z, isPunish);
  fxAt(e, isPunish ? 34 : 16, isPunish ? [1,0.95,0.8] : [1,0.62,0.22], isPunish ? 3.4 : 1.9);
  if (isPunish) screenFlash(punishEl, '0.34', 160);
  bumpT = performance.now();                 // the swing kicks the camera too
  if (e.hp <= 0) {
    // phase one does not die, it comes apart
    if (e.T && e.T.phase1) { splitCadaver(e); return; }

    e.state = 'dead'; SFX.kill(); explode(e);
    if (e.key) zstate().killed.add(e.key);
    say(e.T.id+' destroyed — material +'+e.T.mat, 'good');
    material = Math.min(6, material + (e.T ? e.T.mat : 1));

    releaseClamps(e);
    // the surviving half inherits the whole contradiction
    if (e.T.boss) {
      for (const o of enemies) if (o.hp > 0 && o.T && o.T.boss && !o.solo) {
        o.solo = true; o.alerted = true; o.state = 'stalk';
        say(o.T.id + ' takes the whole order', 'bad');
      }
    }
  }
}

// A dead machine cannot keep holding anything. Without this a shell stays
// clamped forever once the thing gripping it is destroyed.
function releaseClamps(e) {
  let freed = false;
  if (e.holds >= 0 && bodies[e.holds]) { bodies[e.holds].held = false; freed = true; }
  e.holds = -1;
  // nothing left that can clamp? then nothing stays clamped
  if (!enemies.some(o => o.hp > 0 && o.T &&
        (o.T.ai === 'sealer' || o.T.ai === 'cadaver'))) {
    for (const b of bodies) if (b.held) { b.held = false; freed = true; }
  }
  if (freed) { drawVitals(); say('clamp released', 'good'); }
}

// short-lived light at the point of contact — sells the hit in 3D, not just on screen
let impLight = null, impT = 0;
function impactLight(x, y, z, big) {
  if (!impLight) { impLight = new THREE.PointLight(0xffd9a0, 0, 1, 2); scene.add(impLight); }
  impLight.position.set(x, y, z);
  impLight.distance = Z.tile * (big ? 4.5 : 2.6);
  impT = performance.now();
  impLight.userData.peak = (big ? 9 : 4.5) * Math.pow(Z.tile/3, 0.9);
}

function updateEnemies(now) {
  const k = tickClock ? Math.min(1, (now - tickClock.t0)/tickClock.dur) : 1;
  const t = Z ? Z.tile : 3;
  const camX = rig.position.x, camZ = rig.position.z;

  for (const e of enemies) {
    const U = e.g.userData;

    if (e.state === 'dead') {
      setFrame(e, 'dead', 'side', false);
      const bk = Math.min(1, (now - (e.blast || now)) / 700);
      U.spr.position.y = Math.max(U.height*0.10, U.spr.position.y - 0.16*U.height*(1-bk));
      U.spr.scale.setScalar(Math.max(0.42, 1 - bk*0.58));
      U.mat.opacity = Math.max(0.10, 1 - bk*0.9);
      U.glow.color.setHex(0xff7a22);
      U.glow.intensity = Math.max(0, (1 - bk*1.6) * 5);        // it burns out
      U.mat.transparent = true;
      U.spr.rotation.y = Math.atan2(camX - e.g.position.x, camZ - e.g.position.z);
      continue;
    }

    // position, lunge and recoil
    const lx = e.fx + (e.x - e.fx)*easeOut(k), ly = e.fy + (e.y - e.fy)*easeOut(k);
    const d = DIR[e.face];
    // a butt, not a sway: it rocks back, snaps forward, then drifts home
    let push = 0;
    if (e.lunge) {
      push = k < 0.22 ? -0.20 * (k/0.22)                       // load up
           : k < 0.44 ? -0.20 + 1.20 * ((k-0.22)/0.22)         // strike out
                      : 1.00 * Math.pow(1 - (k-0.44)/0.56, 1.7); // ride back
      push *= t * 0.34;
    }
    // winding up leans it toward you a little, so the tell has weight
    if (e.state === 'wind') {
      const w = 1 - (e.timer-1+k)/C.windTicks;
      push += t * 0.05 * w;
    }
    // struck: a hard rattle across its own axis, dying out fast
    const hk = (now - e.flash) / 190;
    let jx = 0, jz = 0;
    if (hk >= 0 && hk < 1) {
      const amp = t * 0.055 * Math.pow(1 - hk, 2);
      jx = Math.sin(now * 0.09) * amp;
      jz = Math.cos(now * 0.11) * amp;
    }
    e.g.position.set(lx*t + d[0]*push + jx, 0, ly*t + d[1]*push + jz);

    // billboard, Y only
    const toCamX = camX - e.g.position.x, toCamZ = camZ - e.g.position.z;
    U.spr.rotation.y = Math.atan2(toCamX, toCamZ);

    // which sprite view — do we see its face, its back, or its flank?
    const len = Math.hypot(toCamX, toCamZ) || 1;
    const dot   = (d[0]*toCamX + d[1]*toCamZ) / len;
    const cross = (d[0]*toCamZ - d[1]*toCamX) / len;
    const view = dot >  0.45 ? 'front' : dot < -0.45 ? 'back' : 'side';
    // walk frame only while it is actually crossing a tile
    const striding = e.state === 'stalk' && (e.fx !== e.x || e.fy !== e.y) && k < 0.9;
    setFrame(e, striding ? 'stalk2' : e.state, view, view === 'side' && cross < 0);

    // idle sway + strike shove, in sprite-local space
    const sway = e.state==='stalk' ? Math.sin(now*0.004)*U.height*0.012 : 0;
    U.spr.position.y = U.height/2 + sway;

    // the tell: light, not emissive. it lights the corridor before it swings.
    let glow = 0;
    if (e.state === 'wind')   glow = 1 - (e.timer-1+k)/C.windTicks;
    if (e.state === 'strike') glow = 1;
    // hit: the whole machine reads red for a moment. Amber means it is about to
    // act, red means it just took something — the two never mean the same thing.
    const hf = Math.max(0, 1 - (now - e.flash) / 220);
    U.glow.intensity = glow * 3.0 * Math.pow(t/3, 0.8);
    if (hf > 0) {
      U.mat.color.setRGB(1 + hf * 2.6, 1 - hf * 0.72, 1 - hf * 0.78);
      U.spr.scale.setScalar(1 + hf * 0.05);          // a small flinch outward
    } else {
      U.mat.color.setScalar(1);
      U.spr.scale.setScalar(1);
    }
  }
}

// ── Level build ────────────────────────────────────────────────
let world = new THREE.Group(); scene.add(world);
let grid = [], Z = null, spawn = {x:1,y:1};

const WALK = new Set(['.','@','P','D','B','T','=']);
const FIXTURE = new Set(['P','D','B','T']); // rendered as floor, but solid
const isFix  = (x,y) => grid[y] && FIXTURE.has(grid[y][x]);
// isWalk stays "is this open space" — for line of sight, mapping and lighting.
// canEnter is "can a body stand here", which fixtures block.
const canEnter = (x,y) => isWalk(x,y) && !isFix(x,y);
// the fixture you are facing, if any
function facing() {
  const d = DIR[P.face], x = P.x + d[0], y = P.y + d[1];
  return isFix(x,y) ? { x, y, c: grid[y][x] } : null;
}
const isWalk = (x,y) => grid[y] && WALK.has(grid[y][x]);

function clearWorld() {
  world.traverse(o => { if (o.geometry) o.geometry.dispose(); });
  scene.remove(world);
  world = new THREE.Group();
  fans = [];
  scene.add(world);
}

function buildZone() {
  clearWorld();
  Z = ZONES[zoneIdx];
  grid = Z.kind === 'maze' ? genMaze(Z.w, Z.h) : Z.map.slice();

  const t = Z.tile, wallH = Z.wallH || t * C.wallHMul;
  const H = grid.length, W = grid[0].length;

  const fogCol = Z.fogCol !== undefined ? Z.fogCol : 0x08090a;
  scene.fog = new THREE.FogExp2(fogCol, Z.fogD !== undefined ? Z.fogD : C.fogK / t);
  renderer.setClearColor(fogCol);
  camera.far = Z.far || 6000; camera.updateProjectionMatrix();
  lamp.distance = t * C.lightRange;
  lamp.power    = C.lightPower * 60 * Math.pow(t/3, 1.1);
  ambient.intensity = C.ambient;

  const floors=[], walls=[], ceils=[];
  // keep texel density constant regardless of tile size — a 26m span wall
  // gets many texture tiles, a 3m vent wall gets few.
  const TEXM = C.texelM;
  const box = (w,h,d) => {
    const g = new THREE.BoxGeometry(w,h,d);
    const uv = g.attributes.uv, sp = [[d,h],[d,h],[w,d],[w,d],[w,h],[w,h]];
    for (let f=0; f<6; f++) { const [su,sv] = sp[f];
      for (let i=0;i<4;i++) { const k=(f*4+i)*2;
        uv.array[k] *= su/TEXM; uv.array[k+1] *= sv/TEXM; } }
    uv.needsUpdate = true;
    return g;
  };

  for (let y=0;y<H;y++) for (let x=0;x<W;x++) {
    const c = grid[y][x];
    if (c === '@') spawn = {x,y};
    const wx = x*t, wz = y*t;

    if (c === '#') {
      const g = box(t, wallH, t);
      g.translate(wx, wallH/2, wz);
      walls.push(g);
    } else if (WALK.has(c)) {
      const g = box(t, 0.22, t); g.translate(wx, -0.11, wz); floors.push(g);
      if (Z.ceiling && c !== '=') {
        const cg = box(t, 0.22, t); cg.translate(wx, wallH+0.11, wz); ceils.push(cg);
      }
      if (c === '=') { // railless span — add a lip so the edge reads
        for (const [dx,dz] of [[1,0],[-1,0],[0,1],[0,-1]]) {
          if (!isWalk(x+dx, y+dz)) {
            const lg = box(dx?0.3:t, 0.5, dz?0.3:t);
            lg.translate(wx+dx*t/2, 0.14, wz+dz*t/2); floors.push(lg);
          }
        }
      }
      if (c === 'P' || c === 'T') {              // printer: squat, waist high
        const m = new THREE.Mesh(box(t*0.30, t*0.26, t*0.22), M.metal);
        m.position.set(wx, t*0.13, wz); world.add(m);
        const g2 = new THREE.Mesh(box(t*0.20, t*0.05, t*0.14), M.term);
        g2.position.set(wx, t*0.27, wz); world.add(g2);
        const l = new THREE.PointLight(0xc9902f, 2.2, t*2.6, 2);
        l.position.set(wx, t*0.35, wz); world.add(l);
      }
      if (c === 'D' || c === 'B') {                // a door: down, or back the way you came
        const fh = Math.min(wallH*0.8, t*1.5);
        for (const sx of [-1,1]) {
          const post = new THREE.Mesh(box(t*0.10, fh, t*0.16), M.metal);
          post.position.set(wx + sx*t*0.34, fh/2, wz); world.add(post);
        }
        const lintel = new THREE.Mesh(box(t*0.80, t*0.10, t*0.16), M.metal);
        lintel.position.set(wx, fh, wz); world.add(lintel);
        const sill = new THREE.Mesh(box(t*0.70, t*0.03, t*0.30), M.term);
        sill.position.set(wx, 0.02, wz); world.add(sill);
        const l = new THREE.PointLight(0xc9902f, 3.0, t*3.4, 2);
        l.position.set(wx, fh*0.5, wz); world.add(l);
      }
    }
  }

  const merge = (arr, mat) => {
    if (!arr.length) return;
    const g = mergeGeoms(arr);
    world.add(new THREE.Mesh(g, mat));
  };
  merge(floors, M.floor); merge(walls, M.wall); merge(ceils, M.ceil);

  buildGreebles(W, H, t, wallH);
  buildProps(W, H, t, wallH);
  if (Z.vista) buildVista(W, H, t);
  scatterLights(W, H, t, wallH);
  spawnEnemies();
}

// r128 has no BufferGeometryUtils in the core bundle — do it by hand.
function mergeGeoms(list) {
  let pc=0, ic=0;
  for (const g of list) { pc += g.attributes.position.count; ic += g.index.count; }
  const pos = new Float32Array(pc*3), nor = new Float32Array(pc*3), uvs = new Float32Array(pc*2);
  const idx = pc > 65535 ? new Uint32Array(ic) : new Uint16Array(ic);
  let po=0, uo=0, io=0, vo=0;
  for (const g of list) {
    pos.set(g.attributes.position.array, po);
    nor.set(g.attributes.normal.array, po);
    if (g.attributes.uv) uvs.set(g.attributes.uv.array, uo);
    const gi = g.index.array;
    for (let i=0;i<gi.length;i++) idx[io+i] = gi[i] + vo;
    vo += g.attributes.position.count; po += g.attributes.position.array.length;
    uo += g.attributes.position.count*2; io += gi.length;
    g.dispose();
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  geo.setAttribute('normal',   new THREE.BufferAttribute(nor,3));
  geo.setAttribute('uv',       new THREE.BufferAttribute(uvs,2));
  geo.setIndex(new THREE.BufferAttribute(idx,1));
  geo.computeBoundingSphere();
  return geo;
}

// Surface detail on a grid, not scattered. Random boxes read as debris;
// aligned panels at two fixed depths read as something that was assembled.
function buildGreebles(W, H, t, wallH) {
  if (C.greeble <= 0.01) return;
  const lit = [], dark = [];
  const COLS = 3, cellW = t / COLS;
  const ROWS = Math.max(2, Math.round(wallH / cellW));
  const cellH = wallH / ROWS;
  const D1 = t * 0.009, D2 = t * 0.020;      // only two protrusion depths. ever.

  for (let y=0;y<H;y++) for (let x=0;x<W;x++) {
    if (grid[y][x] !== '#') continue;
    for (let di=0; di<4; di++) {
      const [dx,dz] = DIR[di];
      if (!isWalk(x+dx, y+dz)) continue;
      const alongZ = dx !== 0;
      const at = (u, vy, dep) => [
        x*t + dx*(t/2 + dep/2) + (alongZ ? 0 : u*t),
        vy,
        y*t + dz*(t/2 + dep/2) + (alongZ ? u*t : 0) ];

      for (let c=0;c<COLS;c++) for (let r=0;r<ROWS;r++) {
        const hv = hash3(x*7 + c, y*13 + r, di);
        if (hv > C.greeble * 0.66) continue;
        const u = (c + 0.5)/COLS - 0.5, vy = (r + 0.5) * cellH;
        let sw, sh, dep, arr;
        if (hv < C.greeble*0.26) {                       // flush plate
          sw = cellW*0.84; sh = cellH*0.80; dep = D1; arr = lit;
        } else if (hv < C.greeble*0.48) {                // vertical rib
          sw = cellW*0.26; sh = cellH*0.94; dep = D2; arr = lit;
        } else {                                         // dark slot / recess
          sw = cellW*0.78; sh = cellH*0.22; dep = D1*0.7; arr = dark;
        }
        const [px_,py_,pz_] = at(u, vy, dep);
        arr.push([px_, py_, pz_, alongZ ? dep : sw, sh, alongZ ? sw : dep]);
      }

      // structural post on the left edge of every face — one per tile boundary,
      // so the corridor gets a steady vertical beat instead of noise
      const [ax,ay,az] = at(-0.5, wallH/2, D2);
      lit.push([ax, ay, az, alongZ ? D2 : t*0.075, wallH, alongZ ? t*0.075 : D2]);

      // continuous datum band — the line that says "this was surveyed"
      const bh = wallH * 0.585, [bx,by,bz] = at(0, bh, D2);
