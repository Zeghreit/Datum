      lit.push([bx, by, bz, alongZ ? D2 : t*1.005, t*0.045, alongZ ? t*1.005 : D2]);
    }
  }

  const emit = (arr, mat) => {
    if (!arr.length) return;
    const cap = Math.min(arr.length, 9000);
    const m = new THREE.Matrix4(), q = new THREE.Quaternion();
    const inst = new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1), mat, cap);
    for (let i=0;i<cap;i++) {
      const [a,b,c2,sx,sy,sz] = arr[i];
      m.compose(new THREE.Vector3(a,b,c2), q,
                new THREE.Vector3(Math.max(sx,0.004), Math.max(sy,0.004), Math.max(sz,0.004)));
      inst.setMatrixAt(i, m);
    }
    inst.instanceMatrix.needsUpdate = true;
    world.add(inst);
  };
  emit(lit, M.greeble); emit(dark, M.dark);
}

function scatterLights(W, H, t, wallH) {
  const want = Z.vista ? 3 : Math.max(3, Math.floor(W*H*0.012));
  let placed = 0, guard = 0;
  while (placed < want && guard++ < 4000) {
    const x = (rnd()*W)|0, y = (rnd()*H)|0;
    if (!isWalk(x,y)) continue;
    const l = new THREE.PointLight(0x9fb2c4, 1.5, t*4.5, 2);
    l.position.set(x*t, Math.min(wallH*0.8, t*1.6) || t*1.2, y*t);
    world.add(l); placed++;
  }
}

// ── The vista: everything you will never reach ─────────────────
function buildVista(W, H, t) {
  const cx = W*t/2, cz = H*t/2, len = H*t;
  const R = mulberry32(20260204);
  const rnd2 = (a2,b2) => a2 + R()*(b2-a2);

  // Silhouettes are DARKER than the haze — the fog is the light here and
  // everything else is a hole punched in it. Fewer objects, further away,
  // and most of them only just resolving.
  const SIL = new THREE.MeshLambertMaterial({ color:0x080a0d });
  const DIM = new THREE.MeshLambertMaterial({ color:0x0c0f15 });
  const LAMP = new THREE.MeshBasicMaterial({ color:0xc9902f });

  const bag = { sil:[], dim:[] };
  const box = (w,h,d, x,y,z, ry, into) => {
    const g = new THREE.BoxGeometry(w,h,d);
    if (ry) g.rotateY(ry);
    g.translate(x,y,z);
    (into || bag.sil).push(g);
  };
  const tube = (r,L, x,y,z, rz, ry, into) => {
    const g = new THREE.CylinderGeometry(r,r,L, 8,1);
    if (rz) g.rotateZ(rz);
    if (ry) g.rotateY(ry);
    g.translate(x,y,z);
    (into || bag.sil).push(g);
  };

  // ── it is a room. an impossible one, but a room. ──
  const CEIL = 1500, FLOOR = -1900, WALL = 7000;
  const roof = new THREE.Mesh(new THREE.PlaneGeometry(30000,30000), SIL);
  roof.rotation.x = Math.PI/2; roof.position.set(cx, CEIL, cz); world.add(roof);
  const deep = new THREE.Mesh(new THREE.PlaneGeometry(30000,30000), SIL);
  deep.rotation.x = -Math.PI/2; deep.position.set(cx, FLOOR, cz); world.add(deep);
  for (const [ox,oz,ry] of [[0,-WALL,0],[0,WALL,0],[-WALL,0,Math.PI/2],[WALL,0,Math.PI/2]]) {
    const wl = new THREE.Mesh(new THREE.PlaneGeometry(24000, 4200), SIL);
    wl.position.set(cx+ox, (CEIL+FLOOR)/2, cz+oz); wl.rotation.y = ry; world.add(wl);
  }

  // ── buttresses on the far walls, spaced out so they read as a rhythm ──
  for (const side of [-1,1]) {
    for (let i=0;i<12;i++) {
      const z = cz + (i - 6) * 1150;
      box(200, CEIL-FLOOR, 200, cx + side*(WALL-140), (CEIL+FLOOR)/2, z, 0, bag.dim);
      for (let f=0; f<8; f++)                        // storey bands, a scale ruler
        box(280, 26, 44, cx + side*(WALL-260), FLOOR + 320 + f*400, z, 0, bag.dim);
    }
  }

  // ── towers: three bands instead of five, and all of them further out ──
  const BANDS = [1400, 2800, 4600];
  BANDS.forEach((band, bi) => {
    const n = 4 + bi*2;
    for (let i=0;i<n;i++) {
      const side = R() < 0.5 ? -1 : 1;
      const bx = cx + side * rnd2(band*0.8, band*1.3);
      const bz = cz + rnd2(-1, 1) * (len*1.6 + band*1.5);
      const w = rnd2(140, 380) * (1 + bi*0.4);
      const top = rnd2(-100, CEIL*0.85), bot = rnd2(FLOOR*0.85, -500);
      box(w, top-bot, w*rnd2(0.7,1.4), bx, (top+bot)/2, bz, rnd2(0,1), bag.dim);
      const floors = Math.floor((top-bot)/rnd2(180,320));
      for (let f=1; f<floors; f++)
        box(w*1.14, 20, w*1.14, bx, bot + (top-bot)*f/floors, bz, 0, bag.dim);
      if (R() < 0.22) {                              // a lit window, very rarely
        const l = new THREE.Mesh(new THREE.BoxGeometry(w*0.09, w*0.045, w*0.09), LAMP);
        l.position.set(bx + w*0.55, bot + (top-bot)*rnd2(0.2,0.9), bz);
        world.add(l);
      }
    }
  });

  // ── pipes: far fewer, and none of them near the bridge ──
  // A clear corridor of air is kept around the span so nothing crowds it.
  const CLEAR_X = 900, CLEAR_Z = len * 0.9;
  for (let i=0;i<12;i++) {
    for (let tryN=0; tryN<12; tryN++) {
      const px2 = cx + rnd2(-4000,4000), pz2 = cz + rnd2(-1,1)*len*3.2;
      if (Math.abs(px2-cx) < CLEAR_X && Math.abs(pz2-cz) < CLEAR_Z) continue;
      tube(rnd2(30, 150), rnd2(5000, 15000), px2,
           rnd2(FLOOR*0.8, CEIL*0.8), pz2, Math.PI/2, rnd2(0, Math.PI), bag.dim);
      break;
    }
  }

  // ── a few spans crossing the void, well away from ours ──
  for (let i=0;i<7;i++) {
    const L = rnd2(2600, 6000), y = rnd2(FLOOR*0.7, CEIL*0.7);
    const ry = rnd2(0, Math.PI);
    const bx = cx + (R()<0.5?-1:1)*rnd2(1600, 3800), bz = cz + rnd2(-1,1)*len*2.6;
    box(L, 18, 44, bx, y, bz, ry, bag.dim);
    for (let k=-1;k<=1;k++)
      box(38, rnd2(400,1200), 38, bx + Math.cos(ry)*k*L*0.3, y - rnd2(220,620),
          bz - Math.sin(ry)*k*L*0.3, 0, bag.dim);
  }

  // ── cables out of a ceiling you can only just make out ──
  for (let i=0;i<12;i++) {
    const hx = cx + (R()<0.5?-1:1)*rnd2(1100, 3200), hz = cz + rnd2(-1,1)*len*2.4;
    const drop = rnd2(700, 2400), th = rnd2(6, 18);
    const seg = 10;
    for (let k=0;k<seg;k++) {
      const u = k/(seg-1);
      const sag = Math.sin(u*Math.PI) * drop * 0.09;
      box(th, drop/seg*1.25, th, hx + sag, CEIL - 40 - drop*u, hz + sag*0.5, 0, bag.dim);
    }
  }

  // ── the machines. two, not four, and both a long way off. ──
  const machine = (mx, my, mz, sc, ry, into) => {
    const B = (w,h,d,x,y,z) => box(w,h,d, mx + (x*Math.cos(ry) - z*Math.sin(ry))*sc,
                                          my + y*sc,
                                          mz + (x*Math.sin(ry) + z*Math.cos(ry))*sc,
                                          ry, into);
    B(220, 500, 190,   0, 250, 0);
    B(150, 120, 140,   0, 560, 0);
    B(300,  70, 210,   0, 470, 0);
    for (const sd of [-1,1]) {
      B(58, 420, 58, sd*158, 250, 0);
      B(80, 330, 80, sd*66, -170, 0);
      B(120, 60, 120, sd*66, -340, 0);
    }
    B(70, 260, 70, 0, 640, -60);
  };
  machine(cx - 2600, -520, cz - len*1.1, 2.4, 0.55, bag.dim);
  machine(cx + 3900, -880, cz + len*1.0, 3.4, -0.9, bag.dim);

  if (bag.sil.length) world.add(new THREE.Mesh(mergeGeoms(bag.sil), SIL));
  if (bag.dim.length) world.add(new THREE.Mesh(mergeGeoms(bag.dim), DIM));

  // a faint fill so the silhouettes separate from the haze at all
  const fill = new THREE.HemisphereLight(0x1c222b, 0x070809, 0.34);
  world.add(fill);
}

// keep texel density constant on any box, whatever its size
function uvScale(g, w, h, d, m) {
  const uv = g.attributes.uv; if (!uv) return g;
  const sp = [[d,h],[d,h],[w,d],[w,d],[w,h],[w,h]];
  for (let f=0; f<6; f++) { const [su,sv] = sp[f];
    for (let i=0;i<4;i++) { const k=(f*4+i)*2;
      uv.array[k] *= su/m; uv.array[k+1] *= sv/m; } }
  uv.needsUpdate = true; return g;
}
function pbox(w,h,d) { return uvScale(new THREE.BoxGeometry(w,h,d), w,h,d, C.texelM); }

// ── Wall infrastructure ────────────────────────────────────────
// Pipe lanes are chosen by a hash of (lane, wall side, perpendicular coord),
// never by position along the run — so segments in adjacent tiles agree and
// the pipe reads as one continuous run instead of scattered debris.
let fans = [];
function hash3(a,b,c) {
  let h = (a*374761393 + b*668265263 + c*1274126177) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

function buildProps(W, H, t, wallH) {
  const R = C.props; if (R <= 0.01) return;
  const pipes = [], metal = [], dark = [];
  const LANES = 4;

  for (let y=0;y<H;y++) for (let x=0;x<W;x++) {
    if (!isWalk(x,y)) continue;
    for (let di=0; di<4; di++) {
      const [dx,dz] = DIR[di];
      if (isWalk(x+dx, y+dz)) continue;              // needs a wall to hang off
      const alongZ = dx !== 0;
      const perp = alongZ ? x : y;

      for (let ln=0; ln<LANES; ln++) {
        const hv = hash3(ln, di & 1, perp);          // di&1: pipes wrap around corners
        if (hv > R * 0.5) continue;
        const rad = t * (0.016 + hash3(ln, 5, perp) * 0.030);
        const hy  = Math.min(wallH - rad*2.5,
                    wallH * (0.14 + ln * 0.24) + hash3(ln, 9, perp) * wallH * 0.06);
        const off = t/2 - rad*1.8;
        const cxp = x*t + dx*off, czp = y*t + dz*off;

        const g = new THREE.CylinderGeometry(rad, rad, t*1.04, 7, 1);
        if (alongZ) g.rotateX(Math.PI/2); else g.rotateZ(Math.PI/2);
        g.translate(cxp, hy, czp);
        pipes.push(g);

        // bracket clamping it to the wall, once per tile
        const b = pbox(alongZ ? rad*2.6 : rad*1.1, rad*3.0,
                       alongZ ? rad*1.1 : rad*2.6);
        b.translate(cxp - dx*rad*0.9, hy, czp - dz*rad*0.9);
        metal.push(b);
      }

      // junction boxes — flat plates with a raised lid
      if (hash3(x, y, di+31) < R * 0.16) {
        const w = t*0.22, hh = t*0.17, d = t*0.06;
        const hy = wallH * (0.24 + hash3(x,y,di) * 0.34);
        const b1 = pbox(alongZ ? d : w, hh, alongZ ? w : d);
        b1.translate(x*t + dx*(t/2 - d/2), hy, y*t + dz*(t/2 - d/2));
        metal.push(b1);
        const b2 = pbox(alongZ ? d*0.5 : w*0.6, hh*0.5, alongZ ? w*0.6 : d*0.5);
        b2.translate(x*t + dx*(t/2 - d*1.2), hy, y*t + dz*(t/2 - d*1.2));
        dark.push(b2);
      }

      // extractor fans — animated, so they stay separate meshes. hard cap.
      if (fans.length < 16 && hash3(x, y, di+101) < R * 0.05) {
        const rr = Math.min(t*0.30, wallH*0.24);
        const hy = wallH * 0.5;
        const grp = new THREE.Group();
        const ring = new THREE.Mesh(new THREE.TorusGeometry(rr, rr*0.14, 6, 14), M.metal);
        grp.add(ring);
        const recess = new THREE.Mesh(new THREE.CircleGeometry(rr*0.95, 14), M.dark);
        recess.position.z = -rr*0.24; grp.add(recess);
        const hub = new THREE.Group();
        for (let bl=0; bl<5; bl++) {
          const blade = new THREE.Mesh(
            pbox(rr*0.82, rr*0.30, rr*0.05), M.metal);
          blade.position.x = rr*0.40;
          const holder = new THREE.Group(); holder.add(blade);
          holder.rotation.z = bl * (Math.PI*2/5);
          blade.rotation.x = 0.5;
          hub.add(holder);
        }
        hub.position.z = -rr*0.12; grp.add(hub);
        grp.position.set(x*t + dx*(t/2 - rr*0.2), hy, y*t + dz*(t/2 - rr*0.2));
        grp.rotation.y = Math.atan2(-dx, -dz);
        world.add(grp);
        fans.push({ hub, spd: 0.4 + hash3(x,y,di)*2.6 });
      }
    }

    // sagging cables under the ceiling, spanning the corridor direction
    if (Z.ceiling && hash3(x, y, 7) < R * 0.34) {
      const runZ = isWalk(x, y-1) || isWalk(x, y+1);
      const sag = t * 0.10, top = wallH * 0.93;
      const seg = 5;
      for (let s=0; s<seg; s++) {
        const u = (s + 0.5)/seg - 0.5;
        const dip = Math.cos(u*Math.PI) * sag;
        const th = t*0.022;
        const g = pbox(runZ ? th : t/seg*1.15, th, runZ ? t/seg*1.15 : th);
        g.translate(x*t + (runZ ? 0 : u*t), top - dip, y*t + (runZ ? u*t : 0));
        dark.push(g);
      }
    }
  }

  const add = (arr, mat) => { if (arr.length) world.add(new THREE.Mesh(mergeGeoms(arr), mat)); };
  add(pipes, M.pipe); add(metal, M.metal); add(dark, M.dark);
}

// ── Audio ──────────────────────────────────────────────────────
// All synthesised. Nothing to load, nothing to bake into the file.
// Signal path: sources -> dry -> master, with a parallel send into a dark
// convolver so everything sounds like it is happening inside concrete.
const AU = { ctx:null, master:null, dry:null, send:null, music:null, vol:0.55,
             mode:'ambient', amb:null, cmb:null, apr:null,
             genAmb:true, genCmb:true };

function auInit() {
  if (AU.ctx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const c = AU.ctx = new AC();

  AU.master = c.createGain(); AU.master.gain.value = AU.vol;
  AU.master.connect(c.destination);

  AU.dry = c.createGain(); AU.dry.gain.value = 1.0; AU.dry.connect(AU.master);

  // reverb: 3s of decaying noise, darkened on the way in
  const len = Math.floor(c.sampleRate * 3.0);
  const imp = c.createBuffer(2, len, c.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = imp.getChannelData(ch);
    let last = 0;
    for (let i = 0; i < len; i++) {
      const t = i / len;
      const n = (Math.random() * 2 - 1) * Math.pow(1 - t, 2.6);
      last = last * 0.72 + n * 0.28;                 // one-pole lowpass, darkens the tail
      d[i] = last;
    }
  }
  const conv = c.createConvolver(); conv.buffer = imp;
  const pre = c.createBiquadFilter(); pre.type = 'lowpass'; pre.frequency.value = 2600;
  const wet = c.createGain(); wet.gain.value = 0.60;
  AU.send = c.createGain(); AU.send.gain.value = 1;
  AU.send.connect(pre); pre.connect(conv); conv.connect(wet); wet.connect(AU.master);

  AU.music = c.createGain(); AU.music.gain.value = 0.34;
  AU.music.connect(AU.dry); AU.music.connect(AU.send);

  startAmbient();
  startMusic();
}
addEventListener('pointerdown', auInit, { once:true });
addEventListener('keydown', auInit, { once:true });

function noiseBuffer(sec) {
  const c = AU.ctx, b = c.createBuffer(1, Math.max(1, Math.ceil(c.sampleRate*sec)), c.sampleRate);
  const d = b.getChannelData(0);
  for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
  return b;
}

function out(node, sendAmt) {
  node.connect(AU.dry);
  if (sendAmt) { const g = AU.ctx.createGain(); g.gain.value = sendAmt;
                 node.connect(g); g.connect(AU.send); }
}

function nz(dur, f0, f1, q, gain, type, send) {
  if (!AU.ctx) return;
  const c = AU.ctx, t = c.currentTime;
  const s = c.createBufferSource(); s.buffer = noiseBuffer(dur);
  const fl = c.createBiquadFilter(); fl.type = type || 'lowpass'; fl.Q.value = q;
  fl.frequency.setValueAtTime(Math.max(40,f0), t);
  fl.frequency.exponentialRampToValueAtTime(Math.max(40,f1), t+dur);
  const g = c.createGain();
  g.gain.setValueAtTime(gain, t);
  g.gain.exponentialRampToValueAtTime(0.0008, t+dur);
  s.connect(fl); fl.connect(g); out(g, send === undefined ? 0.35 : send);
  s.start(); s.stop(t+dur);
}

function tn(dur, f0, f1, gain, type, send) {
  if (!AU.ctx) return;
  const c = AU.ctx, t = c.currentTime;
  const o = c.createOscillator(); o.type = type || 'sine';
  o.frequency.setValueAtTime(Math.max(20,f0), t);
  o.frequency.exponentialRampToValueAtTime(Math.max(20,f1), t+dur);
  const g = c.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(gain, t+0.005);
  g.gain.exponentialRampToValueAtTime(0.0008, t+dur);
  o.connect(g); out(g, send === undefined ? 0.30 : send);
  o.start(); o.stop(t+dur);
}

// A struck plate. The old version was five clean partials, which is a chime.
// Real impact is almost all transient and noise: a click, a short filtered
// burst, and a few badly detuned partials that die before you can hum them.
function clank(size, gain, send) {
  if (!AU.ctx) return;
  const c = AU.ctx, t = c.currentTime;
  const base = 900 / Math.max(0.2, size);

  // transient: 6ms of unfiltered noise, the part your ear reads as "metal"
  const s0 = c.createBufferSource(); s0.buffer = noiseBuffer(0.02);
  const hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1400;
  const g0 = c.createGain();
  g0.gain.setValueAtTime(gain * 1.5, t);
  g0.gain.exponentialRampToValueAtTime(0.0008, t + 0.02);
  s0.connect(hp); hp.connect(g0); out(g0, (send === undefined ? 0.3 : send) * 0.5);
  s0.start(); s0.stop(t + 0.02);

  // body: resonant noise, dropping fast
  nz(0.09 * Math.max(0.5, size), base * 2.6, base * 0.5, 3.5, gain * 0.85, 'bandpass', send);
  nz(0.30 * size, base * 0.9, base * 0.18, 1.0, gain * 0.30, 'lowpass', send);

  // ring: only two partials, detuned off any interval, gone in ~120ms
  [1.0, 2.37].forEach((m, i) => {
    const o = c.createOscillator(); o.type = 'triangle';
    o.frequency.setValueAtTime(base * m, t);
    o.frequency.exponentialRampToValueAtTime(base * m * 0.82, t + 0.13);
    const g = c.createGain();
    g.gain.setValueAtTime(gain * (0.16 / (i + 1)), t);
    g.gain.exponentialRampToValueAtTime(0.0006, t + 0.13 * Math.max(0.6, size));
    o.connect(g); out(g, send === undefined ? 0.3 : send);
    o.start(); o.stop(t + 0.16 * Math.max(0.6, size));
  });
}

// A dull hit on something that is not metal: mostly low noise, no pitch at all.
function thud(size, gain, send) {
  if (!AU.ctx) return;
  nz(0.05, 2600 / size, 700 / size, 2.0, gain * 0.8, 'bandpass', send);
  nz(0.26 * size, 420 / size, 60, 0.9, gain, 'lowpass', send);
  nz(0.10 * size, 140 / size, 45, 1.4, gain * 0.7, 'lowpass', send);
}

// Ring-modulated formant burst — a machine trying to make a vocal sound.
function robo(dur, f0, f1, modHz, gain, formants, send) {
  if (!AU.ctx) return;
  const c = AU.ctx, t = c.currentTime;
  const carr = c.createOscillator(); carr.type = 'sawtooth';
  carr.frequency.setValueAtTime(f0, t);
  carr.frequency.exponentialRampToValueAtTime(Math.max(20,f1), t+dur);

  const ring = c.createGain(); ring.gain.value = 0;      // driven entirely by the modulator
  const mod = c.createOscillator(); mod.type = 'square'; mod.frequency.value = modHz;
  const depth = c.createGain(); depth.gain.value = 1;
  mod.connect(depth); depth.connect(ring.gain);
  carr.connect(ring);

  const env = c.createGain();
  env.gain.setValueAtTime(0.0001, t);
  env.gain.linearRampToValueAtTime(gain, t + dur*0.12);
  env.gain.exponentialRampToValueAtTime(0.0008, t + dur);

  (formants || [520, 1180, 2400]).forEach((f, i) => {
    const bp = c.createBiquadFilter(); bp.type = 'bandpass';
    bp.frequency.value = f; bp.Q.value = 7 + i*3;
    const bg = c.createGain(); bg.gain.value = 1 / (i + 1);
    ring.connect(bp); bp.connect(bg); bg.connect(env);
  });
  out(env, send === undefined ? 0.55 : send);
  carr.start(); mod.start(); carr.stop(t+dur); mod.stop(t+dur);
}

const SYNTH = {
  step:  s => { nz(0.14*s, 2000, 240, 1.0, 0.13, 'lowpass', 0.25);
                tn(0.20*s, 96/s, 42/s, 0.18, 'sine', 0.2);
                nz(0.05, 5200, 2600, 7, 0.035, 'bandpass', 0.2); },   // grit underfoot
  turn:  () => nz(0.12, 2600, 700, 3.0, 0.05, 'bandpass'),
  bump:  () => { thud(1.4, 0.16); clank(1.6, 0.10); },
  swap:  () => { nz(0.04, 3600, 1500, 10, 0.09, 'bandpass', 0.2);
                 tn(0.10, 700, 380, 0.06, 'square', 0.2);
                 robo(0.14, 150, 120, 62, 0.05, [420, 900, 1900], 0.3); },

  cut:   () => { nz(0.26, 6400, 520, 1.2, 0.20, 'bandpass', 0.5);
                 tn(0.10, 2400, 700, 0.05, 'sawtooth'); },
  slam:  () => { thud(2.6, 0.32); clank(2.2, 0.18);
                 nz(0.26, 640, 80, 0.9, 0.14, 'lowpass', 0.5); },
  thrust:() => { nz(0.09, 8200, 2600, 9, 0.16, 'bandpass', 0.4);
                 tn(0.07, 1800, 900, 0.07, 'square'); },
  pulse: () => { tn(0.30, 520, 960, 0.08, 'triangle', 0.6);
                 tn(0.36, 790, 1340, 0.05, 'sine', 0.6);
                 nz(0.30, 3000, 1200, 4, 0.03, 'bandpass', 0.6); },

  clank: () => clank(1.0, 0.20),
  crit:  () => { clank(0.55, 0.34, 0.6); thud(1.1, 0.22);
                 nz(0.20, 5200, 900, 5, 0.14, 'bandpass', 0.6); },
  crush: () => { nz(0.42, 900, 130, 1.6, 0.16, 'lowpass', 0.5);
                 nz(0.12, 3400, 900, 5, 0.10, 'bandpass', 0.4);
                 tn(0.34, 88, 52, 0.10, 'square', 0.4); },
  hurt:  () => { thud(1.6, 0.30); clank(1.4, 0.20);
                 nz(0.34, 700, 120, 0.7, 0.14, 'lowpass', 0.5); },
  kill:  () => { thud(3.0, 0.30, 0.6); clank(2.6, 0.22, 0.7);
                 nz(0.75, 1300, 60, 0.6, 0.16, 'lowpass', 0.7);
                 setTimeout(() => clank(3.4, 0.15, 0.8), 190);
                 setTimeout(() => { clank(2.0, 0.09, 0.8); thud(2.2, 0.10, 0.8); }, 430); },
  print: () => { tn(0.55, 170, 300, 0.09, 'sawtooth'); nz(0.60, 1100, 340, 2, 0.09);
                 setTimeout(() => { tn(0.24, 620, 300, 0.11, 'square');
                                    robo(0.30, 190, 150, 74, 0.07); }, 500); },

  // one voice per machine — you should know what is near you with your eyes shut
  seam:  () => { robo(0.42, 118, 82, 41, 0.13, [340, 760, 1500]); nz(0.30, 700, 220, 2, 0.06); },
  dray:  () => { tn(0.5, 58, 52, 0.10, 'square', 0.3); nz(0.4, 300, 120, 1.5, 0.05); },
  tally: () => { for (let i=0;i<5;i++) setTimeout(() =>
                   tn(0.05, 2400 + i*520, 3200 + i*520, 0.055, 'square', 0.5), i*42); },
  seal:  () => { nz(0.55, 4200, 900, 1.4, 0.14, 'bandpass', 0.5);   // hydraulic release
                 setTimeout(() => clank(1.2, 0.24, 0.4), 340); },
  brk:   () => { tn(0.44, 78, 54, 0.24, 'square'); nz(0.44, 520, 150, 1.2, 0.14);
                 robo(0.36, 88, 70, 29, 0.10, [260, 620, 1250]); },
};

// ── Sample bank ────────────────────────────────────────────────
// Every synthesised cue above can be replaced by a real recording. Drop an
// audio file named after the key (step.wav, crush.mp3, music_combat.ogg …) and
// it takes over; anything not supplied keeps the synth, so the game is never
// half-silent while the sound pass is in progress.
const SFXBUF = {};                 // key -> AudioBuffer
const LOOPS  = {};                 // key -> { src, gain }

function playBuf(key, gain) {
  const b = SFXBUF[key]; if (!b || !AU.ctx) return;
  const src = AU.ctx.createBufferSource(); src.buffer = b;
  const g = AU.ctx.createGain(); g.gain.value = gain === undefined ? 1 : gain;
  src.connect(g); out(g, 0.35);
  src.start();
}

function startLoop(key, node, gain) {
  if (!SFXBUF[key] || !AU.ctx || LOOPS[key]) return;
  const src = AU.ctx.createBufferSource();
  src.buffer = SFXBUF[key]; src.loop = true;
  const g = AU.ctx.createGain(); g.gain.value = gain === undefined ? 1 : gain;
  src.connect(g); g.connect(node || AU.music);
  src.start();
  LOOPS[key] = { src, gain: g };
}

// A sample wins over the synth for the same key, and nothing else changes.
const SFX = {};
for (const k in SYNTH) SFX[k] = (...a) => SFXBUF[k] ? playBuf(k) : SYNTH[k](...a);

async function loadSound(key, data) {
  auInit();
  if (!AU.ctx) return false;
  try {
    const buf = data instanceof ArrayBuffer ? data : await data.arrayBuffer();
    SFXBUF[key] = await AU.ctx.decodeAudioData(buf);
    if (/^(music_|amb_)/.test(key)) rewireLoops();
    return true;
  } catch (err) { console.error('sound', key, err); return false; }
}

// Music and ambience are loops, so they get wired into the mixer rather than
// fired. A supplied loop silences the generative layer it replaces.
function rewireLoops() {
  if (!AU.ctx || !AU.amb) return;
  startLoop('music_ambient',  AU.amb, 1);
  startLoop('music_approach', AU.apr, 1);
  startLoop('music_combat',   AU.cmb, 1);
  startLoop('amb_drone', AU.dry, 0.5);
  startLoop('amb_wind',  AU.dry, 0.5);
  if (SFXBUF.music_ambient)  AU.genAmb = false;
  if (SFXBUF.music_combat)   AU.genCmb = false;
}

function tellFor(e) {
  const id = e && e.T ? e.T.id : 'SEAM';
  if (id === 'TALLY') return SFX.tally();
  if (id === 'SEAL')  return SFX.seal();
  if (id === 'BREAK') return SFX.brk();
  if (id === 'DRAY')  return SFX.dray();
  return SFX.seam();
}

// ── Ambient bed ────────────────────────────────────────────────
function startAmbient() {
  const c = AU.ctx;
  const dg = c.createGain(); dg.gain.value = 0.050; out(dg, 0.5);
  const lp = c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = 170; lp.connect(dg);
  [40.6, 41.4, 61.5].forEach(f => {
    const o = c.createOscillator(); o.type='sawtooth'; o.frequency.value = f;
    o.connect(lp); o.start();
  });

  const ws = c.createBufferSource(); ws.buffer = noiseBuffer(4); ws.loop = true;
  const wf = c.createBiquadFilter(); wf.type='bandpass'; wf.Q.value = 0.8; wf.frequency.value = 420;
  const wg = c.createGain(); wg.gain.value = 0.026;
  ws.connect(wf); wf.connect(wg); out(wg, 0.4); ws.start();
  const lfo = c.createOscillator(); lfo.frequency.value = 0.06;
  const lg = c.createGain(); lg.gain.value = 260;
  lfo.connect(lg); lg.connect(wf.frequency); lfo.start();

  scheduleAmbientEvent();
}

// Spontaneous machinery. Everything here is distant and none of it is for you.
const AMB_EVENTS = [
  () => { if (Z && Z.boss) return;                   // its floor has its own sounds
          const n = 2 + (Math.random()*3|0);
          for (let i=0;i<n;i++) setTimeout(() => clank(2.6+Math.random(), 0.055, 0.9),
                                           i*(180 + Math.random()*140)); },
  () => nz(2.6 + Math.random()*2, 300, 90, 1.6, 0.032, 'lowpass', 0.8),  // heavy machine spins up
  () => { nz(0.9, 5000, 1200, 1.1, 0.045, 'bandpass', 0.7); },           // pressure release
  () => { for (let i=0;i<7;i++) setTimeout(() =>                          // chain rattle
            nz(0.05, 3400+Math.random()*2400, 1600, 8, 0.030, 'bandpass', 0.8),
            i*(55+Math.random()*70)); },
  () => { tn(1.9, 44, 39, 0.055, 'triangle', 0.9);                        // structure groaning
          nz(1.9, 180, 70, 1.2, 0.030, 'lowpass', 0.9); },
  () => { tn(0.5, 780, 700, 0.020, 'sine', 0.9);                          // servo whine, far off
          setTimeout(() => tn(0.4, 700, 820, 0.016, 'sine', 0.9), 520); },
  () => clank(4.5, 0.045, 1.0),                                           // one enormous impact
  () => { for (let i=0;i<3;i++) setTimeout(() =>                          // dripping
            tn(0.07, 1500+Math.random()*700, 600, 0.022, 'sine', 0.9),
            i*(400+Math.random()*700)); },
];

// While the boss is still asleep you hear it doing its job somewhere ahead:
// a pile hammer on a slow cycle and a cutting disc spinning up. Both stop the
// moment it turns round, and that silence is the actual warning.
let workshopOn = false, workshopTimer = null;

function hammerBlow(far) {
  const g = far ? 0.075 : 0.13;
  thud(3.4, g, 0.9);
  clank(3.0, g * 0.8, 0.95);
  setTimeout(() => nz(0.9, 420, 90, 1.1, g * 0.4, 'lowpass', 0.95), 70);
}

function sawWhine() {
  if (!AU.ctx) return;
  const c = AU.ctx, t = c.currentTime, dur = 1.6 + Math.random() * 1.4;
  const o = c.createOscillator(); o.type = 'sawtooth';
  o.frequency.setValueAtTime(180, t);
  o.frequency.exponentialRampToValueAtTime(1150, t + dur * 0.35);
  o.frequency.exponentialRampToValueAtTime(760, t + dur);
  const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 7;
  bp.frequency.value = 1500;
  const g = c.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(0.055, t + dur * 0.3);
  g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  o.connect(bp); bp.connect(g); out(g, 0.9);
  o.start(); o.stop(t + dur);
  nz(dur, 3200, 1400, 4, 0.030, 'bandpass', 0.9);
}

function scheduleWorkshop() {
  clearTimeout(workshopTimer);
  workshopTimer = setTimeout(() => {
    if (workshopOn && AU.ctx) {
      if (Math.random() < 0.62) {
        const n = 2 + (Math.random() * 3 | 0);      // a run of blows, then a pause
        for (let i = 0; i < n; i++)
          setTimeout(() => { if (workshopOn) hammerBlow(true); },
                     i * (520 + Math.random() * 160));
      } else sawWhine();
    }
    scheduleWorkshop();
  }, 2200 + Math.random() * 2600);
}
scheduleWorkshop();

// The roar. Not an animal — a machine changing task badly.
function bossRoar() {
  if (!AU.ctx) return;
  const c = AU.ctx, t = c.currentTime;
  for (const [f0, f1, d, g] of [[62, 28, 2.4, 0.30], [93, 41, 2.0, 0.18]]) {
    const o = c.createOscillator(); o.type = 'sawtooth';
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(f1, t + d);
    const lp = c.createBiquadFilter(); lp.type = 'lowpass';
    lp.frequency.setValueAtTime(900, t);
    lp.frequency.exponentialRampToValueAtTime(160, t + d);
    const gg = c.createGain();
    gg.gain.setValueAtTime(0.0001, t);
    gg.gain.linearRampToValueAtTime(g, t + 0.12);
    gg.gain.exponentialRampToValueAtTime(0.0008, t + d);
    o.connect(lp); lp.connect(gg); out(gg, 1.0);
    o.start(); o.stop(t + d + 0.1);
  }
  robo(1.5, 74, 44, 23, 0.16, [190, 460, 980], 1.0);   // it tries to speak
  nz(2.2, 1600, 120, 0.8, 0.16, 'lowpass', 1.0);
  setTimeout(() => { clank(3.6, 0.24, 0.9); thud(3.6, 0.22, 0.9); }, 260);
  setTimeout(() => clank(2.8, 0.16, 0.9), 700);
}

function scheduleAmbientEvent() {
  const wait = 2600 + Math.random()*5200;
  setTimeout(() => {
    if (AU.ctx) AMB_EVENTS[(Math.random()*AMB_EVENTS.length)|0]();
    scheduleAmbientEvent();
  }, wait);
}

// ── Music ──────────────────────────────────────────────────────
// Two generative layers that cross-fade. Ambient is a slow chord that never
// resolves; combat is a piston pulse with a semitone rub on top.
function musicVoice(freq, type, gain) {
  const c = AU.ctx;
  const o = c.createOscillator(); o.type = type; o.frequency.value = freq;
  const g = c.createGain(); g.gain.value = 0;
  o.connect(g); g.connect(AU.music); o.start();
  return { o, g, base: gain };
}

function startMusic() {
  const c = AU.ctx;
  AU.amb = c.createGain(); AU.amb.gain.value = 1; AU.amb.connect(AU.music);
  AU.cmb = c.createGain(); AU.cmb.gain.value = 0; AU.cmb.connect(AU.music);
  AU.apr = c.createGain(); AU.apr.gain.value = 0; AU.apr.connect(AU.music);

  // approach: one low note breathing, and a semitone above it that never
  // resolves. No pulse — the pulse is what arrives when it turns round.
  [[55, 'sawtooth', 0.09], [58.27, 'sawtooth', 0.055], [110, 'triangle', 0.03]]
    .forEach(([f, ty, g], i) => {
      const o = c.createOscillator(); o.type = ty; o.frequency.value = f;
      const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 420;
      const gg = c.createGain(); gg.gain.value = g;
      const lfo = c.createOscillator(); lfo.frequency.value = 0.09 + i * 0.04;
      const ld = c.createGain(); ld.gain.value = g * 0.8;
      lfo.connect(ld); ld.connect(gg.gain); lfo.start();
      o.connect(lp); lp.connect(gg); gg.connect(AU.apr); o.start();
    });

  // ambient chord — low D minor-ish, drifting
  const AMB = [73.4, 87.3, 110.0, 146.8];
  AMB.forEach((f, i) => {
    const o = c.createOscillator(); o.type = i > 1 ? 'triangle' : 'sine'; o.frequency.value = f;
    const g = c.createGain(); g.gain.value = 0.10 / (i*0.5 + 1);
    const lfo = c.createOscillator(); lfo.frequency.value = 0.017 + i*0.011;
    const ld = c.createGain(); ld.gain.value = g.gain.value * 0.85;
    lfo.connect(ld); ld.connect(g.gain); lfo.start();
    o.connect(g); g.connect(AU.amb); o.start();
  });
  // an occasional high bell, very sparse
  setInterval(() => {
    if (!AU.ctx || !AU.genAmb || AU.mode !== 'ambient' || Math.random() > 0.35) return;
    const n = [587.3, 698.5, 880.0][(Math.random()*3)|0];
    tn(3.4, n, n*0.995, 0.022, 'sine', 1.0);
  }, 9000);

  // combat: dark trance. 140bpm, 16 steps, four on the floor, acid line in
  // D minor, and a semitone rub in the pad that never resolves.
  const SCALE = [0, 3, 5, 7, 10, 12, 15];          // D natural minor, useful degrees
  const ROOT  = 36.71;                              // D1
  const ACID  = [0,0,3,0, 5,0,3,7, 0,0,10,0, 7,5,3,0];
  const OPEN  = [0,0,1,0, 0,0,1,0, 0,0,1,0, 0,1,1,0];
  let step = 0;

  setInterval(() => {
    if (!AU.ctx || AU.mode !== 'combat') return;
    const c2 = AU.ctx, t = c2.currentTime, k = step % 16;
    step++;

    // kick on every quarter — pitch drop plus a click, no tone left after 90ms
    if (k % 4 === 0) {
      const o = c2.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(150, t);
      o.frequency.exponentialRampToValueAtTime(38, t + 0.09);
      const g = c2.createGain();
      g.gain.setValueAtTime(0.34, t);
      g.gain.exponentialRampToValueAtTime(0.0008, t + 0.26);
      o.connect(g); g.connect(AU.cmb); o.start(); o.stop(t + 0.28);
      const s2 = c2.createBufferSource(); s2.buffer = noiseBuffer(0.012);
      const cg = c2.createGain(); cg.gain.setValueAtTime(0.10, t);
      cg.gain.exponentialRampToValueAtTime(0.0008, t + 0.012);
      s2.connect(cg); cg.connect(AU.cmb); s2.start(); s2.stop(t + 0.012);
    }

    // offbeat hat
    if (k % 4 === 2) {
      const s3 = c2.createBufferSource(); s3.buffer = noiseBuffer(0.05);
      const hp = c2.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 7200;
      const g = c2.createGain();
      g.gain.setValueAtTime(0.055, t);
      g.gain.exponentialRampToValueAtTime(0.0006, t + 0.045);
      s3.connect(hp); hp.connect(g); g.connect(AU.cmb);
      s3.start(); s3.stop(t + 0.05);
    }

    // acid: saw through a resonant filter with a per-note envelope
    const deg = ACID[k];
    const f = ROOT * Math.pow(2, SCALE[deg % SCALE.length] / 12) * (deg >= 12 ? 2 : 1);
    const o = c2.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f;
    const lp = c2.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 13;
    const peak = OPEN[k] ? 2400 : 900;
    lp.frequency.setValueAtTime(peak, t);
    lp.frequency.exponentialRampToValueAtTime(240, t + 0.19);
    const g = c2.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.085, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0008, t + (OPEN[k] ? 0.22 : 0.11));
    o.connect(lp); lp.connect(g); g.connect(AU.cmb);
    o.start(); o.stop(t + 0.25);

    // the rub: two detuned saws a semitone apart, held across the bar
    if (k === 0) {
      [ROOT*2, ROOT*2*Math.pow(2,1/12)].forEach((fr, i) => {
        const p = c2.createOscillator(); p.type = 'sawtooth'; p.frequency.value = fr * 2;
        const pf = c2.createBiquadFilter(); pf.type = 'lowpass'; pf.frequency.value = 620;
        const pg = c2.createGain();
        pg.gain.setValueAtTime(0.0001, t);
        pg.gain.linearRampToValueAtTime(0.030 / (i+1), t + 0.7);
        pg.gain.linearRampToValueAtTime(0.0001, t + 2.6);
        p.connect(pf); pf.connect(pg); pg.connect(AU.cmb);
        p.start(); p.stop(t + 2.7);
      });
    }

    // a riser every other bar, so the loop has somewhere to go
    if (k === 12 && step % 32 > 16) {
      const r = c2.createBufferSource(); r.buffer = noiseBuffer(1.0);
      const bp = c2.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 3;
      bp.frequency.setValueAtTime(500, t);
      bp.frequency.exponentialRampToValueAtTime(6000, t + 0.95);
      const rg = c2.createGain();
      rg.gain.setValueAtTime(0.0001, t);
      rg.gain.linearRampToValueAtTime(0.055, t + 0.9);
      rg.gain.exponentialRampToValueAtTime(0.0006, t + 1.0);
      r.connect(bp); bp.connect(rg); rg.connect(AU.cmb);
      r.start(); r.stop(t + 1.0);
    }
  }, 107);                                          // 16ths at 140bpm
}

function musicSet(mode) {
  if (!AU.ctx || !AU.amb || AU.mode === mode) return;
  AU.mode = mode;
  const t = AU.ctx.currentTime, dur = mode === 'combat' ? 0.9 : 2.6;
  const set = (node, v) => {
    node.gain.cancelScheduledValues(t);
    node.gain.setValueAtTime(node.gain.value, t);
    node.gain.linearRampToValueAtTime(v, t + dur);
  };
  set(AU.amb, mode === 'ambient' ? 1 : mode === 'approach' ? 0.20 : 0.08);
  set(AU.apr, mode === 'approach' ? 1 : 0);
  set(AU.cmb, mode === 'combat' ? 1 : 0);
}

// ── Player state ───────────────────────────────────────────────

const P = { x:1, y:1, face:0, moving:false, turning:false };  // face 0=N(-z) 1=E 2=S 3=W
const DIR = [[0,-1],[1,0],[0,1],[-1,0]];
let anim = null, queued = null;

// ── Bodies ─────────────────────────────────────────────────────
// Four shells, one occupant. The active body swings and eats every hit.
// The other three are furniture that happens to be shaped like you.
// Four of the eight archetypes, named as facility functions.
const ARCH = {
  BREACH:   { integ:60,  dmg:30, punish:2.2, eye:1.06, fx:'cut',    note:'cuts. thin.' },
  BALLAST:  { integ:150, dmg:10, punish:1.6, eye:0.86, fx:'slam',   note:'absorbs. slow.' },
  VECTOR:   { integ:80,  dmg:16, punish:4.5, eye:1.00, fx:'thrust', note:'waits for the opening.' },
  CONDUIT:  { integ:70,  dmg:0,  punish:1,   eye:0.96, fx:'pulse', repair:34, mends:4,
              note:'mends. cannot strike.' },
};
const LOADOUT = ['BALLAST','BREACH','VECTOR','CONDUIT'];

let bodies = [], active = 0, hurtT = 0, material = 2;
const vitalsEl = document.getElementById('vitals'), deadEl = document.getElementById('dead');

// Pixel portraits — no faces, only optics and exposed cabling. Asymmetric on purpose.
function drawPortrait(kind) {
  const N = 40, [c,x] = mkc(N,N);
  const BONE='#a49d8c', BN_D='#6b6457', BN_L='#cdc5b0', VOID='#0b0b09',
        DARK='#25231c', AMB='#c9902f';
  px(x,0,0,N,N,'#0d0d0c');
  for (let i=0;i<150;i++) px(x,(Math.random()*N)|0,(Math.random()*N)|0,1,1,'#131311');

  if (kind==='BALLAST') {                     // wide plated skull, one slit, heavy jaw
    px(x,5,10,30,24,BN_D); px(x,5,10,30,3,BN_L); px(x,3,14,3,15,BONE); px(x,34,14,3,15,BONE);
    px(x,9,19,22,5,VOID);  px(x,10,20,20,2,AMB);
    px(x,11,29,18,4,BONE); px(x,11,29,18,1,BN_L); for (let i=13;i<28;i+=3) px(x,i,30,1,3,VOID);
    px(x,7,6,6,5,DARK); px(x,27,7,5,4,DARK);
  } else if (kind==='BREACH') {               // narrow, elongated, single forward lens
    px(x,13,3,14,32,BN_D); px(x,13,3,14,2,BN_L);
    px(x,10,9,3,20,BONE); px(x,27,9,3,20,BONE);
    px(x,15,13,10,10,VOID); px(x,17,15,6,6,AMB); px(x,18,16,2,2,BN_L);
    px(x,14,27,12,3,DARK);
    for (let i=0;i<4;i++) px(x,29+i,12+i*4,7-i,2,DARK);   // cabling, one side only
  } else if (kind==='VECTOR') {               // split visor, blade crest, off-centre
    px(x,7,8,26,26,BN_D); px(x,7,8,26,2,BN_L);
    px(x,18,4,4,30,BONE);                                  // crest ridge
    px(x,10,17,7,5,VOID); px(x,23,17,7,5,VOID);
    px(x,11,18,4,2,AMB); px(x,26,18,2,2,AMB);
    px(x,5,12,2,16,BONE); px(x,33,12,2,16,BONE);
    px(x,12,29,16,3,DARK); px(x,4,6,5,4,DARK);
  } else {                                    // CONDUIT — cluster of small optics, cable crown
    px(x,8,10,24,24,BN_D); px(x,9,7,22,3,BN_L); px(x,6,14,2,16,BONE); px(x,32,14,2,16,BONE);
    for (const [a,b] of [[12,16],[18,15],[24,16],[15,23],[21,23],[27,22]]) {
      px(x,a,b,4,4,VOID); px(x,a+1,b+1,2,2,AMB);
    }
    for (let i=0;i<5;i++) px(x,10+i*4, 3+((i%2)*2), 2, 5, DARK);   // cable crown
    px(x,13,30,14,3,BONE);
  }
  px(x,0,0,N,1,VOID); px(x,0,N-1,N,1,VOID); px(x,0,0,1,N,VOID); px(x,N-1,0,1,N,VOID);
  return c;
}
const PORTRAIT = {}; for (const k in ARCH) PORTRAIT[k] = drawPortrait(k);
let portraitSize = [40, 40];

function resetBodies() {
  bodies = LOADOUT.map(k => ({ k, a:ARCH[k], hp:ARCH[k].integ, held:false,
                               mends: ARCH[k].mends || 0 }));
  active = 0;
  vitalsEl.innerHTML = '';
  bodies.forEach((b,i) => {
    const cel = document.createElement('div'); cel.className = 'cel';
    const ic = document.createElement('div'); ic.className = 'ico';
    ic.innerHTML = '<span class="clamp">CLAMPED</span>'; cel.appendChild(ic);
    const pf = document.createElement('div'); pf.className = 'pf';
    const cv = document.createElement('canvas');
    cv.width = portraitSize[0]; cv.height = portraitSize[1];
    cv.style.height = Math.round(112 * portraitSize[1]/portraitSize[0]) + 'px';
    pf.appendChild(cv);
    const ne = document.createElement('div'); ne.className = 'noent'; pf.appendChild(ne);
    const of = document.createElement('div'); of.className = 'off';
    of.textContent = 'OFFLINE'; pf.appendChild(of);
    cel.appendChild(pf);
    b.cv = cv; b.glitch = 0; b.dirty = true;
    const bar = document.createElement('div'); bar.className='bar';
    bar.innerHTML = '<div class="seg"><i></i></div>'; cel.appendChild(bar);
    const nm = document.createElement('div'); nm.className='nm';
    nm.textContent = b.k; cel.appendChild(nm);
    const n = document.createElement('div'); n.className='n';
    n.innerHTML = '<span>'+(i+1)+'</span><span class="hpv"></span>'; cel.appendChild(n);
    const cd = document.createElement('div'); cd.className = 'code';
    cd.textContent = 'SH-0' + (i+1); cel.appendChild(cd);
    vitalsEl.appendChild(cel);
  });
  drawVitals();
}

// A portrait is repainted only while something is wrong with it. Clean shells
// are drawn once and left alone.
function paintPortrait(i, now) {
  const b = bodies[i]; if (!b || !b.cv) return;
  const cv = b.cv, x = cv.getContext('2d'), W = cv.width, H = cv.height;
  const src = PORTRAIT[b.k];
  x.imageSmoothingEnabled = false;

  if (b.hp <= 0) {                                  // dead signal, always moving
    x.fillStyle = '#0a0a09'; x.fillRect(0,0,W,H);
    for (let i2=0;i2<150;i2++) {
      const y = (Math.random()*H)|0, w = 4 + Math.random()*W*0.5;
      const v = (Math.random()*90)|0;
      x.fillStyle = 'rgb('+v+','+v+','+(v+4)+')';
      x.fillRect((Math.random()*W)|0, y, w, 1 + (Math.random()*2|0));
    }
    x.globalAlpha = 0.16; x.drawImage(src, 0, 0, W, H); x.globalAlpha = 1;
    return;
  }

  const gk = (now - b.glitch) / 420;
  if (gk >= 0 && gk < 1) {                          // hit: torn scanlines, channel split
    const amt = (1 - gk);
    x.clearRect(0,0,W,H);
    x.globalAlpha = 0.55 * amt;
    x.drawImage(src, -7*amt, 0, W, H);              // red-ish ghost to the left
    x.globalAlpha = 1;
    x.drawImage(src, 0, 0, W, H);
    const slices = 5 + (amt*7|0);
    for (let n=0;n<slices;n++) {
      const sy = (Math.random()*H)|0, sh = 2 + (Math.random()*10|0);
      const dx = (Math.random()-0.5) * 26 * amt;
      x.drawImage(cv, 0, sy, W, sh, dx, sy, W, sh);
    }
    for (let n=0;n<7;n++) {
      x.fillStyle = 'rgba(192,85,58,'+(0.30*amt)+')';
      x.fillRect(0, (Math.random()*H)|0, W, 1 + (Math.random()*3|0));
    }
    b.dirty = true;
    return;
  }

  if (b.dirty) {                                     // settle back to clean, once
    x.clearRect(0,0,W,H); x.drawImage(src, 0, 0, W, H);
    b.dirty = false;
  }
}

function paintPortraits(now) {
  for (let i=0;i<bodies.length;i++) {
    const b = bodies[i];
    if (!b || !b.cv) continue;
    if (b.hp <= 0) { if (now - (b.lastPaint||0) > 70) { paintPortrait(i, now); b.lastPaint = now; } }
    else if (b.dirty || (now - b.glitch) < 460) paintPortrait(i, now);
  }
}

function drawVitals() {
  bodies.forEach((b,i) => {
    const cel = vitalsEl.children[i];
    cel.className = 'cel' + (i===active ? ' act' : '') + (b.held ? ' held' : '') +
      (b.hp <= 0 ? ' out' : (b.hp < b.a.integ*0.35 ? ' low' : ''));
    if (b.shake) { cel.classList.remove('hit'); void cel.offsetWidth;  // restart it
                   cel.classList.add('hit'); b.shake = false; }
    cel.querySelector('i').style.width = Math.max(0, b.hp/b.a.integ*100) + '%';
    cel.querySelector('.hpv').textContent = Math.max(0, Math.round(b.hp));
    const nm = cel.querySelector('.nm');
    if (nm) nm.textContent = b.a.mends ? b.k + ' \u00d7' + b.mends : b.k;
  });
}

const A = () => bodies[active];
const alive = () => bodies.some(b => b.hp > 0);
function eyeY() { return C.eyeHeight * (A() ? A().a.eye : 1); }

function damagePlayer(d) { damageShell(active, d); }

function damageShell(i, d, src) {
  const b = bodies[i]; if (!b || b.hp <= 0) return;
  b.hp = Math.max(0, b.hp - d); hurtT = performance.now();
  (src === 'crush' ? SFX.crush : SFX.hurt)();
  b.glitch = hurtT; b.dirty = true; b.shake = true;
  if (src === 'crush') {
    if (b.hp <= 0) say('<b>'+b.k+'</b> crushed — shell lost', 'bad');
    else if (b.hp < b.a.integ * 0.35) say('<b>'+b.k+'</b> is being crushed', 'bad');
  } else {
    say('<b>'+b.k+'</b> takes '+Math.round(d)+(b.hp<=0 ? ' — shell lost' : ''),
        b.hp<=0 ? 'bad' : 'warn');
  }
  screenFlash(flashEl, String(Math.min(0.9, 0.3 + d/60)), 320);
  const dd = DIR[P.face];
  burst(rig.position.x + dd[0]*Z.tile*0.35, rig.position.y - 0.15,
        rig.position.z + dd[1]*Z.tile*0.35, 20, [1,0.3,0.14], 2.6, 0.6);
  if (b.hp <= 0) {                          // shell down — the clamp lets go of a corpse
    b.held = false;
    for (const e of enemies) if (e.holds === i) e.holds = -1;
    if (i === active) {
      const next = bodies.findIndex(v => v.hp > 0 && !v.held);
      if (next >= 0) active = next;
      else { const any = bodies.findIndex(v => v.hp > 0); if (any >= 0) active = any; }
    }
  }
  drawVitals();
  if (!alive()) {
    deadEl.style.display = 'flex'; fade.style.opacity = '0.86';
    setTimeout(() => { deadEl.style.display='none'; fade.style.opacity='0';
      for (const k in ZSTATE) delete ZSTATE[k];        // a new sortie, a clean structure
      arriveAt = null;
      rnd = mulberry32(seed); buildZone(); placeInstant(); }, 1600);
  }
}

function inhabit(i) {
  if (!bodies[i] || bodies[i].hp <= 0) { bump(); return; }
  if (bodies[i].held) {                     // reaching for it pulls it out of the clamp
    bodies[i].held = false;
    for (const e of enemies) if (e.holds === i) { e.holds = -1; e.state = 'recover'; e.timer = 1; }
    drawVitals(); SFX.clank();
    say('tore <b>'+bodies[i].k+'</b> loose', 'good');
    return;
  }
  if (i === active) { bump(); return; }
  active = i; drawVitals(); SFX.swap();
  say('inhabiting <b>'+bodies[i].k+'</b>', 'dim');
}

function printBodies() {                    // stand on a terminal, spend material
  const f = facing();
  if (!f || (f.c !== 'P' && f.c !== 'T')) { bump(); return; }
  const key = f.x + ',' + f.y;
  if (zstate().spent.has(key)) {
    say('this one is spent', 'warn'); note('SPENT'); bump(); return;
  }
  if (material <= 0) { say('no stock', 'warn'); bump(); return; }
  zstate().spent.add(key);
  material--; SFX.print();
  say('printed — all shells restored · this one is spent', 'good');
  for (const b of bodies) b.hp = b.a.integ;
  drawVitals();
}

function faceOpen() {                       // never start staring at a wall
  for (let d=0; d<4; d++) if (canEnter(P.x+DIR[d][0], P.y+DIR[d][1])) return d;
  return 0;
}

// Find the door we arrived through and stand in front of it, looking away.
function arrivalSpot() {
  if (!arriveAt) return null;
  const H = grid.length, W = grid[0].length;
  for (let y=0;y<H;y++) for (let x=0;x<W;x++) {
    if (grid[y][x] !== arriveAt) continue;
    for (let d=0; d<4; d++) {
      const nx = x + DIR[d][0], ny = y + DIR[d][1];
      if (canEnter(nx, ny)) return { x:nx, y:ny, face:d };   // d points away from it
    }
  }
  return null;
}

function placeInstant() {
  logged = false; seen = zstate().seen; visible = new Set();
  if (typeof logEl !== 'undefined' && logEl) {
    logEl.innerHTML = '';
    say('printed. no task assigned.', 'dim');
  }
  const arr = arrivalSpot(); arriveAt = null;
  P.x = arr ? arr.x : spawn.x;
  P.y = arr ? arr.y : spawn.y;
  anim = null; queued = null;
  tickClock = null; tickBusy = false; tickNo = 0; material = 2;
  resetBodies();
  P.moving = P.turning = false;
  P.face = arr ? arr.face : faceOpen();
  rig.position.set(P.x*Z.tile, C.eyeHeight, P.y*Z.tile);
  rig.rotation.y = -P.face * Math.PI/2;
  head.position.set(0,0,0); head.rotation.set(0,0,0);
}

function stepDuration() { return C.stepBaseDur * Math.pow(Z.tile/3, C.stepScaleExp); }

const easeOut = k => 1 - Math.pow(1-k, 2.4);

function tryMove(rel) { // 0 fwd, 1 right, 2 back, 3 left
  const d = DIR[(P.face + rel) & 3];
  const nx = P.x + d[0], ny = P.y + d[1];
  if (!canEnter(nx, ny) || occupied(nx, ny)) { bump(); return; }
  const t = Z.tile;
  anim = { kind:'move', t0:performance.now(), dur:stepDuration(),
    from:new THREE.Vector3(P.x*t, rig.position.y, P.y*t),
    to:  new THREE.Vector3(nx*t,  rig.position.y, ny*t) };
  P.x = nx; P.y = ny; P.moving = true;
  SFX.step(Math.pow(Z.tile/3, 0.5));
}

function tryTurn(dir) {
  const from = rig.rotation.y;
  P.face = (P.face + dir + 4) & 3;
  anim = { kind:'turn', t0:performance.now(), dur:C.turnDur, from, to: from - dir*Math.PI/2 };
  SFX.turn();
  P.turning = true;
}

let bumpT = 0;
function bump() { bumpT = performance.now(); SFX.bump(); }

function updateAnim(now) {
  if (anim) {
    const k = Math.min(1, (now - anim.t0) / anim.dur);
    const e = easeOut(k);
    if (anim.kind === 'move') {
      rig.position.lerpVectors(anim.from, anim.to, e);
      const s = Math.sin(k*Math.PI);
      head.position.y = -C.bob * Z.tile/3 * s;
      head.rotation.x = THREE.MathUtils.degToRad(C.lurch) * Math.sin(k*Math.PI*2) * -1;
    } else {
      rig.rotation.y = anim.from + (anim.to - anim.from) * e;
      head.rotation.z = THREE.MathUtils.degToRad(0.8) * Math.sin(k*Math.PI) *
        Math.sign(anim.to - anim.from);
    }
    if (k >= 1) {
      anim = null; P.moving = P.turning = false;
      head.position.set(0,0,0); head.rotation.set(0,0,0);
    }
  }
  if (tickClock && now - tickClock.t0 >= tickClock.dur) {
    tickClock = null; tickBusy = false;
    if (queued) { const q = queued; queued = null; dispatch(q); }
  }
  if (tickBusy && !tickClock) tickBusy = false;      // watchdog
  const bk = (now - bumpT) / 150;
  if (bk >= 0 && bk < 1) {
    const s = Math.sin(bk*Math.PI);
    head.position.z = 0.06 * Z.tile/3 * s;
    head.rotation.x = THREE.MathUtils.degToRad(1.2) * s;
  }
}

function dispatch(a) {
  if (bootEl || menuOpen || tickBusy || !alive()) { queued = a; return; }
  const dur = (a==='TL'||a==='TR') ? C.turnDur
            : (a[0]==='B' && a.length===2) ? C.turnDur : stepDuration();

  if (a === 'F') tryMove(0); else if (a === 'B') tryMove(2);
  else if (a === 'L') tryMove(3); else if (a === 'R') tryMove(1);
  else if (a === 'TL') tryTurn(-1); else if (a === 'TR') tryTurn(1);
  else if (a === 'ATK') playerStrike();
  else if (a === 'PRINT') { const f = facing();
                            (f && (f.c === 'D' || f.c === 'B')) ? useDoor() : printBodies(); }
  else if (a[0] === 'B' && a.length === 2) inhabit(+a[1]);
  else if (a === 'HOLD') { /* bait. costs a tick like everything else. */ }

  tickNo++;
  tickClock = { t0: performance.now(), dur };
  tickBusy = true;
  try { enemyTurn(); }
  catch (err) { say('AI ERROR · ' + err.message, 'bad'); console.error(err); }
}

// ── Input ──────────────────────────────────────────────────────
const MAP = { KeyW:'F', ArrowUp:'F', KeyS:'B', ArrowDown:'B', KeyA:'L', KeyD:'R',
              KeyQ:'TL', ArrowLeft:'TL', KeyE:'TR', ArrowRight:'TR',
              Space:'ATK', KeyX:'HOLD', Enter:'PRINT',
              Digit1:'B0', Digit2:'B1', Digit3:'B2', Digit4:'B3' };
addEventListener('keydown', ev => {
  if (bootEl) { ev.preventDefault(); endBoot(); return; }
  if (MAP[ev.code]) { ev.preventDefault(); dispatch(MAP[ev.code]); return; }
  if (ev.code === 'Tab')   { ev.preventDefault(); transitZone(); }
  if (ev.code === 'Escape') { menuOpen ? closeMenu() : openMenu(); return; }
  if (ev.code === 'KeyG')  { seed = (Math.random()*1e9)|0; rnd = mulberry32(seed);
                             buildZone(); placeInstant(); }
  if (ev.code === 'KeyM')  { mapMode = (mapMode + 1) % 3; }
  if (ev.code === 'KeyH')  { debugOn = !debugOn;
                             document.getElementById('panel').style.display =
                               debugOn ? 'block' : 'none'; }
});

function useDoor() {
  const f = facing();
  if (!f || (f.c !== 'D' && f.c !== 'B')) { bump(); return; }
  if (enemies.some(e => e.hp > 0 && e.T && e.T.boss)) {
    say('the door will not open. something is still working.', 'warn');
    note('SEALED'); bump(); return;
  }
  say(f.c === 'B' ? 'back the way you came' : 'descending', 'dim');
  transitZone(f.c === 'B' ? -1 : 1);
}

const fade = document.getElementById('fade');
let arriveAt = null;                       // which door we should appear beside

function transitZone(dir) {
  fade.style.opacity = '1';
  const step = dir || 1;
  // going down puts us at the next stratum's entry door; coming back up puts
  // us at the previous one's descent door — the same one we left through.
  arriveAt = step > 0 ? 'B' : 'D';
  setTimeout(() => {
    zoneIdx = (zoneIdx + step + ZONES.length) % ZONES.length;
    buildZone(); placeInstant();
    fade.style.opacity = '0';
  }, 190);
}

function threatLine() {
  const tal = enemies.find(e => e.hp>0 && e.T && e.T.ai==='surveyor' && e.count>0);
  if (tal) return '<span style="color:#c9902f">COUNTING ' + tal.count + '/' +
                  C.tallyTicks + '</span>';
  let best = null, bd = 99;
  for (const e of enemies) {
    if (e.hp <= 0 || e.state === 'dormant') continue;
    const d = Math.abs(e.x-P.x)+Math.abs(e.y-P.y);
    if (d < bd) { bd = d; best = e; }
  }
  if (!best) return '<span style="color:#4a4a46">' +
                    (logged ? 'LOGGED' : 'clear') + '</span>';
  const col = (best.state==='wind'||best.state==='strike') ? '#c9902f'
            : best.state==='recover' ? '#8fbf7a' : '#8d8d88';
  const id = best.T ? best.T.id + ' ' : '';
  return '<span style="color:'+col+'">'+id+best.state.toUpperCase()+' '+bd+'t</span>';
}

function applyEnemySheet(img) {

function applyPortraitStrip(img) {

addEventListener('dragover', e => { e.preventDefault(); });
addEventListener('drop', e => {
  e.preventDefault();
  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if (f && (/^audio\//.test(f.type) || /\.(wav|mp3|ogg|m4a|flac)$/i.test(f.name))) {
    const key = f.name.replace(/\.[^.]+$/, '').replace(/[^a-z0-9_]/gi, '_').toLowerCase();
    loadSound(key, f).then(ok => note(ok ? 'SOUND · ' + key : 'DECODE FAILED'));
    return;
  }
  if (!f || !/^image\//.test(f.type)) { note('NOT AN IMAGE OR SOUND'); return; }
  const img = new Image();
  img.onload = () => {
    if (/portrait|avatar|party/i.test(f.name)) applyPortraitStrip(img);
    else if (/texture|tile|wall/i.test(f.name)) applyTextureStrip(img);
    else applyEnemySheet(img);
    URL.revokeObjectURL(img.src);
  };
  img.onerror = () => note('LOAD FAILED');
  img.src = URL.createObjectURL(f);
});

// Left as placeholders here. datum_inline.py swaps them for data URIs so the
// prototype stays a single self-contained file. Untouched = procedural sprites.
const EMBED = { enemies: "__ENEMIES__", portraits: "__PORTRAITS__",
                textures: "__TEXTURES__" };
const EMBED_SFX = "__SFX__";       // JSON map of key -> data URI, or the marker

function loadEmbeddedSfx() {
  if (!EMBED_SFX || EMBED_SFX.indexOf('{') !== 0) return;
  let map; try { map = JSON.parse(EMBED_SFX); } catch (e) { return; }
  const b64 = (uri) => {
    const bin = atob(uri.slice(uri.indexOf(',') + 1));
    const a = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
    return a.buffer;
  };
  const go = () => { for (const k in map) loadSound(k, b64(map[k])); };
  if (AU.ctx) go(); else addEventListener('pointerdown', go, { once:true });
  addEventListener('keydown', go, { once:true });
}

// Loaded tiles use MIRRORED wrapping — that makes any texture seamless no
// matter how it was authored, and on panel surfaces the symmetry reads as
// manufactured rather than as a mistake.
function applyTextureStrip(img) {
  const n = 4, w = Math.floor(img.width / n), h = img.height;
  const slots = [['wall', M.wall], ['floor', M.floor],
                 ['ceil', M.ceil], ['metal', M.pipe]];
  slots.forEach(([, mat], i) => {
    const [c, x] = mkc(w, h);
    x.drawImage(img, i*w, 0, w, h, 0, 0, w, h);
    const t = new THREE.CanvasTexture(c);
    t.magFilter = THREE.NearestFilter;
    t.minFilter = THREE.NearestMipmapNearestFilter;
    t.wrapS = t.wrapT = THREE.MirroredRepeatWrapping;
    mat.map = t; mat.color.setScalar(1); mat.needsUpdate = true;
  });
  // greebles, props and structural plates all borrow the metal tile
  for (const m of [M.greeble, M.metal, M.dark]) { m.map = M.pipe.map; m.needsUpdate = true; }
  M.metal.color.setScalar(0.62); M.dark.color.setScalar(0.24);
  rnd = mulberry32(seed); buildZone(); placeInstant();
  note('TEXTURES · ' + w + '×' + h + ' ×' + n);
}

function loadEmbedded() {
  const go = (src, fn) => {
    if (!src || src.indexOf('data:') !== 0) return;
    const i = new Image(); i.onload = () => fn(i); i.src = src;
  };
  go(EMBED.textures, applyTextureStrip);
  go(EMBED.portraits, applyPortraitStrip);
  go(EMBED.enemies, applyEnemySheet);
  loadEmbeddedSfx();
}

function runBoot() {

        typeSfx(Math.min(14, 4 + (d.textContent||'').length / 4));

function drawBoss() {

  const key = live.map(e => e.T.id).join('|');

// ── Minimap ────────────────────────────────────────────────────
// mapMode: 0 off, 1 layout only, 2 layout + everything (debug reveal)
// mapMode 0 = drawn as you go, 1 = whole layout, 2 = layout + everything (debug)
let mapMode = 0, debugOn = false;
let seen = new Set(), visible = new Set();

// A stratum remembers. Come back through a door and the machines you broke are
// still broken, and the corridors you walked are still on the map.
const ZSTATE = {};
function zstate() {
  const id = Z ? Z.id : '?';
  return ZSTATE[id] || (ZSTATE[id] = { killed: new Set(), seen: new Set(),
                                       spent: new Set() });
}

function updateSeen() {
  visible = new Set();
  if (!grid.length) return;
  const R = C.sight, FAR = C.sight * 3;
  const H = grid.length, W = grid[0].length;
  for (let y = Math.max(0,P.y-FAR); y <= Math.min(H-1,P.y+FAR); y++)
    for (let x = Math.max(0,P.x-FAR); x <= Math.min(W-1,P.x+FAR); x++) {
      const cheb = Math.max(Math.abs(x-P.x), Math.abs(y-P.y));
      // close by you simply know; further out you must have a clear line
      if (cheb <= R || los(P.x, P.y, x, y)) {
        const k = x + ',' + y;
        visible.add(k); seen.add(k);
      }
    }
}
const mini = document.getElementById('mini'), mctx = mini.getContext('2d');
const STATE_COL = { dormant:'#55554e', stalk:'#cfcabe', wind:'#c9902f',
                    strike:'#e8622f', recover:'#8fbf7a', dead:'#332222' };

function drawMini() {
  const S = 248, H = grid.length, W = grid[0].length;
  const s = Math.max(3, Math.floor(Math.min((S-16)/W, (S-16)/H)));
  const ox = (S - W*s)/2, oy = (S - H*s)/2;
  mctx.clearRect(0,0,S,S);

  const known = (x,y) => mapMode > 0 || seen.has(x + ',' + y);
  const lit   = (x,y) => mapMode > 0 || visible.has(x + ',' + y);

  for (let y=0;y<H;y++) for (let x=0;x<W;x++) {
    const c = grid[y][x];
    if (!known(x,y)) continue;
    const near = lit(x,y);
    if (c === '#') mctx.fillStyle = near ? '#2e2e26' : '#1c1c17';
    else if (WALK.has(c)) mctx.fillStyle = near ? '#4d4d45' : '#2c2c27';
    else continue;
    mctx.fillRect(ox+x*s, oy+y*s, s, s);
  }

  // printers and doors, remembered once seen
  for (let y=0;y<H;y++) for (let x=0;x<W;x++) {
    const c = grid[y][x];
    if (c !== 'P' && c !== 'D' && c !== 'T') continue;
    if (!known(x,y)) continue;
    const dead = (c === 'P' || c === 'T') && zstate().spent.has(x + ',' + y);
    mctx.fillStyle = dead ? '#3a3630' : (lit(x,y) ? '#c9902f' : '#6a4d1a');
    if (c === 'D') mctx.fillRect(ox+x*s+s*0.12, oy+y*s+s*0.30, s*0.76, s*0.40);
    else           mctx.fillRect(ox+x*s+s*0.24, oy+y*s+s*0.24, s*0.52, s*0.52);
  }

  // anything you can currently see gets drawn even outside reveal mode
  if (mapMode < 2) {
    for (const e of enemies) {
      if (e.hp <= 0 || !visible.has(e.x + ',' + e.y)) continue;
      const role = e.T ? e.T.ai : 'fighter';
      mctx.fillStyle = role === 'hauler'   ? '#6f7f9a'
                     : role === 'surveyor' ? (e.count ? '#c9902f' : '#7a8f6a')
                     : (e.T && e.T.boss)   ? '#c0553a' : '#cfcabe';
      mctx.beginPath();
      mctx.arc(ox+e.x*s+s/2, oy+e.y*s+s/2, s*0.32, 0, 6.2832); mctx.fill();
    }
  }

  if (mapMode === 2) {
    for (const e of enemies) {
      const cx = ox + e.x*s + s/2, cy = oy + e.y*s + s/2;
      // sightline when it can actually see you
      if (e.hp > 0 && e.state !== 'dormant' && los(e.x, e.y, P.x, P.y)) {
        mctx.strokeStyle = 'rgba(201,144,47,.22)'; mctx.lineWidth = 1;
        mctx.beginPath(); mctx.moveTo(cx, cy);
        mctx.lineTo(ox + P.x*s + s/2, oy + P.y*s + s/2); mctx.stroke();
      }
      const role = e.T ? e.T.ai : 'fighter';
      mctx.fillStyle = role === 'hauler'   ? '#6f7f9a'
                     : role === 'surveyor' ? (e.count ? '#c9902f' : '#7a8f6a')
                     : (STATE_COL[e.state] || '#888');
      mctx.beginPath(); mctx.arc(cx, cy, s*0.34, 0, 6.2832); mctx.fill();
      // facing tick — the tile it will strike
      const d = DIR[e.face];
      mctx.strokeStyle = mctx.fillStyle; mctx.lineWidth = 1.6;
      mctx.beginPath(); mctx.moveTo(cx, cy);
      mctx.lineTo(cx + d[0]*s*0.85, cy + d[1]*s*0.85); mctx.stroke();
      // integrity remaining
      if (e.hp > 0) {
        mctx.fillStyle = '#0a0a09';
        mctx.fillRect(ox+e.x*s, oy+e.y*s+s-2, s, 2);
        mctx.fillStyle = '#8fbf7a';
        mctx.fillRect(ox+e.x*s, oy+e.y*s+s-2, s*Math.max(0,e.hp/(e.T?e.T.hp:C.enemyHP)), 2);
      }
    }
  }

  // player + facing
  const px = ox + P.x*s + s/2, py = oy + P.y*s + s/2, pd = DIR[P.face];
  mctx.fillStyle = '#f0ece2';
  mctx.beginPath(); mctx.arc(px, py, s*0.3, 0, 6.2832); mctx.fill();
  mctx.strokeStyle = '#f0ece2'; mctx.lineWidth = 1.6;
  mctx.beginPath(); mctx.moveTo(px, py);
  mctx.lineTo(px + pd[0]*s*0.95, py + pd[1]*s*0.95); mctx.stroke();

  if (mapMode > 0) {
    mctx.font = '9px ui-monospace, Menlo, monospace';
    mctx.fillStyle = '#5c5c58';
    mctx.fillText(mapMode === 1 ? 'LAYOUT'
                : 'REVEAL  ' + enemies.filter(e=>e.hp>0).length + ' active', 6, S-6);
  }
}

let lastT = performance.now();
function tick(now) {
  requestAnimationFrame(tick);
  const dt = Math.min(0.05, (now - lastT)/1000); lastT = now;
  updateAnim(now);
  paintPortraits(now);
  updateSeen();
  updateEnemies(now);
  updateParticles(dt);
  for (const f of fans) f.hub.rotation.z += f.spd * dt;
  drawBoss();
  if (AU.ctx) {
    const bosses = enemies.filter(e => e.hp > 0 && e.T && e.T.boss);
    const awake = bosses.some(e => !e.asleep);
    workshopOn = bosses.some(e => e.asleep);
    musicSet(awake ? 'combat' : workshopOn ? 'approach' : 'ambient');
  }
  rig.position.y += (eyeY() - rig.position.y) * 0.16;   // shells sit at different heights
  // no camera roll on damage — the hit reads on the portrait instead

  if (Math.abs(RT.height - C.renderH) > 4) sizeRT();
  renderer.setRenderTarget(RT);
  renderer.render(scene, camera);
  renderer.setRenderTarget(null);
  renderer.render(blitScene, blitCam);

  drawSwing(now);
  if (impLight) {
    const ik = (now - impT) / 190;
    impLight.intensity = ik < 1 ? (impLight.userData.peak || 5) * Math.pow(1 - ik, 2) : 0;
  }
  drawMini();
  frames++;
  if (now - fpsT > 500) { fps = Math.round(frames*1000/(now-fpsT)); frames=0; fpsT=now; }
  hud.innerHTML =
    '<span style="color:#2e3136;font-size:9px;letter-spacing:.22em">' +
      'LVL-' + String(zoneIdx+1).padStart(2,'0') + '</span><br>' +
    '<b>'+Z.name+'</b> &nbsp; <span class="amber">'+material+'</span> stock' +
    (() => { const f = facing(); if (!f) return '';
   return f.c === 'D' ? ' &nbsp;<span class="amber">[ENTER] descend</span>'
        : f.c === 'B' ? ' &nbsp;<span class="amber">[ENTER] go back</span>'
                      : ' &nbsp;<span class="amber">[ENTER] print</span>'; })() +
    '<br>' + threatLine() +
    (debugOn ? '<br><span style="color:#4a4a46">' +
      'tile '+Z.tile+'m · wall '+(Z.wallH||Math.round(Z.tile*C.wallHMul))+'m · ' +
      'step '+Math.round(stepDuration())+'ms<br>' +
      'cell '+P.x+','+P.y+' · facing '+FACE[P.face]+' · tick '+tickNo+' · '+fps+' fps</span>'
    : '');
}
requestAnimationFrame(tick);

addEventListener('error', ev => {
  if (typeof say === 'function') say('ERROR · ' + ev.message, 'bad');
});

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  sizeRT(); sizeFX();
});
</script>
</body>
</html>
