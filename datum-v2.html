<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>DATUM v2 · DRAFT</title>
<style>
  /* ── DATUM v2 interface ─────────────────────────────────────────
     Layout from Kubik: a mode plate top-left, three outlined readouts
     top-right, a bottom sheet with one big number and one big action,
     corner-cut plates, hazard stripes for danger. Geometric sans, not
     monospace — the registry speaks in words, not in letterforms.     */
  :root {
    --bg:#0a0b0d; --plate:#15171b; --plate2:#1c1f24;
    --line:#2c3037; --line2:#3a3f47;
    --ink:#e8e9ec; --dim:#8b919b; --dim2:#5d636c;
    --amb:#e8a63c; --red:#e0563a;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; background:var(--bg); overflow:hidden;
    font-family:"Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif;
    color:var(--ink); -webkit-font-smoothing:antialiased; }
  canvas { display:block; }
  /* the stage never sits UNDER the draft sheet: it shrinks instead */
  body > canvas { position:fixed; left:0; top:0; width:100%; height:100%;
    image-rendering:pixelated; z-index:0; }
  body.draft > canvas { height:calc(100% - 344px); }

  /* ── top bar ─────────────────────────────────────────────────── */
  #top { position:fixed; top:0; left:0; right:0; height:64px; display:flex;
         align-items:flex-start; justify-content:space-between; padding:14px 16px;
         pointer-events:none; z-index:20; }
  #modewrap { display:flex; align-items:flex-start; gap:10px; }
  #burger { width:56px; height:56px; border:1px solid var(--line2); background:var(--plate);
    display:flex; align-items:center; justify-content:center; }
  #burger i { display:block; width:22px; height:2px; background:var(--ink);
    box-shadow:0 -7px 0 var(--ink), 0 7px 0 var(--ink); }
  #mode { height:56px; padding:0 30px 0 18px; display:flex; align-items:center;
    background:var(--ink); color:#0a0b0d; font-weight:700; font-size:19px;
    letter-spacing:.14em; text-transform:uppercase;
    clip-path:polygon(0 0, 100% 0, calc(100% - 22px) 100%, 0 100%); }
  #mode::before { content:"■"; margin-right:10px; font-size:13px; }
  #mode.amber { background:var(--amb); }
  #mode.danger { background:var(--red); color:#fff; }

  #crumbs { position:relative; margin:2px 0 0 66px; font-size:11px; letter-spacing:.18em;
    color:var(--dim2); text-transform:uppercase; }

  #stats { display:flex; gap:8px; }
  .stat { width:82px; height:56px; border:1px solid var(--line2); background:rgba(10,11,13,.72);
          padding:7px 9px 0; }
  .stat b { display:block; font-size:21px; font-weight:700; letter-spacing:.02em; line-height:1; }
  .stat span { display:block; margin-top:5px; font-size:9px; letter-spacing:.18em;
               color:var(--dim2); text-transform:uppercase; }
  .stat.hot b { color:var(--amb); }
  .stat.warn b { color:var(--red); }

  /* ── crosshair ───────────────────────────────────────────────── */
  #cross { position:fixed; left:50%; top:50%; width:16px; height:16px; z-index:18;
    transform:translate(-50%,-50%); pointer-events:none; opacity:.55; }
  #cross::before, #cross::after { content:""; position:absolute; background:var(--ink); }
  #cross::before { left:7px; top:0; width:2px; height:16px; }
  #cross::after  { top:7px; left:0; height:2px; width:16px; }
  #cross.hot::before, #cross.hot::after { background:var(--amb); }
  #cross.hot { opacity:1; }

  /* ── gate prompt ─────────────────────────────────────────────── */
  #prompt { position:fixed; left:50%; top:calc(50% + 46px); transform:translateX(-50%);
    z-index:18; font-size:12px; letter-spacing:.2em; text-transform:uppercase;
    color:var(--amb); background:rgba(8,9,11,.72); padding:7px 14px;
    display:none; white-space:nowrap;
    clip-path:polygon(0 0, 100% 0, 100% calc(100% - 9px), calc(100% - 9px) 100%, 0 100%); }
  #prompt.on { display:block; }
  #prompt b { color:#160f02; background:var(--amb); padding:2px 7px; margin-right:9px; }

  /* ── pointer hint: a toast, never a blocker ──────────────────── */
  #lock { position:fixed; left:50%; bottom:70px; transform:translateX(-50%); z-index:22;
    font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--dim);
    background:rgba(8,9,11,.8); padding:8px 16px; pointer-events:none;
    clip-path:polygon(0 0, 100% 0, 100% calc(100% - 9px), calc(100% - 9px) 100%, 0 100%);
    transition:opacity .4s linear; }
  #lock.off { opacity:0; }

  /* ── hint line ───────────────────────────────────────────────── */
  #hint { position:fixed; left:16px; bottom:16px; font-size:11px; letter-spacing:.1em;
    color:#7d838d; line-height:1.9; z-index:20; text-transform:uppercase;
    background:rgba(8,9,11,.72); padding:7px 13px 8px 11px;
    clip-path:polygon(0 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%); }
  #hint b { color:#b9bfc8; font-weight:600; }

  /* ── fab: the cut ────────────────────────────────────────────── */
  #fab { position:fixed; right:22px; bottom:22px; width:60px; height:60px; z-index:21;
    border:1px solid var(--line2); background:rgba(10,11,13,.8); transform:rotate(45deg);
    display:flex; align-items:center; justify-content:center; cursor:pointer; }
  #fab span { transform:rotate(-45deg); font-size:10px; letter-spacing:.14em; color:var(--ink); }
  #fab:hover { border-color:var(--amb); }
  #fab:hover span { color:var(--amb); }

  #hazard { position:fixed; left:0; right:0; bottom:0; height:9px; z-index:19; display:none;
    background:repeating-linear-gradient(-45deg, var(--red) 0 12px, #1a0d09 12px 24px); }
  #hazard.on { display:block; }

  /* ── draft sheet ─────────────────────────────────────────────── */
  #sheet { position:fixed; left:0; right:0; bottom:0; z-index:30; display:none;
    background:var(--plate); border-top:1px solid var(--line2); padding:0 0 14px; }
  #sheet.on { display:block; }
  #sheet .stripe { height:9px;
    background:repeating-linear-gradient(-45deg, var(--amb) 0 12px, #241a08 12px 24px); }

  .sheetrow { display:flex; align-items:center; gap:26px; padding:16px 22px 10px; }
  #bigval { font-size:62px; font-weight:700; line-height:.9; letter-spacing:-.02em; color:var(--dim2); }
  #bigval.sel { color:var(--ink); }
  #biglab { font-size:11px; letter-spacing:.22em; color:var(--dim2); text-transform:uppercase;
            margin-top:8px; }
  #prompt2 { flex:1; font-size:12px; letter-spacing:.06em; color:var(--dim); line-height:1.7; }
  #prompt2 em { color:var(--amb); font-style:normal; }

  #cards { display:flex; gap:10px; padding:0 22px; }
  .card { flex:1; min-height:128px; border:1px solid var(--line2); background:var(--plate2);
    padding:11px 12px 9px; cursor:pointer; position:relative;
    clip-path:polygon(0 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%); }
  .card:hover { border-color:var(--dim); }
  .card.sel { background:var(--ink); color:#0a0b0d; border-color:var(--ink); }
  .card.sel .k, .card.sel .f b { color:#0a0b0d; }
  .card.sel .f { color:#3b3f46; }
  .card .k { font-size:10px; letter-spacing:.2em; color:var(--dim2); text-transform:uppercase; }
  .card .n { font-size:13px; font-weight:700; letter-spacing:.01em; margin:7px 0 8px; line-height:1.35; }
  .card .f { font-size:11px; letter-spacing:.06em; color:var(--dim); line-height:1.8; }
  .card .f b { color:var(--ink); font-weight:600; }
  .card .p { position:absolute; right:11px; bottom:9px; font-size:12px; font-weight:700;
             color:var(--amb); letter-spacing:.04em; }
  .card.sel .p { color:#8a5a10; }
  .card.blind { border-style:dashed; }
  .card.blind .n { color:var(--dim2); letter-spacing:.3em; }

  #actbar { display:flex; gap:10px; padding:12px 22px 0; }
  #place { flex:1; height:56px; border:0; background:var(--amb); color:#140d02;
    font:inherit; font-size:16px; font-weight:700; letter-spacing:.2em; text-transform:uppercase;
    cursor:pointer; clip-path:polygon(0 0, 100% 0, calc(100% - 18px) 100%, 0 100%); }
  #place:disabled { background:#2a2d33; color:var(--dim2); cursor:default; }
  #cancel { width:56px; height:56px; border:1px solid var(--line2); background:transparent;
    color:var(--dim); font-size:20px; cursor:pointer; }

  /* ── cut view ────────────────────────────────────────────────── */
  #cut { position:fixed; inset:0; z-index:40; background:rgba(6,7,8,.97); display:none;
         padding:64px 26px 26px; }
  #cut.on { display:flex; gap:26px; }
  #cutc { flex:0 0 auto; }
  #cutside { flex:1; max-width:360px; font-size:11px; letter-spacing:.06em; color:var(--dim);
             line-height:2; }
  #cutside h3 { font-size:10px; letter-spacing:.22em; color:var(--dim2); text-transform:uppercase;
                margin:0 0 10px; font-weight:600; }
  #cutside .row { display:flex; justify-content:space-between; border-bottom:1px solid #171a1e;
                  padding:5px 0; }
  #cutside .row b { color:var(--ink); font-weight:600; }

  /* ── end screen ──────────────────────────────────────────────── */
  #end { position:fixed; inset:0; z-index:50; background:rgba(6,7,8,.96); display:none;
         align-items:center; justify-content:center; flex-direction:column; gap:18px; }
  #end.on { display:flex; }
  #end h1 { font-size:34px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; }
  #end p { color:var(--dim); font-size:13px; letter-spacing:.06em; max-width:520px; text-align:center; }
  #end button { height:52px; padding:0 34px; border:0; background:var(--ink); color:#0a0b0d;
    font:inherit; font-size:14px; font-weight:700; letter-spacing:.18em; text-transform:uppercase;
    cursor:pointer; }
</style>
</head>
<body>

<div id="top">
  <div id="modewrap">
    <div id="burger"><i></i></div>
    <div id="mode">descend</div>
  </div>
  <div id="stats">
    <div class="stat"><b id="s-tick">0</b><span>такт</span></div>
    <div class="stat" id="s-syncbox"><b id="s-sync">25</b><span>сверка</span></div>
    <div class="stat"><b id="s-rooms">1</b><span>отсеков</span></div>
  </div>
</div>
<div id="crumbs">отсек 1 · шлюзов 2</div>

<div id="cross"></div>
<div id="prompt"></div>

<div id="hint">
  <b>wasd</b> идти · <b>мышь</b> смотреть · <b>e</b> шлюз · <b>m</b> разрез<br>
  <b>esc</b> курсор · <b>r</b> новый забег
</div>

<div id="fab"><span>cut</span></div>
<div id="hazard"></div>

<div id="lock">клик по экрану — смотреть мышью · или тяни мышью с зажатой кнопкой</div>

<div id="sheet">
  <div class="stripe"></div>
  <div class="sheetrow">
    <div>
      <div id="bigval">—</div>
      <div id="biglab">масштаб</div>
    </div>
    <div id="prompt2"></div>
  </div>
  <div id="cards"></div>
  <div id="actbar">
    <button id="cancel">✕</button>
    <button id="place" disabled>поставить</button>
  </div>
</div>

<div id="cut">
  <div id="cutc"><canvas id="cutcanvas"></canvas></div>
  <div id="cutside"></div>
</div>

<div id="end">
  <h1 id="endtitle">тупик</h1>
  <p id="endtext"></p>
  <button id="restart">новый забег</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ────────────────────────────────────────────────────────────────
   DATUM v2 — the compartments are the level.

   Rules this file obeys (author, 05.11):
   - a compartment is a box with gates in its walls, floor or ceiling;
   - you draft only while standing at a gate, and only with E;
   - the gate you drafted through is also the way back;
   - a turn is a GATE-TO-GATE transition. Walking inside costs nothing;
   - inside a compartment you move like a shooter: wasd, mouse look.
   ──────────────────────────────────────────────────────────────── */

const TEXSTRIP = "__TEXTURES__";     // baked by build/make_v2.py
const BUILD = 'dev';

const C = {
  size:      8.6,     // outer metres of a compartment
  inner:     8.2,     // wall to wall
  height:    3.5,
  wallT:     0.2,
  gateW:     2.4,
  gateH:     2.7,
  eye:       1.62,
  speed:     4.0,
  reach:     2.4,     // how close to a gate before E does anything
  renderH:   272,
  jitter:    160,
  syncEvery: 25,
  fog:       0.016,
};

// ── records ─────────────────────────────────────────────────────
const CARDS = [
  { id:'T-01', role:'ПРОХ', size:4,  pit:'—', type:'проход', ticks:5,  eff:'две двери без спуска' },
  { id:'T-02', role:'ПРОХ', size:3,  pit:'—', type:'проход', ticks:4,  down:true, eff:'шахта вниз' },
  { id:'T-03', role:'ПРОХ', size:6,  pit:'—', type:'проход', ticks:7,  down:true, eff:'шахта вниз, два выхода' },
  { id:'T-04', role:'ПРОХ', size:4,  pit:'+', type:'проход', ticks:5,  down:true, eff:'шахта вниз и питание' },
  { id:'T-05', role:'ПРОХ', size:3,  pit:'—', type:'проход', ticks:4,  up:true,   eff:'люк вверх, узкий' },
  { id:'T-06', role:'ПРОХ', size:11, pit:'-', type:'проход', ticks:10, down:true, up:true, eff:'зал на два яруса' },
  { id:'T-07', role:'ВОДА', size:4,  pit:'—', type:'вода',   ticks:5, eff:'заливает низ' },
  { id:'T-08', role:'ВОДА', size:3,  pit:'-', type:'вода',   ticks:4, eff:'гасит питание ниже' },
  { id:'T-09', role:'ВОДА', size:6,  pit:'—', type:'вода',   ticks:7, eff:'резервуар' },
  { id:'T-10', role:'ВОДА', size:3,  pit:'+', type:'вода',   ticks:4, eff:'турбина' },
  { id:'T-11', role:'ВОДА', size:4,  pit:'-', type:'вода',   ticks:5, eff:'дренаж' },
  { id:'T-12', role:'ВОДА', size:6,  pit:'—', type:'вода',   ticks:7, eff:'затопленный ярус' },
  { id:'T-13', role:'ПИТ',  size:3,  pit:'+', type:'питание', ticks:4, eff:'питает два яруса' },
  { id:'T-14', role:'ПИТ',  size:4,  pit:'+', type:'питание', ticks:5, eff:'узел питания' },
  { id:'T-15', role:'ПИТ',  size:6,  pit:'-', type:'питание', ticks:6, eff:'печь' },
  { id:'T-16', role:'ПИТ',  size:3,  pit:'-', type:'питание', ticks:4, eff:'насос' },
  { id:'T-17', role:'ПИТ',  size:4,  pit:'+', type:'питание', ticks:5, eff:'ретранслятор' },
  { id:'T-18', role:'ПИТ',  size:3,  pit:'—', type:'питание', ticks:4, eff:'обесточенный узел' },
  { id:'T-19', role:'ОПОРА', size:6, pit:'—', type:'опора',  ticks:6, eff:'держит два яруса' },
  { id:'T-20', role:'ОПОРА', size:4, pit:'—', type:'опора',  ticks:5, eff:'распорка' },
  { id:'T-21', role:'ОПОРА', size:11,pit:'—', type:'опора',  ticks:9, eff:'несущий каркас' },
  { id:'T-22', role:'ОПОРА', size:3, pit:'+', type:'опора',  ticks:4, eff:'опора с питанием' },
  { id:'T-23', role:'ОПОРА', size:6, pit:'-', type:'опора',  ticks:6, eff:'просевшая' },
  { id:'T-24', role:'ОПОРА', size:4, pit:'—', type:'опора',  ticks:5, eff:'клеймо на опоре' },
  { id:'T-25', role:'БОЙ',  size:4,  pit:'—', type:'бой',    ticks:6, eff:'SEAM' },
  { id:'T-26', role:'БОЙ',  size:6,  pit:'-', type:'бой',    ticks:8, eff:'SEAL' },
  { id:'T-27', role:'БОЙ',  size:3,  pit:'—', type:'бой',    ticks:5, eff:'DRAY' },
  { id:'T-28', role:'БОЙ',  size:4,  pit:'-', type:'бой',    ticks:6, eff:'TALLY' },
  { id:'T-29', role:'БОЙ',  size:6,  pit:'—', type:'бой',    ticks:8, eff:'BREAK' },
  { id:'T-30', role:'БОЙ',  size:11, pit:'-', type:'бой',    ticks:11, eff:'КАДАВР' },
];
const TYPE_IX = { 'проход':0, 'вода':1, 'питание':2, 'опора':3, 'бой':4 };

// gates are named after the wall they sit in; y is up
const GATES = {
  N: { v:[0,0,-1], name:'север',  opp:'S' },
  S: { v:[0,0, 1], name:'юг',     opp:'N' },
  E: { v:[1,0, 0], name:'восток', opp:'W' },
  W: { v:[-1,0,0], name:'запад',  opp:'E' },
  UP:   { v:[0, 1,0], name:'верх', opp:'DOWN' },
  DOWN: { v:[0,-1,0], name:'низ',  opp:'UP' },
};
const HORIZ = ['N','E','S','W'];
const KNOWN = {};                    // what you have lived through

// ── state ───────────────────────────────────────────────────────
let S = null;
const key = (x, y, z) => x + ',' + y + ',' + z;

function newRun() {
  S = {
    rooms: {},                       // "x,y,z" -> room
    here: '0,0,0',
    pos: { x: 0, z: 0 },             // local metres, origin = room centre
    yaw: 0, pitch: 0,
    ticks: 0, placed: 0,
    came: null,                      // the card of the room you are in
    draft: null,
    over: null,
  };
  const start = Object.assign({}, CARDS.find(c => c.id === 'T-03'));
  // No shaft under your feet at the start: the first thing you must do is
  // walk, not open a draft from where you woke up.
  S.rooms['0,0,0'] = { card: start, x:0, y:0, z:0,
                       gates: ['N','S'], seen: true };
  rebuild();
  hud();
}

// ── the deal: deterministic, opaque, always with a way on ────────
function deal(depth, cell, above, water, power, support, read) {
  const a = above ? (TYPE_IX[above.type] * 11 + above.size * 13 + above.ticks * 7) : 3;
  const seed = (depth + 1) * 7 + (cell.x * 3 + cell.z) * 5 + a
             + water * 17 + power * 19 + support * 23 + read * 29 + 31;
  const step = 1 + ((depth + 1) % 3);
  const out = [];
  for (let k = 0; k < 3; k++) {
    let idx = ((seed + k * step * 7) % CARDS.length + CARDS.length) % CARDS.length;
    let c = CARDS[idx], guard = 0;
    while (out.some(o => o.id === c.id) && guard++ < 40) { idx = (idx + 1) % CARDS.length; c = CARDS[idx]; }
    out.push(c);
  }
  const bad = (power >= 3) || (water >= 2) || (support === 0 && depth > 1);
  if (bad) {
    const at = (depth + water) % 3;
    out[at] = Object.assign({}, out[at], { blind: true });
  }
  // a compartment offered here must be able to continue: keep the vertical
  // gates that the card promises, and guarantee at least one more horizontal
  if (!out.some(c => c.down || c.up)) {
    const pool = CARDS.filter(c => c.down || c.up);
    const pick = pool[seed % pool.length];
    let at = out[0].blind ? 1 : 0;
    if (out[at].blind) at = 2;
    out[at] = pick;
  }
  return { cards: out, bad: bad, seed: seed };
}

// ── gate sets for a new compartment ─────────────────────────────
// The way back is mandatory. Everything else is what the record promises
// plus a deterministic extra, so the shape of a compartment is decided by
// the card you chose and not by the dice.
function gatesFor(card, back, seed) {
  const g = [back];
  if (card.down && back !== 'DOWN') g.push('DOWN');
  if (card.up && back !== 'UP') g.push('UP');
  const free = HORIZ.filter(d => d !== back && d !== GATES[back].opp);
  const extra = card.type === 'проход' ? 2 : 1;
  for (let i = 0; i < extra && free.length; i++) {
    const pick = free[(seed + i * 3) % free.length];
    if (g.indexOf(pick) < 0) g.push(pick);
  }
  return g;
}

function roomAt(p) { return S.rooms[p]; }
const cellOf = (x, y, z) => key(x, y, z);

// ── renderer + textures (same language as v1) ───────────────────
const renderer = new THREE.WebGLRenderer({ antialias:false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x08090b);
scene.fog = new THREE.FogExp2(0x08090b, C.fog);

const camera = new THREE.PerspectiveCamera(76, innerWidth/innerHeight, 0.06, 260);
const rig = new THREE.Object3D();
rig.add(camera);
scene.add(rig);

scene.add(new THREE.HemisphereLight(0x6b7480, 0x0a0b0d, 0.55));
const lamp = new THREE.PointLight(0xd9cdb4, 1.9, 16, 2);
rig.add(lamp);

function sizeRT() {
  const cw = renderer.domElement.clientWidth || innerWidth;
  const ch = renderer.domElement.clientHeight || innerHeight;
  const h = C.renderH;
  renderer.setSize(Math.max(2, Math.round(h * cw / ch)), h, false);
  camera.aspect = cw / ch;
  camera.updateProjectionMatrix();
}

function mkc(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  return 'rgb(' + Math.min(255, ((n>>16)&255)*f|0) + ',' +
         Math.min(255, ((n>>8)&255)*f|0) + ',' + Math.min(255, (n&255)*f|0) + ')';
}
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0;
  let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function texPanel(base, seed, vent) {
  const [c, x] = mkc(32, 32), R = mulberry32(seed);
  x.fillStyle = base; x.fillRect(0, 0, 32, 32);
  for (let i = 0; i < 32; i += 8) { x.fillStyle = shade(base, 0.82); x.fillRect(0, i, 32, 1); }
  for (let i = 0; i < 6; i++) { x.fillStyle = shade(base, 1.16); x.fillRect(0, (R()*32)|0, 32, 1); }
  if (vent) for (let i = 0; i < 5; i++) { x.fillStyle = shade(base, 0.6); x.fillRect(6, 9 + i*3, 20, 1); }
  for (let i = 0; i < 90; i++) { x.fillStyle = shade(base, 0.72 + R()*0.55);
    x.fillRect((R()*32)|0, (R()*32)|0, 1, 1); }
  const t = new THREE.CanvasTexture(c);
  t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestMipmapNearestFilter;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

const TEX = {
  wall:  texPanel('#474741', 11, false),
  floor: texPanel('#3a3a35', 23, false),
  ceil:  texPanel('#2b2b28', 41, true),
  metal: texPanel('#54544e', 59, false),
};

function ps1ify(mat) {
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.uJit = { get value() { return C.jitter; } };
    sh.vertexShader = 'uniform float uJit;\n' + sh.vertexShader.replace(
      '#include <project_vertex>',
      '#include <project_vertex>\n' +
      'if (uJit > 0.5) { vec4 sp = gl_Position; sp.xyz /= sp.w;\n' +
      '  sp.xy = floor(sp.xy * uJit) / uJit; sp.xyz *= sp.w; gl_Position = sp; }');
  };
  mat.needsUpdate = true;
  return mat;
}

const M = {
  floor: ps1ify(new THREE.MeshLambertMaterial({ map: TEX.floor, color: 0xb4b4ac })),
  wall:  ps1ify(new THREE.MeshLambertMaterial({ map: TEX.wall,  color: 0xbcbcb4 })),
  ceil:  ps1ify(new THREE.MeshLambertMaterial({ map: TEX.ceil,  color: 0x8a8a84 })),
  metal: ps1ify(new THREE.MeshLambertMaterial({ map: TEX.metal, color: 0xa6a29a })),
  amber: new THREE.MeshBasicMaterial({ color: 0xe8a63c }),
  water: new THREE.MeshLambertMaterial({ color: 0x29394a, transparent: true, opacity: 0.7 }),
  dark:  new THREE.MeshLambertMaterial({ color: 0x101215 }),
  grass: null,
};

(function loadStrip() {
  if (!TEXSTRIP || TEXSTRIP.indexOf('data:') !== 0) return;
  const img = new Image();
  img.onload = () => {
    const n = 4, w = Math.floor(img.width / n), h = img.height;
    [['wall', TEX.wall], ['floor', TEX.floor], ['ceil', TEX.ceil], ['metal', TEX.metal]]
      .forEach(([k, t], i) => {
        const [c, x] = mkc(w, h);
        x.drawImage(img, i*w, 0, w, h, 0, 0, w, h);
        t.image = c; t.needsUpdate = true;
      });
  };
  img.src = TEXSTRIP;
})();

// ── geometry helpers ────────────────────────────────────────────
function boxInto(list, w, h, d, x, y, z, uvs) {
  const g = new THREE.BoxGeometry(w, h, d).toNonIndexed();
  if (uvs) { const uv = g.attributes.uv;
    for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i)*uvs[0], uv.getY(i)*uvs[1]); }
  g.translate(x, y, z);
  list.push(g);
}
function mergeGeoms(list) {
  if (!list.length) return null;
  let total = 0;
  for (const g of list) total += g.attributes.position.count;
  const pos = new Float32Array(total*3), nor = new Float32Array(total*3), uv = new Float32Array(total*2);
  let o = 0;
  for (const g of list) {
    pos.set(g.attributes.position.array, o*3);
    nor.set(g.attributes.normal.array, o*3);
    uv.set(g.attributes.uv.array, o*2);
    o += g.attributes.position.count;
    g.dispose();
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  out.setAttribute('normal',   new THREE.BufferAttribute(nor, 3));
  out.setAttribute('uv',       new THREE.BufferAttribute(uv, 2));
  return out;
}

// ── build the world around the player ───────────────────────────
// The current compartment and anything adjacent: you look through an open
// gate and must see the room on the other side, not a black card.
let world = null;

function rebuild() {
  if (world) { scene.remove(world); world.traverse(o => { if (o.geometry) o.geometry.dispose(); }); }
  world = new THREE.Group();
  scene.add(world);

  const F = [], W = [], CL = [], MT = [], AM = [], WA = [];
  const here = S.rooms[S.here];

  // rooms within one step of the current one
  const list = [here];
  for (const d of Object.keys(GATES)) {
    const v = GATES[d].v;
    const n = S.rooms[key(here.x + v[0], here.y + v[1], here.z + v[2])];
    if (n) list.push(n);
  }

  for (const r of list) buildRoom(r, r === here, F, W, CL, MT, AM, WA);

  const add = (l, m) => { const g = mergeGeoms(l); if (g) world.add(new THREE.Mesh(g, m)); };
  add(F, M.floor); add(W, M.wall); add(CL, M.ceil);
  add(MT, M.metal); add(AM, M.amber); add(WA, M.water);

  // one failing light per room, amber where the room is powered
  for (const r of list) {
    const l = new THREE.PointLight(r === here ? 0xd2d7dd : 0x9aa0a8, r === here ? 1.6 : 0.7, 13, 2);
    l.position.set(r.x*C.size, r.y*C.height + C.height - 0.6, r.z*C.size);
    world.add(l);
  }

  // doors are separate objects, not merged: a leaf has to move
  doors = [];
  for (const r of list) for (const d of r.gates) doors.push(mkDoor(r, d));

  placeCamera();
}

// ── doors ───────────────────────────────────────────────────────
// Two leaves that part into the wall. They are the reason a gate is not a
// black hole: nothing passes until the leaves are out of the way.
let doors = [];

function mkDoor(r, dir) {
  const HS = C.inner/2, GW = C.gateW, GH = C.gateH, T = C.wallT;
  const ox = r.x*C.size, oy = r.y*C.height, oz = r.z*C.size;
  const half = GW/2, leafW = half - 0.02, th = 0.07;
  const vert = (dir === 'UP' || dir === 'DOWN');

  const group = new THREE.Group();
  const mk = (w, h, d) => new THREE.Mesh(new THREE.BoxGeometry(w, h, d), M.metal);
  const leaves = [], bases = [];

  for (let i = 0; i < 2; i++) {
    const s = i === 0 ? -1 : 1;
    let m, base;
    if (vert) {
      m = mk(leafW, th, 2.2);
      base = new THREE.Vector3(ox + s*GW/4, oy + (dir === 'UP' ? C.height - 0.06 : 0.06), oz);
    } else if (dir === 'N' || dir === 'S') {
      m = mk(leafW, GH, th);
      base = new THREE.Vector3(ox + s*GW/4,
                               oy + GH/2,
                               oz + (dir === 'N' ? -HS + 0.09 : HS - 0.09));
    } else {
      m = mk(th, GH, leafW);
      base = new THREE.Vector3(ox + (dir === 'E' ? HS - 0.09 : -HS + 0.09),
                               oy + GH/2,
                               oz + s*GW/4);
    }
    m.position.copy(base);
    group.add(m);
    leaves.push(m); bases.push(base.clone());
  }

  // amber seam where the leaves meet
  const seam = new THREE.Mesh(new THREE.BoxGeometry(0.03, vert ? 0.09 : GH - 0.1, 0.03), M.amber);
  if (vert) { seam.scale.z = 70; seam.position.set(ox, oy + (dir === 'UP' ? C.height - 0.09 : 0.09), oz); }
  else if (dir === 'N' || dir === 'S') seam.position.set(ox, oy + GH/2, oz + (dir === 'N' ? -HS + 0.12 : HS - 0.12));
  else seam.position.set(ox + (dir === 'E' ? HS - 0.12 : -HS + 0.12), oy + GH/2, oz);
  group.add(seam);

  world.add(group);
  return { dir: dir, room: r, leaves: leaves, bases: bases, seam: seam,
           open: 0, want: 0, vert: vert, half: half };
}

function animDoors(dt) {
  for (const d of doors) {
    d.open += (d.want - d.open) * Math.min(1, dt*11);
    const k = d.open;
    for (let i = 0; i < 2; i++) {
      const s = i === 0 ? -1 : 1;
      const m = d.leaves[i], b = d.bases[i];
      const slide = s * k * d.half;
      if (d.vert)        m.position.set(b.x + slide, b.y, b.z);
      else if (d.dir === 'N' || d.dir === 'S') m.position.set(b.x + slide, b.y, b.z);
      else               m.position.set(b.x, b.y, b.z + slide);
    }
    if (d.seam) d.seam.visible = d.open < 0.25;
  }
}

function doorsAt(r, dir) {
  return doors.filter(d => d.room === r && d.dir === dir);
}
function openDoor(r, dir) { for (const d of doorsAt(r, dir)) d.want = 1; }
function shutDoors(r) { for (const d of doors.filter(x => x.room === r)) d.want = 0; }

function buildRoom(r, isHere, F, W, CL, MT, AM, WA) {
  const S0 = C.size, I = C.inner, T = C.wallT, H = C.height;
  const ox = r.x*S0, oy = r.y*C.height, oz = r.z*S0;
  const HS = I/2, GW = C.gateW/2, GH = C.gateH;

  // floor and ceiling, with a hole where a vertical gate is
  const up = r.gates.indexOf('UP') >= 0, dn = r.gates.indexOf('DOWN') >= 0;
  const vw = 2.2/2;
  if (dn) {
    boxInto(F, I, T, HS - vw, 0, -T/2 + 0.0, -(vw + (HS-vw)/2));
    boxInto(F, I, T, HS - vw, 0, -T/2 + 0.0,  (vw + (HS-vw)/2));
    boxInto(F, HS - vw, T, vw*2, -(vw + (HS-vw)/2), -T/2 + 0.0, 0);
    boxInto(F, HS - vw, T, vw*2,  (vw + (HS-vw)/2), -T/2 + 0.0, 0);
  } else {
    boxInto(F, I + T*2, T, I + T*2, 0, -T/2, 0);
  }
  if (up) {
    boxInto(CL, I, T, HS - vw, 0, H + T/2, -(vw + (HS-vw)/2));
    boxInto(CL, I, T, HS - vw, 0, H + T/2,  (vw + (HS-vw)/2));
    boxInto(CL, HS - vw, T, vw*2, -(vw + (HS-vw)/2), H + T/2, 0);
    boxInto(CL, HS - vw, T, vw*2,  (vw + (HS-vw)/2), H + T/2, 0);
  } else {
    boxInto(CL, I + T*2, T, I + T*2, 0, H + T/2, 0);
  }

  // walls: a gate is a hole, so the wall is three pieces
  const sides = [
    ['N', -0.0, -HS - T/2, 'x'],
    ['S',  0.0,  HS + T/2, 'x'],
    ['E',  HS + T/2, 0.0, 'z'],
    ['W', -HS - T/2, 0.0, 'z'],
  ];
  for (const [name, px, pz, axis] of sides) {
    const has = r.gates.indexOf(name) >= 0;
    if (!has) {
      if (axis === 'x') boxInto(W, I + T*2, H, T, 0, H/2, pz);
      else              boxInto(W, T, H, I + T*2, px, H/2, 0);
      continue;
    }
    const seg = (HS - GW) + T;
    if (axis === 'x') {
      boxInto(W, seg, H, T, -(GW + seg/2), H/2, pz);
      boxInto(W, seg, H, T,  (GW + seg/2), H/2, pz);
      boxInto(W, GW*2, H - GH, T, 0, GH + (H-GH)/2, pz);
    } else {
      boxInto(W, T, H, seg, px, H/2, -(GW + seg/2));
      boxInto(W, T, H, seg, px, H/2,  (GW + seg/2));
      boxInto(W, T, H - GH, GW*2, px, GH + (H-GH)/2, 0);
    }
    // the lock frame: two posts and a lintel, amber on the sill
    const fw = 0.14;
    if (axis === 'x') {
      boxInto(MT, fw, GH, fw, -GW, GH/2, pz);
      boxInto(MT, fw, GH, fw,  GW, GH/2, pz);
      boxInto(MT, GW*2 + fw, fw, fw, 0, GH, pz);
      boxInto(AM, GW*2, 0.05, 0.06, 0, GH - 0.06, pz);
    } else {
      boxInto(MT, fw, GH, fw, px, GH/2, -GW);
      boxInto(MT, fw, GH, fw, px, GH/2,  GW);
      boxInto(MT, fw, fw, GW*2 + fw, px, GH, 0);
      // a hairline of amber on the jamb, not a slab across the opening
      boxInto(AM, 0.05, GH - 0.1, 0.05, px, GH/2, -GW + fw);
    }
  }

  // dressing, so a compartment reads before you are inside it
  const t = r.card;
  if (t.type === 'вода') {
    boxInto(WA, I - 0.3, 0.04, I - 0.3, 0, 0.06, 0);
    boxInto(MT, 0.3, H, 0.3, -HS + 0.55, H/2, -HS + 0.55);
    boxInto(MT, 0.3, H, 0.3,  HS - 0.55, H/2,  HS - 0.55);
  } else if (t.type === 'питание') {
    boxInto(MT, 1.2, 1.0, 1.2, 0, 0.5, 0);
    boxInto(AM, 0.12, H*0.6, 0.12, -HS + 0.5, H*0.42, -1.4);
    boxInto(AM, 0.12, H*0.6, 0.12,  HS - 0.5, H*0.42,  1.4);
  } else if (t.type === 'опора') {
    for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
      boxInto(MT, 0.55, H, 0.55, sx*(HS - 0.6), H/2, sz*(HS - 0.6));
    }
  } else if (t.type === 'бой') {
    const R = mulberry32(r.x*31 + r.y*17 + r.z*7 + 5);
    for (let i = 0; i < 8; i++) {
      boxInto(MT, 0.4 + R()*0.7, 0.25 + R()*0.6, 0.4 + R()*0.7,
              (R()-0.5)*(I-1.6), 0.22, (R()-0.5)*(I-1.6));
    }
  } else {
    // проход: a rail along the ceiling and a lamp in the middle
    boxInto(MT, 0.2, 0.2, I - 1.4, 0, H - 0.45, 0);
    boxInto(AM, 0.9, 0.04, 0.9, 0, H - 0.2, 0);
  }

  // the vertical shafts get a collar so the hole reads as engineering
  if (dn) {
    const e = vw + 0.12;
    boxInto(MT, e*2, 0.22, 0.12, 0, -0.1, -e);
    boxInto(MT, e*2, 0.22, 0.12, 0, -0.1,  e);
    boxInto(MT, 0.12, 0.22, e*2, -e, -0.1, 0);
    boxInto(MT, 0.12, 0.22, e*2,  e, -0.1, 0);
  }
  if (up) {
    const e = vw + 0.12;
    boxInto(MT, e*2, 0.22, 0.12, 0, H + 0.1, -e);
    boxInto(MT, e*2, 0.22, 0.12, 0, H + 0.1,  e);
    boxInto(MT, 0.12, 0.22, e*2, -e, H + 0.1, 0);
    boxInto(MT, 0.12, 0.22, e*2,  e, H + 0.1, 0);
  }

  // move everything into place
  const dx = ox, dy = oy, dz = oz;
  const shift = (arr) => { for (const g of arr) g.translate(dx, dy, dz); };
  [F, W, CL, MT, AM, WA].forEach(shift);
}

// ── camera / movement ───────────────────────────────────────────
function placeCamera() {
  const r = S.rooms[S.here];
  rig.position.set(r.x*C.size + S.pos.x, r.y*C.height + C.eye, r.z*C.size + S.pos.z);
  rig.rotation.y = S.yaw;
  camera.rotation.x = S.pitch;
}

const keys = {};
function tickMove(dt) {
  // walking never depends on the mouse being captured: if the capture fails
  // the player still moves, and looking falls back to drag
  if (S.draft || S.over || S.cross) return;
  let fw = 0, sd = 0;
  if (keys['KeyW']) fw += 1;
  if (keys['KeyS']) fw -= 1;
  if (keys['KeyD']) sd += 1;
  if (keys['KeyA']) sd -= 1;
  if (!fw && !sd) return;
  const len = Math.hypot(fw, sd) || 1;
  const sp = C.speed * dt;
  const s = Math.sin(S.yaw), c = Math.cos(S.yaw);
  S.pos.x += (-s * fw / len + c * sd / len) * sp;
  S.pos.z += (-c * fw / len - s * sd / len) * sp;
  const lim = C.inner/2 - 0.42;
  S.pos.x = Math.max(-lim, Math.min(lim, S.pos.x));
  S.pos.z = Math.max(-lim, Math.min(lim, S.pos.z));
  placeCamera();
}

// ── gates ───────────────────────────────────────────────────────
function gateNear() {
  const r = S.rooms[S.here];
  const HS = C.inner/2;
  let best = null;
  for (const d of r.gates) {
    const G = GATES[d];
    let gx = 0, gy = 0, gz = 0;
    if (d === 'N') gz = -HS; else if (d === 'S') gz = HS;
    else if (d === 'E') gx = HS; else if (d === 'W') gx = -HS;
    const dist = Math.hypot(S.pos.x - gx, S.pos.z - gz);
    // vertical gates are entered by standing under/over the collar
    const v = d === 'UP' || d === 'DOWN';
    const near = v ? dist < 1.5 : dist < C.reach;
    if (!near) continue;
    // and you must be looking at it
    const fx = -Math.sin(S.yaw), fz = -Math.cos(S.yaw);
    const dot = (G.v[0]*fx + G.v[2]*fz);
    const facing = v ? true : dot > 0.35;
    if (!facing) continue;
    if (!best || dist < best.dist) best = { dir: d, dist: dist, vertical: v };
  }
  return best;
}

function promptFor(gate) {
  if (!gate) return null;
  const r = S.rooms[S.here];
  const v = GATES[gate.dir].v;
  const n = S.rooms[key(r.x + v[0], r.y + v[1], r.z + v[2])];
  const name = GATES[gate.dir].name;
  return n ? { text: 'E · ' + name + ' · пройти', mode: 'enter' }
           : { text: 'E · ' + name + ' · открыть шлюз', mode: 'draft' };
}

// ── draft ───────────────────────────────────────────────────────
function openDraft(dir) {
  const r = S.rooms[S.here];
  const v = GATES[dir].v;
  const cell = { x: r.x + v[0], z: r.z + v[2] };
  const d = deal(-r.y, cell, S.came, 0, 0, 0, Math.min(3, S.placed));
  S.draft = { dir: dir, cards: d.cards, sel: -1, bad: d.bad };
  paintDraft();
  document.body.classList.add('draft');
  document.getElementById('sheet').classList.add('on');
  document.getElementById('lock').classList.add('off');
  sizeRT();
  hud();
}

function paintDraft() {
  const d = S.draft;
  const sel = d.sel >= 0 ? d.cards[d.sel] : null;
  const bv = document.getElementById('bigval');
  bv.textContent = sel ? sel.size : '—';
  bv.className = sel ? 'sel' : '';
  document.getElementById('biglab').textContent = sel ? 'масштаб, м' : 'масштаб';
  document.getElementById('prompt2').innerHTML =
    'шлюз: <em>' + GATES[d.dir].name + '</em>. три записи реестра; поля читаются, личность — нет.' +
    (d.bad ? '<br><em>сектор в плохом состоянии: одна запись нечитаема.</em>' : '');
  const box = document.getElementById('cards');
  box.innerHTML = d.cards.map((c, i) => {
    const blind = !!c.blind;
    const known = !!KNOWN[c.id] && !blind;
    return '<div class="card' + (blind ? ' blind' : '') + (d.sel === i ? ' sel' : '') + '" data-i="' + i + '">' +
      '<div class="k">' + c.id + ' · ' + c.type + '</div>' +
      '<div class="n">' + (known ? c.eff : '· · · · ·') + '</div>' +
      '<div class="f">роль <b>' + c.role + '</b><br>⌀ <b>' + c.size + '</b> м · пит <b>' + c.pit + '</b>' +
      (c.down ? '<br><b>шахта вниз</b>' : '') + (c.up ? '<br><b>люк вверх</b>' : '') + '</div>' +
      '<div class="p">' + c.ticks + ' т</div>' +
      '</div>';
  }).join('');
  Array.prototype.forEach.call(box.querySelectorAll('.card'), el => {
    el.onclick = () => { S.draft.sel = +el.dataset.i; paintDraft(); };
  });
  document.getElementById('place').disabled = d.sel < 0;
}

function closeDraft() {
  S.draft = null;
  document.getElementById('sheet').classList.remove('on');
  document.body.classList.remove('draft');
  if (!S.over && !locked) document.getElementById('lock').classList.remove('off');
  sizeRT();
  hud();
}

function placeChosen() {
  const d = S.draft;
  if (!d || d.sel < 0) return;
  const card = d.cards[d.sel];
  KNOWN[card.id] = true;
  const here = S.rooms[S.here];
  const v = GATES[d.dir].v;
  const nx = here.x + v[0], ny = here.y + v[1], nz = here.z + v[2];
  const seed = (nx*13 + ny*7 + nz*17 + card.ticks) & 0xffff;
  const room = {
    card: card, x: nx, y: ny, z: nz,
    gates: gatesFor(card, GATES[d.dir].opp, seed),
    seen: true,
  };
  S.rooms[key(nx, ny, nz)] = room;
  S.placed++;
  closeDraft();
  transition(d.dir);
}

// ── moving through a gate ───────────────────────────────────────
function transition(dir) {
  const here = S.rooms[S.here];
  const oldHere = here;
  const G = GATES[dir];
  const v = G.v;
  const nk = key(here.x + v[0], here.y + v[1], here.z + v[2]);
  const n = S.rooms[nk];
  if (!n) return;

  openDoor(here, dir);
  const fromPos = rig.position.clone();
  const fromYaw = S.yaw, fromPitch = S.pitch;

  // step out of the new compartment's opposite gate, facing inwards
  const back = GATES[G.opp];
  const HS = C.inner/2 - 0.95;
  S.here = nk;
  S.pos.x = back.v[0] * HS;
  S.pos.z = back.v[2] * HS;
  S.yaw = Math.atan2(v[0], v[2]) - Math.PI;
  S.pitch = 0;
  S.came = n.card;
  S.ticks += n.card.ticks;          // the turn is the gate-to-gate crossing
  rebuild();

  // the leaf you just passed through must stay open while the camera crosses
  for (const d of doorsAt(oldHere, dir)) { d.want = 1; d.open = 1; }
  for (const d of doorsAt(n, back))      { d.want = 1; d.open = 0.55; }

  S.cross = {
    t0: performance.now(), dur: 760,
    from: fromPos,
    to: new THREE.Vector3(n.x*C.size + S.pos.x, n.y*C.height + C.eye, n.z*C.size + S.pos.z),
    fromYaw: fromYaw, toYaw: S.yaw, fromPitch: fromPitch,
  };

  if (S.ticks >= nextSync()) sync();
  hud();
}

function nextSync() { return (Math.floor(S.ticks / C.syncEvery) + 1) * C.syncEvery; }

function sync() {
  // the audit does not stop you: it resets the floor's balance and closes
  // any gate that leads to nothing, which is what a dead end looks like
  flashSync();
  const r = S.rooms[S.here];
  let open = 0;
  for (const d of r.gates) {
    const v = GATES[d].v;
    if (!S.rooms[key(r.x + v[0], r.y + v[1], r.z + v[2])] || d === 'DOWN') open++;
  }
  if (!open) finish('тупик', 'сверка застала тебя в отсеке без выхода.');
}

function flashSync() {
  const hz = document.getElementById('hazard');
  hz.classList.add('on');
  setTimeout(() => hz.classList.toggle('on', (nextSync() - S.ticks) <= 5), 900);
}

// ── hud ─────────────────────────────────────────────────────────
function hud() {
  const r = S.rooms[S.here];
  const m = document.getElementById('mode');
  m.textContent = S.over ? 'end' : (S.draft ? 'draft' : 'descend');
  m.className = S.draft ? 'amber' : '';

  document.getElementById('s-tick').textContent = S.ticks;
  const nx = nextSync();
  document.getElementById('s-sync').textContent = Math.max(0, nx - S.ticks);
  document.getElementById('s-rooms').textContent = Object.keys(S.rooms).length;
  document.getElementById('s-syncbox').className =
    'stat' + ((nx - S.ticks) <= 5 ? ' warn' : ((nx - S.ticks) <= 10 ? ' hot' : ''));
  document.getElementById('hazard').className = (nx - S.ticks) <= 5 ? 'on' : '';

  document.getElementById('crumbs').textContent =
    'отсек ' + (r.card.id) + ' · ярус ' + (r.y >= 0 ? '+' + r.y : r.y) +
    ' · шлюзов ' + r.gates.length;

  if (!S.draft) {
    const g = gateNear();
    const p = promptFor(g);
    const el = document.getElementById('prompt');
    const cross = document.getElementById('cross');
    if (p) {
      el.innerHTML = '<b>' + p.text.slice(0,1) + '</b>' + p.text.slice(3);
      el.classList.add('on');
      cross.classList.add('hot');
    } else {
      el.classList.remove('on');
      cross.classList.remove('hot');
    }
  }
}

function bump() {}
function finish(title, text) {
  S.over = true;
  document.getElementById('endtitle').textContent = title;
  document.getElementById('endtext').textContent =
    text + ' тактов: ' + S.ticks + ' · отсеков: ' + Object.keys(S.rooms).length +
    ' · глубина: ' + S.rooms[S.here].y;
  document.getElementById('end').classList.add('on');
  if (document.pointerLockElement) document.exitPointerLock();
}

// ── cut: a vertical slice at the player's z ─────────────────────
function openCut() {
  document.getElementById('cut').classList.add('on');
  drawCut();
  const r = S.rooms[S.here];
  const side = document.getElementById('cutside');
  side.innerHTML = '<h3>разрез</h3>' +
    '<div class="row"><span>отсек</span><b>' + r.card.id + '</b></div>' +
    '<div class="row"><span>ярус</span><b>' + r.y + '</b></div>' +
    '<div class="row"><span>шлюзов</span><b>' + r.gates.length + '</b></div>' +
    '<div class="row"><span>отсеков всего</span><b>' + Object.keys(S.rooms).length + '</b></div>' +
    '<div class="row"><span>такт</span><b>' + S.ticks + '</b></div>' +
    '<div class="row"><span>до сверки</span><b>' + Math.max(0, nextSync() - S.ticks) + '</b></div>' +
    '<p style="margin-top:18px;color:#5d636c;line-height:1.9">' +
    'срез по линии восток-запад на твоей глубине. вода идёт вниз, питание сверху, ' +
    'опора держит то, что над ней.</p>';
}
function closeCut() { document.getElementById('cut').classList.remove('on'); }

function drawCut() {
  const cv = document.getElementById('cutcanvas');
  const here = S.rooms[S.here];
  const xs = [], ys = [];
  for (const k in S.rooms) { const r = S.rooms[k]; xs.push(r.x); ys.push(r.y); }
  xs.push(here.x); ys.push(here.y);
  const x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);
  const y0 = Math.max.apply(null, ys), y1 = Math.min.apply(null, ys);
  const cols = Math.max(1, x1 - x0 + 1), rows = Math.max(1, y0 - y1 + 1);
  const cw = Math.min(96, Math.floor(700 / Math.max(cols, 1)));
  const chh = 44, padL = 46, padT = 8;
  cv.width = padL + cols*cw + 4;
  cv.height = padT + rows*chh + 4;
  cv.style.width = cv.width + 'px'; cv.style.height = cv.height + 'px';
  const x = cv.getContext('2d');
  x.fillStyle = '#060708'; x.fillRect(0, 0, cv.width, cv.height);

  for (let yy = y0; yy >= y1; yy--) {
    const row = y0 - yy;
    const py = padT + row*chh;
    x.fillStyle = '#3a3f47'; x.font = '600 11px Segoe UI, Arial'; x.textAlign = 'right';
    x.fillText((yy >= 0 ? '+' + yy : String(yy)), padL - 12, py + chh/2 + 4);
    for (let xx = x0; xx <= x1; xx++) {
      const px = padL + (xx - x0)*cw + 3, w = cw - 6, h = chh - 6;
      const r = S.rooms[key(xx, yy, here.z)];
      if (!r) { x.strokeStyle = '#161a1e'; x.lineWidth = 1; x.strokeRect(px, py + 3, w, h); continue; }
      const isHere = (key(xx, yy, here.z) === S.here);
      x.fillStyle = r.card.type === 'вода' ? '#22303d'
                  : r.card.type === 'питание' ? '#2e2617'
                  : r.card.type === 'опора' ? '#24262a' : '#1c1f24';
      x.fillRect(px, py + 3, w, h);
      x.strokeStyle = isHere ? '#e8a63c' : '#2c3037';
      x.lineWidth = isHere ? 2 : 1;
      x.strokeRect(px + .5, py + 3.5, w - 1, h - 1);
      x.fillStyle = isHere ? '#e8a63c' : '#8b919b';
      x.font = '600 10px Segoe UI, Arial'; x.textAlign = 'left';
      x.fillText(r.card.id, px + 6, py + 16);
      x.fillStyle = '#5d636c'; x.font = '9px Segoe UI, Arial';
      x.fillText(r.gates.join(' '), px + 6, py + 29);
    }
  }
}

// ── input ───────────────────────────────────────────────────────
let locked = false, dragging = false;
const lockEl = document.getElementById('lock');

function tryLock() {
  if (S.draft) return;
  const p = renderer.domElement.requestPointerLock();
  if (p && p.catch) p.catch(() => {});       // capture is a convenience, not a gate
}
renderer.domElement.addEventListener('mousedown', (e) => {
  if (e.button !== 0) return;
  dragging = true;
  tryLock();
});
addEventListener('mouseup', () => { dragging = false; });
renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());

document.addEventListener('pointerlockchange', () => {
  locked = document.pointerLockElement === renderer.domElement;
  lockEl.classList.toggle('off', locked);
});

document.addEventListener('mousemove', (e) => {
  if (S.draft || S.cross || S.over) return;
  if (!locked && !dragging) return;          // drag-look when the capture is refused
  S.yaw -= (e.movementX || 0) * 0.0024;
  S.pitch -= (e.movementY || 0) * 0.0024;
  S.pitch = Math.max(-1.15, Math.min(1.15, S.pitch));
  placeCamera();
});

addEventListener('keydown', (ev) => {
  const k = ev.code;
  keys[k] = true;

  // keyboard look, so a lost mouse capture never strands the player
  if (!S.draft && !S.cross && !S.over) {
    const step = 0.05;
    if (k === 'ArrowLeft')  { S.yaw += step; placeCamera(); return; }
    if (k === 'ArrowRight') { S.yaw -= step; placeCamera(); return; }
    if (k === 'ArrowUp')    { S.pitch = Math.min(1.15, S.pitch + step); placeCamera(); return; }
    if (k === 'ArrowDown')  { S.pitch = Math.max(-1.15, S.pitch - step); placeCamera(); return; }
  }

  if (k === 'KeyM') { ev.preventDefault();
    document.getElementById('cut').classList.contains('on') ? closeCut() : openCut(); return; }
  if (k === 'KeyR') { newRun(); document.getElementById('end').classList.remove('on'); return; }
  if (k === 'Escape') { if (S.draft) closeDraft(); else closeCut(); return; }
  if (S.over) return;
  if (S.draft) {
    if (k === 'Digit1' || k === 'Digit2' || k === 'Digit3') {
      S.draft.sel = +k.slice(5) - 1; paintDraft(); return;
    }
    if (k === 'Enter' || k === 'Space') { ev.preventDefault(); placeChosen(); return; }
    return;
  }
  if (k === 'KeyE' || k === 'Enter') {
    ev.preventDefault();
    if (S.cross) return;
    const g = gateNear();
    if (!g) { bump(); return; }
    const r = S.rooms[S.here];
    const v = GATES[g.dir].v;
    const n = S.rooms[key(r.x + v[0], r.y + v[1], r.z + v[2])];
    // the leaves part first; what happens next waits for them to be out of
    // the way, so the door is a door and not a menu button
    openDoor(r, g.dir);
    if (n) setTimeout(() => { if (!S.draft && !S.over) transition(g.dir); }, 220);
    else   setTimeout(() => { if (!S.draft && !S.over) openDraft(g.dir); }, 260);
  }
});
addEventListener('keyup', (ev) => { keys[ev.code] = false; });

document.getElementById('place').onclick = placeChosen;
document.getElementById('cancel').onclick = closeDraft;
document.getElementById('fab').onclick = () => {
  document.getElementById('cut').classList.contains('on') ? closeCut() : openCut();
};
document.getElementById('restart').onclick = () => {
  document.getElementById('end').classList.remove('on'); newRun();
};
addEventListener('resize', () => { sizeRT(); });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

// ── loop ────────────────────────────────────────────────────────
let last = performance.now(), hudT = 0;
function tick(now) {
  requestAnimationFrame(tick);
  const dt = Math.min(0.05, (now - last)/1000); last = now;
  tickMove(dt);
  animDoors(dt);
  animCross(now);
  renderer.render(scene, camera);
  if (now - hudT > 120) { hudT = now; if (!S.draft) hud(); }
}

// the walk through the gate: the camera travels the doorway instead of being
// teleported, so the compartment on the other side arrives by being entered
function animCross(now) {
  const c = S.cross;
  if (!c) return;
  const k = Math.min(1, (now - c.t0) / c.dur);
  const e = k * k * (3 - 2 * k);
  rig.position.set(
    c.from.x + (c.to.x - c.from.x) * e,
    c.from.y + (c.to.y - c.from.y) * e + Math.sin(k * Math.PI) * 0.05,
    c.from.z + (c.to.z - c.from.z) * e);
  let dy = c.toYaw - c.fromYaw;
  while (dy > Math.PI) dy -= Math.PI*2;
  while (dy < -Math.PI) dy += Math.PI*2;
  rig.rotation.y = c.fromYaw + dy * e;
  camera.rotation.x = c.fromPitch * (1 - e);
  if (k >= 1) { S.cross = null; placeCamera(); }
}

document.title = 'DATUM v2 · ' + BUILD;
sizeRT();
newRun();
requestAnimationFrame(tick);
</script>
</body>
