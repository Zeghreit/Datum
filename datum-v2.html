<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>DATUM v2 · DRAFT</title>
<style>
  /* ── DATUM v2 interface ─────────────────────────────────────────
     Layout language taken from Kubik: a mode plate at the top left,
     three outlined readouts at the top right, a bottom sheet with one
     big number and one big action, corner-cut plates, hazard stripes
     for danger. Type is geometric sans; nothing is monospace here —
     the registry voice lives in the words, not in the letterform.   */
  :root {
    --bg:#0a0b0d;
    --plate:#15171b;
    --plate2:#1c1f24;
    --line:#2c3037;
    --line2:#3a3f47;
    --ink:#e8e9ec;
    --dim:#8b919b;
    --dim2:#5d636c;
    --amb:#e8a63c;
    --red:#e0563a;
    --water:#4d6a86;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; background:var(--bg); overflow:hidden;
    font-family:"Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif;
    color:var(--ink); -webkit-font-smoothing:antialiased; }
  canvas { display:block; }
  /* the stage never sits UNDER the draft sheet: it shrinks instead. An opaque
     block overlapping a WebGL canvas is how a perfectly good frame turns into
     a blank rectangle. */
  body > canvas { position:fixed; left:0; top:0; width:100%; height:100%;
    image-rendering:pixelated; z-index:0; }
  body.draft > canvas { height:calc(100% - 344px); }

  /* cut corners, two of them, never four */
  .cut   { clip-path:polygon(0 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%); }
  .cutl  { clip-path:polygon(14px 0, 100% 0, 100% 100%, 0 100%, 0 14px); }
  .cutr  { clip-path:polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 0 100%); }

  /* ── top bar ─────────────────────────────────────────────────── */
  #top { position:fixed; top:0; left:0; right:0; height:64px; display:flex;
         align-items:flex-start; justify-content:space-between; padding:14px 16px;
         pointer-events:none; z-index:20; }
  #modewrap { display:flex; align-items:flex-start; gap:10px; }
  #burger { width:56px; height:56px; border:1px solid var(--line2); background:var(--plate);
    display:flex; align-items:center; justify-content:center; }
  #burger i { display:block; width:22px; height:2px; background:var(--ink);
    box-shadow:0 -7px 0 var(--ink), 0 7px 0 var(--ink); }
  #mode { height:56px; padding:0 30px 0 18px; display:flex; align-items:center;
    background:var(--ink); color:#0a0b0d; font-weight:700; font-size:19px;
    letter-spacing:.14em; text-transform:uppercase;
    clip-path:polygon(0 0, 100% 0, calc(100% - 22px) 100%, 0 100%); }
  #mode::before { content:"■"; margin-right:10px; font-size:13px; }
  #mode.amber { background:var(--amb); }
  #mode.danger { background:var(--red); color:#fff; }

  #crumbs { position:relative; margin:2px 0 0 66px; font-size:11px; letter-spacing:.18em;
    color:var(--dim2); text-transform:uppercase; }

  #stats { display:flex; gap:8px; }
  .stat { width:82px; height:56px; border:1px solid var(--line2); background:rgba(10,11,13,.72);
          padding:7px 9px 0; }
  .stat b { display:block; font-size:21px; font-weight:700; letter-spacing:.02em; line-height:1; }
  .stat span { display:block; margin-top:5px; font-size:9px; letter-spacing:.18em;
               color:var(--dim2); text-transform:uppercase; }
  .stat.hot b { color:var(--amb); }
  .stat.warn b { color:var(--red); }

  /* ── hint line, bottom left ──────────────────────────────────── */
  #hint { position:fixed; left:16px; bottom:16px; font-size:11px; letter-spacing:.1em;
    color:#7d838d; line-height:1.9; z-index:20; text-transform:uppercase;
    background:rgba(8,9,11,.72); padding:7px 13px 8px 11px;
    clip-path:polygon(0 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%); }
  #hint b { color:#b9bfc8; font-weight:600; }

  /* ── fab: the cut ────────────────────────────────────────────── */
  #fab { position:fixed; right:22px; bottom:22px; width:60px; height:60px; z-index:21;
    border:1px solid var(--line2); background:rgba(10,11,13,.8); transform:rotate(45deg);
    display:flex; align-items:center; justify-content:center; cursor:pointer; }
  #fab span { transform:rotate(-45deg); font-size:10px; letter-spacing:.14em; color:var(--ink); }
  #fab:hover { border-color:var(--amb); }
  #fab:hover span { color:var(--amb); }

  /* ── hazard stripe: sync is close ────────────────────────────── */
  #hazard { position:fixed; left:0; right:0; bottom:0; height:9px; z-index:19; display:none;
    background:repeating-linear-gradient(-45deg, var(--red) 0 12px, #1a0d09 12px 24px); }
  #hazard.on { display:block; }

  /* ── draft sheet ─────────────────────────────────────────────── */
  #sheet { position:fixed; left:0; right:0; bottom:0; z-index:30; display:none;
    background:var(--plate); border-top:1px solid var(--line2); padding:0 0 14px; }
  #sheet.on { display:block; }
  #sheet .stripe { height:9px;
    background:repeating-linear-gradient(-45deg, var(--amb) 0 12px, #241a08 12px 24px); }

  .sheetrow { display:flex; align-items:center; gap:26px; padding:16px 22px 10px; }
  #bigval { font-size:62px; font-weight:700; line-height:.9; letter-spacing:-.02em; }
  #biglab { font-size:11px; letter-spacing:.22em; color:var(--dim2); text-transform:uppercase;
            margin-top:8px; }
  #prompt { flex:1; font-size:12px; letter-spacing:.06em; color:var(--dim); line-height:1.7; }
  #prompt em { color:var(--amb); font-style:normal; }

  #cards { display:flex; gap:10px; padding:0 22px; }
  .card { flex:1; min-height:128px; border:1px solid var(--line2); background:var(--plate2);
    padding:11px 12px 9px; cursor:pointer; position:relative;
    clip-path:polygon(0 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%); }
  .card:hover { border-color:var(--dim); }
  .card.sel { background:var(--ink); color:#0a0b0d; border-color:var(--ink); }
  .card.sel .k, .card.sel .f b { color:#0a0b0d; }
  .card.sel .f { color:#3b3f46; }
  .card .k { font-size:10px; letter-spacing:.2em; color:var(--dim2); text-transform:uppercase; }
  .card .n { font-size:13px; font-weight:700; letter-spacing:.01em; margin:7px 0 8px; line-height:1.35; }
  .card .f { font-size:11px; letter-spacing:.06em; color:var(--dim); line-height:1.8; }
  .card .f b { color:var(--ink); font-weight:600; }
  .card .p { position:absolute; right:11px; bottom:9px; font-size:12px; font-weight:700;
             color:var(--amb); letter-spacing:.04em; }
  .card.sel .p { color:#8a5a10; }
  .card.blind { border-style:dashed; }
  .card.blind .n { color:var(--dim2); letter-spacing:.3em; }

  #actbar { display:flex; gap:10px; padding:12px 22px 0; }
  #place { flex:1; height:56px; border:0; background:var(--amb); color:#140d02;
    font:inherit; font-size:16px; font-weight:700; letter-spacing:.2em; text-transform:uppercase;
    cursor:pointer; clip-path:polygon(0 0, 100% 0, calc(100% - 18px) 100%, 0 100%); }
  #place:disabled { background:#2a2d33; color:var(--dim2); cursor:default; }
  #cancel { width:56px; height:56px; border:1px solid var(--line2); background:transparent;
    color:var(--dim); font-size:20px; cursor:pointer; }

  /* ── cut view ────────────────────────────────────────────────── */
  #cut { position:fixed; inset:0; z-index:40; background:rgba(6,7,8,.97); display:none;
         padding:64px 26px 26px; }
  #cut.on { display:flex; gap:26px; }
  #cutc { flex:0 0 auto; }
  #cutside { flex:1; max-width:360px; font-size:11px; letter-spacing:.06em; color:var(--dim);
             line-height:2; }
  #cutside h3 { font-size:10px; letter-spacing:.22em; color:var(--dim2); text-transform:uppercase;
                margin:0 0 10px; font-weight:600; }
  #cutside .row { display:flex; justify-content:space-between; border-bottom:1px solid #171a1e;
                  padding:5px 0; }
  #cutside .row b { color:var(--ink); font-weight:600; }

  /* ── end screen ──────────────────────────────────────────────── */
  #end { position:fixed; inset:0; z-index:50; background:rgba(6,7,8,.96); display:none;
         align-items:center; justify-content:center; flex-direction:column; gap:18px; }
  #end.on { display:flex; }
  #end h1 { font-size:34px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; }
  #end p { color:var(--dim); font-size:13px; letter-spacing:.06em; max-width:520px; text-align:center; }
  #end button { height:52px; padding:0 34px; border:0; background:var(--ink); color:#0a0b0d;
    font:inherit; font-size:14px; font-weight:700; letter-spacing:.18em; text-transform:uppercase;
    cursor:pointer; }
</style>
</head>
<body>

<div id="top">
  <div id="modewrap">
    <div id="burger"><i></i></div>
    <div id="mode">descend</div>
  </div>
  <div id="stats">
    <div class="stat"><b id="s-tick">0</b><span>такт</span></div>
    <div class="stat" id="s-syncbox"><b id="s-sync">25</b><span>сверка</span></div>
    <div class="stat"><b id="s-mat">0</b><span>материал</span></div>
  </div>
</div>
<div id="crumbs">ярус 01 · клетка 1,1 · пусто</div>

<div id="hint">
  <b>wasd</b> шаг · <b>qe</b> поворот · <b>enter</b> вниз / поставить<br>
  <b>m</b> разрез · <b>r</b> новый забег · <b>h</b> отладка
</div>

<div id="fab"><span>cut</span></div>
<div id="hazard"></div>

<div id="sheet">
  <div class="stripe"></div>
  <div class="sheetrow">
    <div>
      <div id="bigval">—</div>
      <div id="biglab">масштаб</div>
    </div>
    <div id="prompt"></div>
  </div>
  <div id="cards"></div>
  <div id="actbar">
    <button id="cancel">✕</button>
    <button id="place" disabled>поставить</button>
  </div>
</div>

<div id="cut">
  <div id="cutc"><canvas id="cutcanvas"></canvas></div>
  <div id="cutside"></div>
</div>

<div id="end">
  <h1 id="endtitle">тупик</h1>
  <p id="endtext"></p>
  <button id="restart">новый забег</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ────────────────────────────────────────────────────────────────
   DATUM v2 — step-based draft-crawler. New core, not a patch of v1:
   the world is a shaft of 3x3 chambers per level, and chambers only
   exist because you drafted them. v1's renderer, textures and PS1
   pipeline are reused; v1's maze, shells and combat are not.
   ──────────────────────────────────────────────────────────────── */

const TEXSTRIP = "__TEXTURES__";     // baked by build/make_v2.py
const BUILD = 'dev';

// ── tuning ──────────────────────────────────────────────────────
const C = {
  levels:    12,
  cell:       8,        // tiles per macro cell (1 wall + 6 floor + 1 wall)
  inner:      6,        // walkable tiles inside a cell
  tile:      1.4,       // metres per tile
  wallH:     3.2,       // metres, constant — scale comes from the grid
  eye:       1.62,
  stepDur:   240,       // ms per step
  turnDur:   190,
  renderH:   272,
  jitter:    160,
  syncEvery: 25,
  fog:      0.022,
};

// ── records: the same 30 the paper kit deals ────────────────────
const CARDS = [
  { id:'T-01', role:'ПРОХ', size:4,  pit:'—', type:'проход', ticks:5, down:false, eff:'дверь вбок: ярус не меняется' },
  { id:'T-02', role:'ПРОХ', size:3,  pit:'—', type:'проход', ticks:4, down:true,  eff:'шахта вниз' },
  { id:'T-03', role:'ПРОХ', size:6,  pit:'—', type:'проход', ticks:7, down:true,  eff:'шахта вниз, два выхода' },
  { id:'T-04', role:'ПРОХ', size:4,  pit:'+', type:'проход', ticks:5, down:true,  eff:'шахта вниз и питание ярусу' },
  { id:'T-05', role:'ПРОХ', size:3,  pit:'—', type:'проход', ticks:4, down:true,  eff:'шахта вниз, узкая' },
  { id:'T-06', role:'ПРОХ', size:11, pit:'-', type:'проход', ticks:10, down:true, eff:'зал на два яруса' },
  { id:'T-07', role:'ВОДА', size:4,  pit:'—', type:'вода',   ticks:5, eff:'заливает ярус ниже' },
  { id:'T-08', role:'ВОДА', size:3,  pit:'-', type:'вода',   ticks:4, eff:'гасит питание ниже' },
  { id:'T-09', role:'ВОДА', size:6,  pit:'—', type:'вода',   ticks:7, eff:'резервуар' },
  { id:'T-10', role:'ВОДА', size:3,  pit:'+', type:'вода',   ticks:4, eff:'турбина' },
  { id:'T-11', role:'ВОДА', size:4,  pit:'-', type:'вода',   ticks:5, eff:'дренаж' },
  { id:'T-12', role:'ВОДА', size:6,  pit:'—', type:'вода',   ticks:7, eff:'затопленный ярус' },
  { id:'T-13', role:'ПИТ',  size:3,  pit:'+', type:'питание', ticks:4, eff:'питает два яруса' },
  { id:'T-14', role:'ПИТ',  size:4,  pit:'+', type:'питание', ticks:5, eff:'узел питания' },
  { id:'T-15', role:'ПИТ',  size:6,  pit:'-', type:'питание', ticks:6, eff:'печь' },
  { id:'T-16', role:'ПИТ',  size:3,  pit:'-', type:'питание', ticks:4, eff:'насос' },
  { id:'T-17', role:'ПИТ',  size:4,  pit:'+', type:'питание', ticks:5, eff:'ретранслятор' },
  { id:'T-18', role:'ПИТ',  size:3,  pit:'—', type:'питание', ticks:4, eff:'обесточенный узел' },
  { id:'T-19', role:'ОПОРА', size:6, pit:'—', type:'опора',  ticks:6, eff:'держит два яруса' },
  { id:'T-20', role:'ОПОРА', size:4, pit:'—', type:'опора',  ticks:5, eff:'распорка' },
  { id:'T-21', role:'ОПОРА', size:11,pit:'—', type:'опора',  ticks:9, eff:'несущий каркас' },
  { id:'T-22', role:'ОПОРА', size:3, pit:'+', type:'опора',  ticks:4, eff:'опора с питанием' },
  { id:'T-23', role:'ОПОРА', size:6, pit:'-', type:'опора',  ticks:6, eff:'просевшая' },
  { id:'T-24', role:'ОПОРА', size:4, pit:'—', type:'опора',  ticks:5, eff:'клеймо на опоре' },
  { id:'T-25', role:'БОЙ',  size:4,  pit:'—', type:'бой',    ticks:6, eff:'SEAM' },
  { id:'T-26', role:'БОЙ',  size:6,  pit:'-', type:'бой',    ticks:8, eff:'SEAL' },
  { id:'T-27', role:'БОЙ',  size:3,  pit:'—', type:'бой',    ticks:5, eff:'DRAY' },
  { id:'T-28', role:'БОЙ',  size:4,  pit:'-', type:'бой',    ticks:6, eff:'TALLY' },
  { id:'T-29', role:'БОЙ',  size:6,  pit:'—', type:'бой',    ticks:8, eff:'BREAK' },
  { id:'T-30', role:'БОЙ',  size:11, pit:'-', type:'бой',    ticks:11, eff:'КАДАВР' },
];
const TYPE_IX = { 'проход':0, 'вода':1, 'питание':2, 'опора':3, 'бой':4 };

// What you have lived through: a record's personality is unreadable until you
// have placed it once. Kept outside the run on purpose — that is the meta.
const KNOWN = {};

// ── state ───────────────────────────────────────────────────────
let S = null;

function newRun() {
  S = {
    lv: 0,                                   // 0..levels-1, 0 = top
    cell: { x:1, y:1 },                      // macro cell on the level
    pos:  { x:0, y:0 },                      // tile coords inside the level
    face: 0,                                 // 0 N, 1 E, 2 S, 3 W
    tick: 0, mat: 0,
    levels: [],                              // levels[lv][cy][cx] = room | null
    came: null,                              // the room you arrived from
    seen: 0,                                 // rooms placed this run (decodes records)
    draft: null,                             // {cx,cy,lv,cards,sel,blind}
    mode: 'descend',
    over: null,
    anim: null,
  };
  for (let i = 0; i < C.levels; i++) {
    S.levels.push([ [null,null,null], [null,null,null], [null,null,null] ]);
  }
  // the chamber you wake up in is already yours
  const start = CARDS.find(c => c.id === 'T-03');
  S.levels[0][1][1] = Object.assign({}, start, { placed: true });
  S.pos.x = cellOrigin(1) + 3; S.pos.y = cellOrigin(1) + 3;
  S.face = 2;
  rebuild();
  hud();
}

const cellOrigin = (c) => c * C.cell;      // 0, 8, 16
const cellMid    = (c) => cellOrigin(c) + (C.cell / 2);
const cellOf     = (p) => ({ x: Math.floor(p.x / C.cell), y: Math.floor(p.y / C.cell) });
function atEdge(f) {
  // you may only open a passage from the wall of the chamber you stand in
  const ox = cellOrigin(S.cell.x) + 1, oy = cellOrigin(S.cell.y) + 1;
  const lo = C.inner - 1;
  if (DIR[f][0] ===  1) return S.pos.x === ox + lo;
  if (DIR[f][0] === -1) return S.pos.x === ox;
  if (DIR[f][1] ===  1) return S.pos.y === oy + lo;
  return S.pos.y === oy;
}

// ── the deal: deterministic, opaque, never without a way down ────
function deal(lv, cell, above, water, power, support, read) {
  const a = above ? (TYPE_IX[above.type] * 11 + above.size * 13 + above.ticks * 7) : 3;
  const seed = (lv + 1) * 7 + (cell.cx * 3 + cell.cy) * 5 + a
             + water * 17 + power * 19 + support * 23 + read * 29 + 31;
  const step = 1 + ((lv + 1) % 3);
  const out = [];
  for (let k = 0; k < 3; k++) {
    let idx = ((seed + k * step * 7) % CARDS.length + CARDS.length) % CARDS.length;
    let c = CARDS[idx], guard = 0;
    while (out.some(o => o.id === c.id) && guard++ < 40) { idx = (idx + 1) % CARDS.length; c = CARDS[idx]; }
    out.push(c);
  }
  const bad = (power >= 3) || (water >= 2) || (support === 0 && lv > 1);
  if (bad) {
    const at = (lv + water) % 3;
    out[at] = Object.assign({}, out[at], { blind: true });
  }
  if (!out.some(c => c.down)) {
    const pool = CARDS.filter(c => c.down);
    const pick = pool[seed % pool.length];
    let at = out[0].blind ? 1 : 0;
    if (out[at].blind) at = 2;
    out[at] = pick;
  }
  return { cards: out, bad: bad, seed: seed };
}

function balance(lv) {
  const b = { water:0, power:0, support:0 };
  for (let cy = 0; cy < 3; cy++) for (let cx = 0; cx < 3; cx++) {
    const r = S.levels[lv][cy][cx];
    if (!r) continue;
    if (r.type === 'вода') b.water++;
    if (r.type === 'опора') b.support++;
    if (r.type === 'питание') b.power += (r.pit === '+' ? -1 : 1);
  }
  return b;
}

// ── renderer, PS1 pipeline, textures ────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias:false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
// NB: do not call setSize() with updateStyle on — it writes an inline
// width/height that outranks the stylesheet, and the stage then refuses to
// shrink when the draft sheet opens. sizeRT() owns the size.
renderer.outputEncoding = THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0b0d);
scene.fog = new THREE.FogExp2(0x0a0b0d, C.fog);

const camera = new THREE.PerspectiveCamera(74, innerWidth/innerHeight, 0.08, 400);
const rig  = new THREE.Object3D();
const head = new THREE.Object3D();
rig.add(head); head.add(camera); scene.add(rig);

scene.add(new THREE.HemisphereLight(0x59606b, 0x08090b, 0.5));
const lamp = new THREE.PointLight(0xd9cdb4, 1.5, C.tile * 5.4, 2);
head.add(lamp);

// ── PS1 pipeline without a render target ────────────────────────
// Draw into a 272-line buffer and let the browser stretch it with no
// filtering. A render target plus a blit quad is the other way to do this and
// it is how v1 did it — but the blit material holds a stale texture every time
// the target is resized, and the failure mode is a white screen. One pass has
// no such state.
function sizeRT() {
  const cw = renderer.domElement.clientWidth || innerWidth;
  const ch = renderer.domElement.clientHeight || innerHeight;
  const h = C.renderH;
  const w = Math.max(2, Math.round(h * cw / ch));
  renderer.setSize(w, h, false);          // false: the CSS box is the authority
  camera.aspect = cw / ch;
  camera.updateProjectionMatrix();
}

// 32x32 procedural panels, so the game reads even before the art arrives
function mkc(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.min(255, ((n >> 16) & 255) * f) | 0;
  const g = Math.min(255, ((n >> 8) & 255) * f) | 0;
  const b = Math.min(255, (n & 255) * f) | 0;
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0;
  let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function texPanel(base, seed, vent) {
  const [c, x] = mkc(32, 32), R = mulberry32(seed);
  x.fillStyle = base; x.fillRect(0, 0, 32, 32);
  for (let i = 0; i < 32; i += 8) { x.fillStyle = shade(base, 0.82); x.fillRect(0, i, 32, 1); }
  for (let i = 0; i < 6; i++) { x.fillStyle = shade(base, 1.16); x.fillRect(0, (R() * 32) | 0, 32, 1); }
  if (vent) { for (let i = 0; i < 5; i++) { x.fillStyle = shade(base, 0.6); x.fillRect(6, 9 + i * 3, 20, 1); } }
  for (let i = 0; i < 90; i++) { x.fillStyle = shade(base, 0.72 + R() * 0.55);
    x.fillRect((R() * 32) | 0, (R() * 32) | 0, 1, 1); }
  const t = new THREE.CanvasTexture(c);
  t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestMipmapNearestFilter;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

const TEX = {
  wall:  texPanel('#4a4a45', 11, false),
  floor: texPanel('#3c3c37', 23, false),
  ceil:  texPanel('#2c2c29', 41, true),
  metal: texPanel('#565650', 59, false),
};

function ps1ify(mat) {
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.uJit = { get value() { return C.jitter; } };
    sh.vertexShader = 'uniform float uJit;\n' + sh.vertexShader.replace(
      '#include <project_vertex>',
      '#include <project_vertex>\n' +
      'if (uJit > 0.5) { vec4 sp = gl_Position; sp.xyz /= sp.w;\n' +
      '  sp.xy = floor(sp.xy * uJit) / uJit; sp.xyz *= sp.w; gl_Position = sp; }');
  };
  mat.needsUpdate = true;
  return mat;
}

const M = {
  floor: ps1ify(new THREE.MeshLambertMaterial({ map: TEX.floor, color: 0xb9b9b1 })),
  wall:  ps1ify(new THREE.MeshLambertMaterial({ map: TEX.wall,  color: 0xc2c2ba })),
  ceil:  ps1ify(new THREE.MeshLambertMaterial({ map: TEX.ceil,  color: 0x8f8f89 })),
  metal: ps1ify(new THREE.MeshLambertMaterial({ map: TEX.metal, color: 0xa8a49a })),
  amber: new THREE.MeshBasicMaterial({ color: 0xe8a63c }),
  water: new THREE.MeshLambertMaterial({ color: 0x2c3c4c, transparent: true, opacity: 0.72 }),
  dark:  ps1ify(new THREE.MeshLambertMaterial({ color: 0x2a2c30 })),
};

// bake the art strip over the procedural panels
(function loadStrip() {
  if (!TEXSTRIP || TEXSTRIP.indexOf('data:') !== 0) return;
  const img = new Image();
  img.onload = () => {
    const n = 4, w = Math.floor(img.width / n), h = img.height;
    const slots = [['wall', TEX.wall], ['floor', TEX.floor], ['ceil', TEX.ceil], ['metal', TEX.metal]];
    slots.forEach(([k, t], i) => {
      const [c, x] = mkc(w, h);
      x.drawImage(img, i * w, 0, w, h, 0, 0, w, h);
      t.image = c; t.needsUpdate = true;
    });
  };
  img.src = TEXSTRIP;
})();

// ── level geometry ──────────────────────────────────────────────
// Walkability is derived from the placed chambers: their 6x6 interior,
// plus a two-tile doorway wherever two chambers touch.
let world = null;          // THREE.Group for the current level
let grid = null;           // walkable[x][y] for the current level

function levelGrid(lv) {
  const N = 3 * C.cell;
  const w = [];
  for (let x = 0; x < N; x++) { w.push(new Array(N).fill(false)); }
  const rooms = S.levels[lv];
  for (let cy = 0; cy < 3; cy++) for (let cx = 0; cx < 3; cx++) {
    if (!rooms[cy][cx]) continue;
    const ox = cellOrigin(cx) + 1, oy = cellOrigin(cy) + 1;
    for (let y = 0; y < C.inner; y++) for (let x = 0; x < C.inner; x++) w[ox + x][oy + y] = true;
  }
  // doorways: the middle two tiles of a shared wall
  const mid = Math.floor(C.cell / 2);            // 4
  const pairs = [[0,1],[1,2]];
  for (const [a, b] of pairs) {
    for (let cy = 0; cy < 3; cy++) {
      if (rooms[cy][a] && rooms[cy][b]) {
        const gx = cellOrigin(b);                  // wall x between a and b
        for (let k = 0; k < 2; k++) {
          const y = cellOrigin(cy) + mid + k;
          w[gx][y] = true; w[gx - 1] && (w[gx - 1][y] = true);
        }
      }
    }
    for (let cx = 0; cx < 3; cx++) {
      if (rooms[a][cx] && rooms[b][cx]) {
        const gy = cellOrigin(b);
        for (let k = 0; k < 2; k++) {
          const x = cellOrigin(cx) + mid + k;
          w[x][gy] = true; w[x][gy - 1] && (w[x][gy - 1] = true);
        }
      }
    }
  }
  return w;
}

function boxInto(list, w, h, d, x, y, z, uvs) {
  const g = new THREE.BoxGeometry(w, h, d).toNonIndexed();
  if (uvs) {
    const uv = g.attributes.uv;
    for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * uvs[0], uv.getY(i) * uvs[1]);
  }
  g.translate(x, y, z);
  list.push(g);
}

function mergeGeoms(list) {
  let total = 0;
  for (const g of list) total += g.attributes.position.count;
  const pos = new Float32Array(total * 3), nor = new Float32Array(total * 3), uv = new Float32Array(total * 2);
  let o = 0;
  for (const g of list) {
    pos.set(g.attributes.position.array, o * 3);
    nor.set(g.attributes.normal.array, o * 3);
    uv.set(g.attributes.uv.array, o * 2);
    o += g.attributes.position.count;
    g.dispose();
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  out.setAttribute('normal',   new THREE.BufferAttribute(nor, 3));
  out.setAttribute('uv',       new THREE.BufferAttribute(uv, 2));
  return out;
}

function rebuild() {
  if (world) { scene.remove(world); world.traverse(o => { if (o.geometry) o.geometry.dispose(); }); }
  world = new THREE.Group();
  scene.add(world);
  grid = levelGrid(S.lv);
  const N = 3 * C.cell, T = C.tile;

  const floors = [], walls = [], ceils = [], metal = [], amber = [], water = [];

  for (let x = 0; x < N; x++) for (let y = 0; y < N; y++) {
    if (!grid[x][y]) continue;
    const px = (x + 0.5) * T, pz = (y + 0.5) * T;
    boxInto(floors, T, 0.12, T, px, -0.06, pz, [1, 1]);
    boxInto(ceils,  T, 0.12, T, px, C.wallH, pz, [1, 1]);
    // walls where the neighbour is not walkable
    const nb = [[0,-1,1],[1,0,0],[0,1,1],[-1,0,0]];
    for (let f = 0; f < 4; f++) {
      const nx = x + nb[f][0], ny = y + nb[f][1];
      if (nx >= 0 && ny >= 0 && nx < N && ny < N && grid[nx][ny]) continue;
      const alongX = nb[f][0] !== 0;
      boxInto(walls, alongX ? 0.14 : T, C.wallH, alongX ? T : 0.14,
              px + (alongX ? nb[f][0] * T * 0.5 : 0), C.wallH / 2,
              pz + (alongX ? 0 : nb[f][1] * T * 0.5), [1, 1]);
    }
  }

  // per-chamber dressing, so a room reads as its type from the doorway
  for (let cy = 0; cy < 3; cy++) for (let cx = 0; cx < 3; cx++) {
    const r = S.levels[S.lv][cy][cx];
    if (!r) continue;
    const ox = (cellOrigin(cx) + C.inner / 2) * T, oz = (cellOrigin(cy) + C.inner / 2) * T;
    const half = (C.inner / 2) * T;
    if (r.type === 'вода') {
      boxInto(water, half * 2 - 0.2, 0.03, half * 2 - 0.2, ox, 0.1, oz, null);
      boxInto(metal, 0.16, C.wallH, 0.16, ox - half + 0.6, C.wallH / 2, oz - half + 0.6, null);
      boxInto(metal, 0.16, C.wallH, 0.16, ox + half - 0.6, C.wallH / 2, oz + half - 0.6, null);
    } else if (r.type === 'питание') {
      boxInto(amber, 0.1, C.wallH * 0.5, 0.1, ox, C.wallH * 0.42, oz - half + 0.35, null);
      boxInto(amber, 0.1, C.wallH * 0.5, 0.1, ox, C.wallH * 0.42, oz + half - 0.35, null);
      boxInto(metal, 1.1, 0.9, 1.1, ox, 0.45, oz, null);
    } else if (r.type === 'опора') {
      for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
        boxInto(metal, 0.5, C.wallH, 0.5, ox + sx * (half - 0.5), C.wallH / 2, oz + sz * (half - 0.5), null);
      }
    } else if (r.type === 'бой') {
      const R = mulberry32(cx * 31 + cy * 17 + S.lv);
      for (let i = 0; i < 7; i++) {
        boxInto(metal, 0.4 + R() * 0.6, 0.25 + R() * 0.5, 0.4 + R() * 0.6,
                ox + (R() - 0.5) * half * 1.4, 0.2, oz + (R() - 0.5) * half * 1.4, null);
      }
    } else {
      // проход: a shaft well in the middle, or a pair of pipes overhead
      if (r.down) {
        boxInto(metal, 1.6, 0.1, 1.6, ox, 0.04, oz, null);
        boxInto(amber, 1.3, 0.02, 1.3, ox, 0.11, oz, null);
      } else {
        boxInto(metal, 0.22, 0.22, half * 1.7, ox, C.wallH - 0.5, oz, null);
      }
    }
  }

  const add = (list, mat) => { if (list.length) world.add(new THREE.Mesh(mergeGeoms(list), mat)); };
  add(floors, M.floor); add(walls, M.wall); add(ceils, M.ceil);
  add(metal, M.metal); add(amber, M.amber); add(water, M.water);

  // a single failing lamp per chamber, because a lit room reads as safe
  const r0 = S.levels[S.lv][S.cell.y][S.cell.x];
  if (r0) {
    const l = new THREE.PointLight(r0.type === 'питание' ? 0xe8a63c : 0xbfc5cc, 1.1, C.tile * 6, 2);
    l.position.set(cellMid(S.cell.x) * T, C.wallH - 0.5, cellMid(S.cell.y) * T);
    world.add(l);
  }

  camera.far = 400;
  updateRig(true);
}

function isWalk(x, y) {
  return grid && y >= 0 && y < grid.length && x >= 0 && x < grid.length && grid[x][y];
}

// ── movement ────────────────────────────────────────────────────
const DIR = [[0,-1],[1,0],[0,1],[-1,0]];

function faceOpen() {
  // never arrive staring at a wall
  for (let i = 0; i < 4; i++) {
    const f = (S.face + i) % 4;
    if (isWalk(S.pos.x + DIR[f][0], S.pos.y + DIR[f][1])) { S.face = f; break; }
  }
  updateRig(true);
}

function tryMove(rel) {
  if (S.draft || S.over) return;
  const f = (S.face + rel) % 4;
  const nx = S.pos.x + DIR[f][0], ny = S.pos.y + DIR[f][1];
  if (isWalk(nx, ny)) {
    S.pos.x = nx; S.pos.y = ny;
    S.cell = cellOf(S.pos);
    stepTick();
    updateRig();
    return;
  }
  // a wall: from the edge of the chamber it is a doorway to an unbuilt one,
  // anywhere else it is just a wall
  if (atEdge(f)) {
    const target = neighbourCell(nx, ny);
    if (target) { openDraft(target); return; }
  }
  bump();
}

function neighbourCell(tx, ty) {
  const N = 3 * C.cell;
  if (tx < 0 || ty < 0 || tx >= N || ty >= N) return null;
  const cx = Math.floor(tx / C.cell), cy = Math.floor(ty / C.cell);
  if (cx === S.cell.x && cy === S.cell.y) return null;
  if (S.levels[S.lv][cy][cx]) return null;    // built already but not walkable: a wall
  // must share an edge with the chamber you are standing in
  const dx = Math.abs(cx - S.cell.x), dy = Math.abs(cy - S.cell.y);
  if (dx + dy !== 1) return null;
  return { cx: cx, cy: cy, lv: S.lv };
}

function tryTurn(d) {
  if (S.draft || S.over) return;
  S.face = (S.face + d + 4) % 4;
  updateRig();
}

function tryDescend() {
  if (S.draft || S.over) return;
  const r = S.levels[S.lv][S.cell.y][S.cell.x];
  if (!r || !r.down) { bump(); return; }
  if (S.lv + 1 >= C.levels) { finish('достижение', 'ты на дне. это и был Датум.'); return; }
  if (!S.levels[S.lv + 1][S.cell.y][S.cell.x]) {
    // the shaft ends in nothing yet: draft the chamber below
    openDraft({ cx: S.cell.x, cy: S.cell.y, lv: S.lv + 1 });
    return;
  }
  S.came = r;
  S.lv++;
  S.pos.x = cellOrigin(S.cell.x) + 3; S.pos.y = cellOrigin(S.cell.y) + 3;
  rebuild();
  faceOpen();
  stepTick();
}

function stepTick() {
  S.tick++;
  const next = nextSync();
  if (S.tick >= next) sync();
  hud();
}

function nextSync() {
  return (Math.floor(S.tick / C.syncEvery) + 1) * C.syncEvery;
}

function sync() {
  // the audit: your edits above are rolled back, and a level without a
  // shaft below is a dead end, not a timer running out
  const r = S.levels[S.lv][S.cell.y][S.cell.x];
  if (!r || !r.down) { finish('тупик', 'сверка застала тебя в ярусе без спуска.'); return; }
  flashSync();
}

// ── draft ───────────────────────────────────────────────────────
function openDraft(target) {
  const b = balance(target.lv);
  const above = S.came || S.levels[S.lv][S.cell.y][S.cell.x];
  const d = deal(target.lv, target, above, b.water, b.power, b.support, Math.min(3, S.seen));
  S.draft = { cx: target.cx, cy: target.cy, lv: target.lv, cards: d.cards, sel: -1, bad: d.bad };
  S.mode = 'draft';
  paintDraft();
  document.body.classList.add('draft');
  document.getElementById('sheet').classList.add('on');
  sizeRT();
  hud();
}

function paintDraft() {
  const d = S.draft;
  document.getElementById('bigval').textContent = d.sel < 0 ? '—' : d.cards[d.sel].size;
  document.getElementById('biglab').textContent = d.sel < 0 ? 'масштаб' : 'масштаб, м';
  const prompt = document.getElementById('prompt');
  prompt.innerHTML = 'проход открыт. три записи реестра, поля читаются, личность — нет.' +
    (d.bad ? '<br><em>сектор в плохом состоянии: одна запись нечитаема.</em>' : '');
  const box = document.getElementById('cards');
  box.innerHTML = d.cards.map((c, i) => {
    const blind = !!c.blind;
    const known = !!KNOWN[c.id] && !blind;
    return '<div class="card' + (blind ? ' blind' : '') + (d.sel === i ? ' sel' : '') + '" data-i="' + i + '">' +
      '<div class="k">' + c.id + ' · ' + c.type + '</div>' +
      '<div class="n">' + (known ? c.eff : '▒▒▒▒ ▒▒▒') + '</div>' +
      '<div class="f">роль <b>' + c.role + '</b><br>⌀ <b>' + c.size + '</b> м · пит <b>' + c.pit + '</b>' +
      (c.down ? '<br><b>спуск</b>' : '') + '</div>' +
      '<div class="p">' + c.ticks + ' т</div>' +
      '</div>';
  }).join('');
  Array.prototype.forEach.call(box.querySelectorAll('.card'), el => {
    el.onclick = () => { S.draft.sel = +el.dataset.i; paintDraft(); };
  });
  document.getElementById('place').disabled = d.sel < 0;
}

function closeDraft() {
  S.draft = null; S.mode = 'descend';
  document.getElementById('sheet').classList.remove('on');
  document.body.classList.remove('draft');
  sizeRT();
  hud();
}

function placeChosen() {
  const d = S.draft;
  if (!d || d.sel < 0) return;
  const c = d.cards[d.sel];
  S.levels[d.lv][d.cy][d.cx] = Object.assign({}, c, { placed: true });
  KNOWN[c.id] = true;                    // you have now seen what it does
  S.seen++;
  S.tick += c.ticks;
  const sameLevel = d.lv === S.lv;
  closeDraft();
  S.came = c;
  if (sameLevel) {
    // the chamber rises where you were looking; you walk into it yourself
    rebuild();
    S.buildAnim = performance.now();
    if (world) world.scale.y = 0.04;
  } else {
    // you rode the shaft down into a chamber that did not exist yet
    S.lv = d.lv;
    S.cell = { x: d.cx, y: d.cy };
    S.pos = { x: cellOrigin(d.cx) + 3, y: cellOrigin(d.cy) + 3 };
    rebuild();
    faceOpen();
  }
  if (S.tick >= nextSync()) sync();
  hud();
}

// ── camera ──────────────────────────────────────────────────────
let bobT = 0;

function updateRig() {
  // Position is set, never lerped. The step used to interpolate over 240 ms,
  // which makes the camera's location a function of frame timing: on a slow
  // frame or a paused tab it simply never arrives, and you end up looking at a
  // wall you never walked into. The dip below carries the motion instead.
  const T = C.tile;
  rig.position.set((S.pos.x + 0.5) * T, C.eye, (S.pos.y + 0.5) * T);
  rig.rotation.y = -S.face * Math.PI / 2;
  bobT = performance.now();
}

function tickAnim(now) {
  const k = Math.min(1, (now - bobT) / C.stepDur);
  head.position.y = k < 1 ? -Math.sin(k * Math.PI) * 0.045 : 0;
  if (S.buildAnim) {
    const kb = Math.min(1, (now - S.buildAnim) / 620);
    const e = 1 - Math.pow(1 - kb, 3);
    if (world) world.scale.y = 0.04 + 0.96 * e;
    if (kb >= 1) { if (world) world.scale.y = 1; S.buildAnim = null; }
  }
}

// ── hud ─────────────────────────────────────────────────────────
function hud() {
  document.getElementById('mode').textContent =
    S.over ? 'end' : (S.draft ? 'draft' : 'descend');
  const modeEl = document.getElementById('mode');
  modeEl.className = S.draft ? 'amber' : '';
  document.getElementById('s-tick').textContent = S.tick;
  const nx = nextSync();
  document.getElementById('s-sync').textContent = Math.max(0, nx - S.tick);
  document.getElementById('s-mat').textContent = S.mat;
  document.getElementById('s-syncbox').className =
    'stat' + ((nx - S.tick) <= 5 ? ' warn' : ((nx - S.tick) <= 10 ? ' hot' : ''));
  document.getElementById('hazard').className = (nx - S.tick) <= 5 ? 'on' : '';

  const room = S.levels[S.lv][S.cell.y][S.cell.x];
  const b = balance(S.lv);
  document.getElementById('crumbs').textContent =
    'ярус ' + String(S.lv + 1).padStart(2, '0') + ' · клетка ' + (S.cell.x + 1) + ',' + (S.cell.y + 1) +
    ' · ' + (room ? room.type : 'пусто') +
    ' · вода ' + b.water + ' питание ' + b.power + ' опора ' + b.support;
}

function bump() { /* a wall that leads nowhere: no tick, no sound yet */ }

function flashSync() {
  const hz = document.getElementById('hazard');
  hz.classList.add('on');
  setTimeout(() => hz.classList.toggle('on', (nextSync() - S.tick) <= 5), 900);
}

function finish(title, text) {
  S.over = true;
  document.getElementById('endtitle').textContent = title;
  document.getElementById('endtext').textContent = text +
    ' тактов: ' + S.tick + ' · ярус: ' + (S.lv + 1) + ' · комнат: ' + S.seen;
  document.getElementById('end').classList.add('on');
  hud();
}

// ── cut view ────────────────────────────────────────────────────
function openCut() {
  const c = document.getElementById('cut');
  c.classList.add('on');
  drawCut();
  const side = document.getElementById('cutside');
  const b = balance(S.lv);
  side.innerHTML = '<h3>разрез</h3>' +
    '<div class="row"><span>ярус</span><b>' + (S.lv + 1) + ' / ' + C.levels + '</b></div>' +
    '<div class="row"><span>вода</span><b>' + b.water + '</b></div>' +
    '<div class="row"><span>питание</span><b>' + b.power + '</b></div>' +
    '<div class="row"><span>опора</span><b>' + b.support + '</b></div>' +
    '<div class="row"><span>такт</span><b>' + S.tick + '</b></div>' +
    '<div class="row"><span>до сверки</span><b>' + Math.max(0, nextSync() - S.tick) + '</b></div>' +
    '<p style="margin-top:18px;color:#5d636c;line-height:1.9">' +
    'вода идёт вниз, питание идёт сверху, опора держит то, что над ней. ' +
    'сверка откатывает правки: держись ярусов со спуском.</p>';
}
function closeCut() { document.getElementById('cut').classList.remove('on'); }

function drawCut() {
  const cv = document.getElementById('cutcanvas');
  const cols = 3, rows = C.levels;
  const cw = 76, chh = 46, padL = 54, padT = 8;
  cv.width = padL + cols * cw + 4;
  cv.height = padT + rows * chh + 4;
  cv.style.width = cv.width + 'px'; cv.style.height = cv.height + 'px';
  const x = cv.getContext('2d');
  x.fillStyle = '#060708'; x.fillRect(0, 0, cv.width, cv.height);
  for (let lv = 0; lv < rows; lv++) {
    const y0 = padT + lv * chh;
    x.fillStyle = lv === S.lv ? '#e8a63c' : '#3a3f47';
    x.font = '600 11px Segoe UI, Arial';
    x.textAlign = 'right';
    x.fillText(String(lv + 1).padStart(2, '0'), padL - 12, y0 + chh / 2 + 4);
    for (let cy = 0; cy < 3; cy++) for (let cx = 0; cx < 3; cx++) {
      const r = S.levels[lv][cy][cx];
      const px = padL + cx * cw + 3, py = y0 + 3, w = cw - 6, h = chh - 6;
      const here = (lv === S.lv && cx === S.cell.x && cy === S.cell.y);
      if (!r) {
        x.strokeStyle = '#1b1e22'; x.lineWidth = 1;
        x.strokeRect(px, py, w, h);
        continue;
      }
      x.fillStyle = r.type === 'вода' ? '#22303d'
                  : r.type === 'питание' ? '#2e2617'
                  : r.type === 'опора' ? '#24262a' : '#1c1f24';
      x.fillRect(px, py, w, h);
      x.strokeStyle = here ? '#e8a63c' : '#2c3037';
      x.lineWidth = here ? 2 : 1;
      x.strokeRect(px + .5, py + .5, w - 1, h - 1);
      x.fillStyle = here ? '#e8a63c' : '#8b919b';
      x.font = '600 10px Segoe UI, Arial'; x.textAlign = 'left';
      x.fillText(r.id, px + 6, py + 15);
      x.fillStyle = '#5d636c'; x.font = '10px Segoe UI, Arial';
      x.fillText(r.type + (r.down ? ' ↓' : ''), px + 6, py + 29);
      if (r.type === 'вода') { x.fillStyle = '#4d6a86'; x.fillRect(px + 6, py + h - 8, w - 12, 3); }
      if (r.type === 'опора') { x.fillStyle = '#565650'; x.fillRect(px + 6, py + h - 8, w - 12, 3); }
      if (r.type === 'питание') { x.fillStyle = '#e8a63c'; x.fillRect(px + 6, py + h - 8, w - 12, 3); }
    }
  }
}

// ── input ───────────────────────────────────────────────────────
addEventListener('keydown', ev => {
  const k = ev.code;
  if (k === 'KeyM') { ev.preventDefault(); document.getElementById('cut').classList.contains('on') ? closeCut() : openCut(); return; }
  if (k === 'Escape') { if (S.draft) closeDraft(); else closeCut(); return; }
  if (k === 'KeyR') { newRun(); document.getElementById('end').classList.remove('on'); return; }
  if (S.over) return;
  if (S.draft) {
    if (k === 'Digit1' || k === 'Digit2' || k === 'Digit3') {
      S.draft.sel = +k.slice(5) - 1; paintDraft(); return;
    }
    if (k === 'Enter' || k === 'Space') { ev.preventDefault(); placeChosen(); return; }
    return;
  }
  if (k === 'KeyW' || k === 'ArrowUp')    { ev.preventDefault(); tryMove(0); return; }
  if (k === 'KeyS' || k === 'ArrowDown')  { ev.preventDefault(); tryMove(2); return; }
  if (k === 'KeyA')                       { ev.preventDefault(); tryMove(3); return; }
  if (k === 'KeyD')                       { ev.preventDefault(); tryMove(1); return; }
  if (k === 'KeyQ' || k === 'ArrowLeft')  { ev.preventDefault(); tryTurn(-1); return; }
  if (k === 'KeyE' || k === 'ArrowRight') { ev.preventDefault(); tryTurn(1); return; }
  if (k === 'Enter')                      { ev.preventDefault(); tryDescend(); return; }
});

document.getElementById('place').onclick = placeChosen;
document.getElementById('cancel').onclick = closeDraft;
document.getElementById('fab').onclick = () => {
  document.getElementById('cut').classList.contains('on') ? closeCut() : openCut();
};
document.getElementById('restart').onclick = () => {
  document.getElementById('end').classList.remove('on'); newRun();
};

addEventListener('resize', () => { sizeRT(); });

// ── loop ────────────────────────────────────────────────────────
let last = performance.now();
function tick(now) {
  requestAnimationFrame(tick);
  tickAnim(now);
  renderer.render(scene, camera);
}

document.title = 'DATUM v2 · ' + BUILD;
sizeRT();
newRun();
updateRig(true);
requestAnimationFrame(tick);
</script>
</body>
