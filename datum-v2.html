<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>DATUM v2 · DRAFT</title>
<style>
  /* ── DATUM v2 interface ─────────────────────────────────────────
     Layout from Kubik: a mode plate top-left, three outlined readouts
     top-right, a bottom sheet with one big number and one big action,
     corner-cut plates, hazard stripes for danger. Geometric sans, not
     monospace — the registry speaks in words, not in letterforms.     */
  :root {
    --bg:#0a0b0d; --plate:#15171b; --plate2:#1c1f24;
    --line:#2c3037; --line2:#3a3f47;
    --ink:#e8e9ec; --dim:#8b919b; --dim2:#5d636c;
    --amb:#e8a63c; --red:#e0563a;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; background:var(--bg); overflow:hidden;
    font-family:"Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif;
    color:var(--ink); -webkit-font-smoothing:antialiased; }
  canvas { display:block; }
  body > canvas { position:fixed; left:0; top:0; width:100%; height:100%;
    image-rendering:pixelated; z-index:0; }

  /* ── top bar ─────────────────────────────────────────────────── */
  #top { position:fixed; top:0; left:0; right:0; height:64px; display:flex;
         align-items:flex-start; justify-content:space-between; padding:14px 16px;
         pointer-events:none; z-index:20; }
  #modewrap { display:flex; align-items:flex-start; gap:10px; }
  #burger { width:56px; height:56px; border:1px solid var(--line2); background:var(--plate);
    display:flex; align-items:center; justify-content:center; }
  #burger i { display:block; width:22px; height:2px; background:var(--ink);
    box-shadow:0 -7px 0 var(--ink), 0 7px 0 var(--ink); }
  #mode { height:56px; padding:0 30px 0 18px; display:flex; align-items:center;
    background:var(--ink); color:#0a0b0d; font-weight:700; font-size:19px;
    letter-spacing:.14em; text-transform:uppercase;
    clip-path:polygon(0 0, 100% 0, calc(100% - 22px) 100%, 0 100%); }
  #mode::before { content:"■"; margin-right:10px; font-size:13px; }
  #mode.amber { background:var(--amb); }
  #mode.danger { background:var(--red); color:#fff; }

  #crumbs { position:relative; margin:2px 0 0 66px; font-size:11px; letter-spacing:.18em;
    color:var(--dim2); text-transform:uppercase; }

  #stats { display:flex; gap:8px; }
  .stat { width:82px; height:56px; border:1px solid var(--line2); background:rgba(10,11,13,.72);
          padding:7px 9px 0; }
  .stat b { display:block; font-size:21px; font-weight:700; letter-spacing:.02em; line-height:1; }
  .stat span { display:block; margin-top:5px; font-size:9px; letter-spacing:.18em;
               color:var(--dim2); text-transform:uppercase; }
  .stat.hot b { color:var(--amb); }
  .stat.warn b { color:var(--red); }

  /* ── crosshair ───────────────────────────────────────────────── */
  #cross { position:fixed; left:50%; top:50%; width:16px; height:16px; z-index:18;
    transform:translate(-50%,-50%); pointer-events:none; opacity:.55; }
  #cross::before, #cross::after { content:""; position:absolute; background:var(--ink); }
  #cross::before { left:7px; top:0; width:2px; height:16px; }
  #cross::after  { top:7px; left:0; height:2px; width:16px; }
  #cross.hot::before, #cross.hot::after { background:var(--amb); }
  #cross.hot { opacity:1; }

  /* ── gate prompt ─────────────────────────────────────────────── */
  #prompt { position:fixed; left:50%; top:calc(50% + 46px); transform:translateX(-50%);
    z-index:18; font-size:12px; letter-spacing:.2em; text-transform:uppercase;
    color:var(--amb); background:rgba(8,9,11,.72); padding:7px 14px;
    display:none; white-space:nowrap;
    clip-path:polygon(0 0, 100% 0, 100% calc(100% - 9px), calc(100% - 9px) 100%, 0 100%); }
  #prompt.on { display:block; }
  #prompt b { color:#160f02; background:var(--amb); padding:2px 7px; margin-right:9px; }

  /* ── event callout: the audit says what it took ─────────────── */
  #event { position:fixed; left:50%; top:calc(50% - 118px); transform:translateX(-50%);
    z-index:25; font-size:12px; letter-spacing:.2em; text-transform:uppercase;
    color:var(--red); background:rgba(8,9,11,.82); padding:8px 18px; opacity:0;
    transition:opacity .3s linear; pointer-events:none; white-space:nowrap;
    clip-path:polygon(0 0, 100% 0, 100% calc(100% - 9px), calc(100% - 9px) 100%, 0 100%); }
  #event.on { opacity:1; }
  /* ── pointer hint: a toast, never a blocker ──────────────────── */
  #lock { position:fixed; left:50%; bottom:70px; transform:translateX(-50%); z-index:22;
    font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--dim);
    background:rgba(8,9,11,.8); padding:8px 16px; pointer-events:none;
    clip-path:polygon(0 0, 100% 0, 100% calc(100% - 9px), calc(100% - 9px) 100%, 0 100%);
    transition:opacity .4s linear; }
  #lock.off { opacity:0; }

  /* ── hint line ───────────────────────────────────────────────── */
  #hint { position:fixed; left:16px; bottom:16px; font-size:11px; letter-spacing:.1em;
    color:#7d838d; line-height:1.9; z-index:20; text-transform:uppercase;
    background:rgba(8,9,11,.72); padding:7px 13px 8px 11px;
    clip-path:polygon(0 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%); }
  #hint b { color:#b9bfc8; font-weight:600; }

  /* ── fab: the cut ────────────────────────────────────────────── */
  #fab { position:fixed; right:22px; bottom:22px; width:60px; height:60px; z-index:21;
    border:1px solid var(--line2); background:rgba(10,11,13,.8); transform:rotate(45deg);
    display:flex; align-items:center; justify-content:center; cursor:pointer; }
  #fab span { transform:rotate(-45deg); font-size:10px; letter-spacing:.14em; color:var(--ink); }
  #fab:hover { border-color:var(--amb); }
  #fab:hover span { color:var(--amb); }

  #hazard { position:fixed; left:0; right:0; bottom:0; height:9px; z-index:19; display:none;
    background:repeating-linear-gradient(-45deg, var(--red) 0 12px, #1a0d09 12px 24px); }
  #hazard.on { display:block; }

  /* ── draft: the choice sits in the middle of the room ────────── */
  #sheet { position:fixed; inset:0; z-index:30; display:none;
    align-items:center; justify-content:center; flex-direction:column; gap:16px;
    background:rgba(4,5,6,.72); padding:24px; }
  #sheet.on { display:flex; }

  #drafthead { text-align:center; max-width:680px; }
  #drafthead .k { font-size:10px; letter-spacing:.3em; color:var(--dim2); text-transform:uppercase; }
  #drafthead .w { font-size:26px; font-weight:700; letter-spacing:.16em; text-transform:uppercase;
                  color:var(--amb); margin-top:5px; }
  #drafthead .s { font-size:11px; letter-spacing:.06em; color:var(--dim); margin-top:9px; line-height:1.6; }
  #drafthead .s em { color:var(--amb); font-style:normal; }

  #cards { display:flex; gap:14px; justify-content:center; }
  .card { width:236px; border:1px solid var(--line2); background:var(--plate);
    padding:0 0 12px; cursor:pointer; position:relative;
    clip-path:polygon(0 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%);
    transition:transform .12s ease, border-color .12s ease; }
  .card:hover { border-color:var(--dim); transform:translateY(-3px); }
  .card.sel { border-color:var(--ink); background:var(--ink); color:#0a0b0d; }
  .card .art { height:130px; background:#0c0e11 center/cover no-repeat;
    border-bottom:1px solid var(--line2); display:flex; align-items:center;
    justify-content:center; }
  .card .art span { font-size:24px; letter-spacing:.12em; color:#24272c; font-weight:700; }
  .card .k { font-size:9px; letter-spacing:.2em; color:var(--dim2); text-transform:uppercase;
             padding:9px 12px 0; }
  .card .n { font-size:13px; font-weight:700; margin:6px 12px 8px; line-height:1.35; min-height:36px; }
  .card .f { font-size:11px; letter-spacing:.06em; color:var(--dim); line-height:1.75; padding:0 12px; }
  .card .f b { color:var(--ink); font-weight:600; }
  .card.sel .k, .card.sel .f b, .card.sel .n { color:#0a0b0d; }
  .card.sel .f { color:#41454c; }
  .card .p { position:absolute; right:12px; bottom:11px; font-size:12px; font-weight:700;
             color:var(--amb); letter-spacing:.04em; }
  .card.sel .p { color:#8a5a10; }
  .card.blind { border-style:dashed; }

  #actbar { display:flex; gap:10px; align-items:center; }
  #place { height:54px; padding:0 46px; border:0; background:var(--amb); color:#140d02;
    font:inherit; font-size:15px; font-weight:700; letter-spacing:.2em; text-transform:uppercase;
    cursor:pointer; clip-path:polygon(0 0, 100% 0, calc(100% - 16px) 100%, 0 100%); }
  #place:disabled { background:#2a2d33; color:var(--dim2); cursor:default; }
  #cancel { width:54px; height:54px; border:1px solid var(--line2); background:transparent;
    color:var(--dim); font-size:20px; cursor:pointer; }
  #draftfoot { font-size:10px; letter-spacing:.16em; color:var(--dim2); text-transform:uppercase; }

  /* ── the sealed cabinet ──────────────────────────────────────── */
  #code { position:fixed; inset:0; z-index:31; display:none; align-items:center;
    justify-content:center; flex-direction:column; gap:18px; background:rgba(4,5,6,.78);
    padding:24px; }
  #code.on { display:flex; }
  #code h2 { font-size:20px; font-weight:700; letter-spacing:.22em; text-transform:uppercase; }
  #codebody { display:flex; flex-direction:column; align-items:center; gap:16px; }
  #codebody .slots { display:flex; gap:12px; }
  #codebody .slot { width:78px; height:78px; border:1px solid var(--line2); background:#0e1013;
    display:flex; align-items:center; justify-content:center; }
  #codebody .slot img { width:58px; height:58px; }
  #codebody .pal { display:flex; gap:10px; }
  #codebody .sig { width:64px; height:64px; border:1px solid var(--line2); background:#121417;
    cursor:pointer; display:flex; align-items:center; justify-content:center; }
  #codebody .sig:hover { border-color:var(--amb); }
  #codebody .sig img { width:44px; height:44px; }
  #codebody .hint { font-size:10px; letter-spacing:.16em; color:var(--dim2); text-transform:uppercase; }
  #codebody .hint.amber { color:var(--amb); }
  /* ── cut view ────────────────────────────────────────────────── */
  #cut { position:fixed; inset:0; z-index:40; display:none; pointer-events:none;
         padding:64px 26px 26px; }
  #cut.on { display:block; }
  
  #cutside { width:262px; background:rgba(6,7,8,.84); padding:12px 14px; font-size:11px; letter-spacing:.06em; color:var(--dim);
             line-height:2; }
  #cutside h3 { font-size:10px; letter-spacing:.22em; color:var(--dim2); text-transform:uppercase;
                margin:0 0 10px; font-weight:600; }
  #cutside .row { display:flex; justify-content:space-between; border-bottom:1px solid #171a1e;
                  padding:5px 0; }
  #cutside .row b { color:var(--ink); font-weight:600; }
  #cutside .maphint { margin-top:12px; color:#6b7078; line-height:1.8; }
  #cutside .maphint.dim { color:#43484f; }

  /* ── end screen ──────────────────────────────────────────────── */
  #end { position:fixed; inset:0; z-index:50; background:rgba(6,7,8,.96); display:none;
         align-items:center; justify-content:center; flex-direction:column; gap:18px; }
  #end.on { display:flex; }
  #end h1 { font-size:34px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; }
  #end p { color:var(--dim); font-size:13px; letter-spacing:.06em; max-width:520px; text-align:center; }
  #end button { height:52px; padding:0 34px; border:0; background:var(--ink); color:#0a0b0d;
    font:inherit; font-size:14px; font-weight:700; letter-spacing:.18em; text-transform:uppercase;
    cursor:pointer; }
</style>
</head>
<body>

<div id="top">
  <div id="modewrap">
    <div id="burger"><i></i></div>
    <div id="mode">descend</div>
  </div>
  <div id="stats">
    <div class="stat"><b id="s-tick">0</b><span>такт</span></div>
    <div class="stat" id="s-syncbox"><b id="s-sync">25</b><span>сверка</span></div>
    <div class="stat"><b id="s-rooms">1</b><span>отсеков</span></div>
  </div>
</div>
<div id="crumbs">отсек 1 · шлюзов 2</div>

<div id="cross"></div>
<div id="prompt"></div>
<div id="event"></div>

<div id="hint">
  <b>wasd</b> идти · <b>мышь</b> смотреть · <b>e</b> шлюз · <b>m</b> разрез<br>
  <b>esc</b> курсор · <b>r</b> новый забег
</div>

<div id="fab"><span>cut</span></div>
<div id="hazard"></div>

<div id="lock">клик по экрану — смотреть мышью · или тяни мышью с зажатой кнопкой</div>

<div id="sheet">
  <div id="drafthead">
    <div class="k">открыт шлюз</div>
    <div class="w" id="draftWhere">север</div>
    <div class="s" id="draftNote"></div>
  </div>
  <div id="cards"></div>
  <div id="actbar">
    <button id="cancel">✕</button>
    <button id="place" disabled>поставить</button>
  </div>
  <div id="draftfoot">клик — выбрать · enter — поставить · esc — отмена</div>
</div>

<div id="code">
  <h2>опечатанный шкаф</h2>
  <div id="codebody"></div>
</div>
<div id="cut">
  
  <div id="cutside"></div>
</div>

<div id="end">
  <h1 id="endtitle">тупик</h1>
  <p id="endtext"></p>
  <button id="restart">новый забег</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ────────────────────────────────────────────────────────────────
   DATUM v2 — the compartments are the level.

   Rules this file obeys (author, 05.11):
   - a compartment is a box with gates in its walls, floor or ceiling;
   - you draft only while standing at a gate, and only with E;
   - the gate you drafted through is also the way back;
   - a turn is a GATE-TO-GATE transition. Walking inside costs nothing;
   - inside a compartment you move like a shooter: wasd, mouse look.
   ──────────────────────────────────────────────────────────────── */

const TEXSTRIP = "__TEXTURES__";     // baked by build/make_v2.py
const BUILD = 'dev';

const C = {
  size:      8.6,     // outer metres of a compartment
  inner:     8.2,     // wall to wall
  height:    3.5,
  wallT:     0.2,
  gateW:     2.4,
  gateH:     2.7,
  eye:       1.62,
  speed:     4.0,
  reach:     2.4,     // how close to a gate before E does anything
  renderH:   272,
  jitter:    160,
  syncEvery: 25,
  fog:       0.016,
};

// ── records ─────────────────────────────────────────────────────
const CARDS = [
  { id:'T-01', role:'ПРОХ', size:4,  pit:'—', type:'проход', ticks:5,  eff:'две двери без спуска' },
  { id:'T-02', role:'ПРОХ', size:3,  pit:'—', type:'проход', ticks:4,  down:true, eff:'шахта вниз' },
  { id:'T-03', role:'ПРОХ', size:6,  pit:'—', type:'проход', ticks:7,  down:true, eff:'шахта вниз, два выхода' },
  { id:'T-04', role:'ПРОХ', size:4,  pit:'+', type:'проход', ticks:5,  down:true, eff:'шахта вниз и питание' },
  { id:'T-05', role:'ПРОХ', size:3,  pit:'—', type:'проход', ticks:4,  up:true,   eff:'люк вверх, узкий' },
  { id:'T-06', role:'ПРОХ', size:11, pit:'-', type:'проход', ticks:10, down:true, up:true, eff:'зал на два яруса' },
  { id:'T-07', role:'ВОДА', size:4,  pit:'—', type:'вода',   ticks:5, eff:'заливает низ' },
  { id:'T-08', role:'ВОДА', size:3,  pit:'-', type:'вода',   ticks:4, eff:'гасит питание ниже' },
  { id:'T-09', role:'ВОДА', size:6,  pit:'—', type:'вода',   ticks:7, eff:'резервуар' },
  { id:'T-10', role:'ВОДА', size:3,  pit:'+', type:'вода',   ticks:4, eff:'турбина' },
  { id:'T-11', role:'ВОДА', size:4,  pit:'-', type:'вода',   ticks:5, eff:'дренаж' },
  { id:'T-12', role:'ВОДА', size:6,  pit:'—', type:'вода',   ticks:7, eff:'затопленный ярус' },
  { id:'T-13', role:'ПИТ',  size:3,  pit:'+', type:'питание', ticks:4, eff:'питает два яруса' },
  { id:'T-14', role:'ПИТ',  size:4,  pit:'+', type:'питание', ticks:5, eff:'узел питания' },
  { id:'T-15', role:'ПИТ',  size:6,  pit:'-', type:'питание', ticks:6, eff:'печь' },
  { id:'T-16', role:'ПИТ',  size:3,  pit:'-', type:'питание', ticks:4, eff:'насос' },
  { id:'T-17', role:'ПИТ',  size:4,  pit:'+', type:'питание', ticks:5, eff:'ретранслятор' },
  { id:'T-18', role:'ПИТ',  size:3,  pit:'—', type:'питание', ticks:4, eff:'обесточенный узел' },
  { id:'T-19', role:'ОПОРА', size:6, pit:'—', type:'опора',  ticks:6, eff:'держит два яруса' },
  { id:'T-20', role:'ОПОРА', size:4, pit:'—', type:'опора',  ticks:5, eff:'распорка' },
  { id:'T-21', role:'ОПОРА', size:11,pit:'—', type:'опора',  ticks:9, eff:'несущий каркас' },
  { id:'T-22', role:'ОПОРА', size:3, pit:'+', type:'опора',  ticks:4, eff:'опора с питанием' },
  { id:'T-23', role:'ОПОРА', size:6, pit:'-', type:'опора',  ticks:6, eff:'просевшая' },
  { id:'T-24', role:'ОПОРА', size:4, pit:'—', type:'опора',  ticks:5, eff:'клеймо на опоре' },
];
const TYPE_IX = { 'проход':0, 'вода':1, 'питание':2, 'опора':3 };

// The second archetype's compartments. They are not in the deck until the
// qualia is found, and they are the ones that reward a grapple.
const EXTRA = [
  { id:'Q-01', role:'СЦЕП', size:4, pit:'—', type:'проход',  ticks:5, down:true, up:true, eff:'колодец насквозь' },
  { id:'Q-02', role:'СЦЕП', size:3, pit:'+', type:'питание', ticks:4, up:true,   eff:'люк вверх, питание' },
  { id:'Q-03', role:'СЦЕП', size:6, pit:'—', type:'опора',   ticks:7, down:true, eff:'шахта вниз, тяжёлая' },
  { id:'Q-04', role:'СЦЕП', size:4, pit:'-', type:'вода',    ticks:5, up:true,   eff:'вода сверху, люк' },
];
const ARCH = {
  BALLAST: { name:'БАЛЛАСТ', grapple:false },
  VECTOR:  { name:'ВЕКТОР',  grapple:true  },
};

// The hub is not a record you can draw: it is where the structure begins.
// Ticks do not run in it, so entering it is free.
const HUB = { id:'H-00', role:'ХАБ', size:11, pit:'—', type:'хаб', ticks:0,
              eff:'регламентный отсек: место пуска' };

// gates are named after the wall they sit in; y is up
const GATES = {
  N: { v:[0,0,-1], name:'север',  opp:'S' },
  S: { v:[0,0, 1], name:'юг',     opp:'N' },
  E: { v:[1,0, 0], name:'восток', opp:'W' },
  W: { v:[-1,0,0], name:'запад',  opp:'E' },
  UP:   { v:[0, 1,0], name:'верх', opp:'DOWN' },
  DOWN: { v:[0,-1,0], name:'низ',  opp:'UP' },
};
const HORIZ = ['N','E','S','W'];
const KNOWN = {};                    // what you have lived through

// Room art per type, injected by build/make_v2.py as window.__ROOMART__.
// Without it the cards show a glyph, so the prototype never depends on art.
const ROOMART = (typeof window !== 'undefined' && window.__ROOMART__) ? window.__ROOMART__ : {};
const TYPE_GLYPH = { 'проход':'▤', 'вода':'≋', 'питание':'⌁', 'опора':'▮', 'хаб':'◉' };

// ── state ───────────────────────────────────────────────────────
let S = null;
const key = (x, y, z) => x + ',' + y + ',' + z;

function newRun() {
  S = {
    rooms: {},                       // "x,y,z" -> room
    here: '0,0,0',
    pos: { x: 0, z: 0 },             // local metres, origin = room centre
    yaw: 0, pitch: 0,
    ticks: 0, placed: 0, mat: 0,
    team: ['BALLAST'], arch: 0,
    passed: {},
    came: null,                      // the card of the room you are in
    draft: null,
    over: null,
  };
  // You wake up in the hub, in a corner of it: the walls behind you are the
  // edge of the structure, and there is nothing to open there. Two gates lead
  // in, both ahead of you.
  S.rooms['0,0,0'] = { card: HUB, x:0, y:0, z:0, gates: ['N','E'], seen: true };
  S.pos.x = -2.55; S.pos.z = 2.85; S.yaw = 0; S.pitch = 0;
  rebuild();
  hud();
}

function hasGrapple() { return !!(ARCH[S.team[S.arch]] && ARCH[S.team[S.arch]].grapple); }
function deck() { return S.team.indexOf('VECTOR') >= 0 ? CARDS.concat(EXTRA) : CARDS; }
function fightAt(r) { return Math.abs((r.x*37 + r.y*53 + r.z*29 + 7) % 100) < 34; }

// ── the deal: deterministic, opaque, always with a way on ────────
function deal(depth, cell, above, water, power, support, read) {
  const a = above ? (TYPE_IX[above.type] * 11 + above.size * 13 + above.ticks * 7) : 3;
  const seed = (depth + 1) * 7 + (cell.x * 3 + cell.z) * 5 + (cell.y || 0) * 11 + a
             + water * 17 + power * 19 + support * 23 + read * 29 + 31;
  const step = 1 + ((depth + 1) % 3);
  const pool = deck();
  const out = [];
  for (let k = 0; k < 3; k++) {
    let idx = ((seed + k * step * 7) % pool.length + pool.length) % pool.length;
    let c = pool[idx], guard = 0;
    while (out.some(o => o.id === c.id) && guard++ < 40) { idx = (idx + 1) % pool.length; c = pool[idx]; }
    out.push(c);
  }
  const bad = (power >= 3) || (water >= 2) || (support === 0 && depth > 1);
  if (bad) {
    const at = (depth + water) % 3;
    out[at] = Object.assign({}, out[at], { blind: true });
  }
  // a compartment offered here must be able to continue: keep the vertical
  // gates that the card promises, and guarantee at least one more horizontal
  if (!out.some(c => c.down || c.up)) {
    const pool2 = pool.filter(c => c.down || c.up);
    const pick = pool2[seed % pool2.length];
    let at = out[0].blind ? 1 : 0;
    if (out[at].blind) at = 2;
    out[at] = pick;
  }
  return { cards: out, bad: bad, seed: seed };
}

// ── gate sets for a new compartment ─────────────────────────────
// The way back is mandatory. Everything else is what the record promises
// plus a deterministic extra, so the shape of a compartment is decided by
// the card you chose and not by the dice.
function gatesFor(card, back, seed) {
  const g = [back];
  if (card.down && back !== 'DOWN') g.push('DOWN');
  if (card.up && back !== 'UP') g.push('UP');
  const free = HORIZ.filter(d => d !== back && d !== GATES[back].opp);
  const extra = card.type === 'проход' ? 2 : 1;
  for (let i = 0; i < extra && free.length; i++) {
    const pick = free[(seed + i * 3) % free.length];
    if (g.indexOf(pick) < 0) g.push(pick);
  }
  return g;
}

function roomAt(p) { return S.rooms[p]; }
const cellOf = (x, y, z) => key(x, y, z);

// ── renderer + textures (same language as v1) ───────────────────
const renderer = new THREE.WebGLRenderer({ antialias:false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x08090b);
scene.fog = new THREE.FogExp2(0x08090b, C.fog);

const camera = new THREE.PerspectiveCamera(76, innerWidth/innerHeight, 0.06, 260);
const rig = new THREE.Object3D();
rig.add(camera);
scene.add(rig);

scene.add(new THREE.HemisphereLight(0x6b7480, 0x0a0b0d, 0.55));
const lamp = new THREE.PointLight(0xd9cdb4, 1.9, 16, 2);
rig.add(lamp);

function sizeRT() {
  const cw = renderer.domElement.clientWidth || innerWidth;
  const ch = renderer.domElement.clientHeight || innerHeight;
  const h = C.renderH;
  renderer.setSize(Math.max(2, Math.round(h * cw / ch)), h, false);
  camera.aspect = cw / ch;
  camera.updateProjectionMatrix();
  if (mapCam) { mapCam.aspect = cw / ch; mapCam.updateProjectionMatrix(); }
}

function mkc(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  return 'rgb(' + Math.min(255, ((n>>16)&255)*f|0) + ',' +
         Math.min(255, ((n>>8)&255)*f|0) + ',' + Math.min(255, (n&255)*f|0) + ')';
}
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0;
  let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function texPanel(base, seed, vent) {
  const [c, x] = mkc(32, 32), R = mulberry32(seed);
  x.fillStyle = base; x.fillRect(0, 0, 32, 32);
  for (let i = 0; i < 32; i += 8) { x.fillStyle = shade(base, 0.82); x.fillRect(0, i, 32, 1); }
  for (let i = 0; i < 6; i++) { x.fillStyle = shade(base, 1.16); x.fillRect(0, (R()*32)|0, 32, 1); }
  if (vent) for (let i = 0; i < 5; i++) { x.fillStyle = shade(base, 0.6); x.fillRect(6, 9 + i*3, 20, 1); }
  for (let i = 0; i < 90; i++) { x.fillStyle = shade(base, 0.72 + R()*0.55);
    x.fillRect((R()*32)|0, (R()*32)|0, 1, 1); }
  const t = new THREE.CanvasTexture(c);
  t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestMipmapNearestFilter;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

const TEX = {
  wall:  texPanel('#474741', 11, false),
  floor: texPanel('#3a3a35', 23, false),
  ceil:  texPanel('#2b2b28', 41, true),
  metal: texPanel('#54544e', 59, false),
  seal:  texSeal(),
};

// A gate whose far side is empty is not a doorway, it is a bulkhead: hazard
// stripes and a red seam, so "there is nothing behind this yet" reads as a
// fact about the structure instead of a hole in the renderer.
function texSeal() {
  const [c, x] = mkc(32, 32);
  x.fillStyle = '#1c1e22'; x.fillRect(0, 0, 32, 32);
  x.save(); x.translate(16, 16); x.rotate(-Math.PI/4); x.translate(-24, -24);
  for (let i = 0; i < 48; i += 10) { x.fillStyle = '#2e2a22'; x.fillRect(i, 0, 5, 48); }
  x.restore();
  for (let i = 0; i < 40; i++) { x.fillStyle = 'rgba(0,0,0,' + (0.1 + Math.random()*0.3) + ')';
    x.fillRect((Math.random()*32)|0, (Math.random()*32)|0, 1, 1); }
  const t = new THREE.CanvasTexture(c);
  t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestMipmapNearestFilter;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(3, 3);
  return t;
}

function ps1ify(mat) {
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.uJit = { get value() { return C.jitter; } };
    sh.vertexShader = 'uniform float uJit;\n' + sh.vertexShader.replace(
      '#include <project_vertex>',
      '#include <project_vertex>\n' +
      'if (uJit > 0.5) { vec4 sp = gl_Position; sp.xyz /= sp.w;\n' +
      '  sp.xy = floor(sp.xy * uJit) / uJit; sp.xyz *= sp.w; gl_Position = sp; }');
  };
  mat.needsUpdate = true;
  return mat;
}

const M = {
  floor: ps1ify(new THREE.MeshLambertMaterial({ map: TEX.floor, color: 0xb4b4ac })),
  wall:  ps1ify(new THREE.MeshLambertMaterial({ map: TEX.wall,  color: 0xbcbcb4 })),
  ceil:  ps1ify(new THREE.MeshLambertMaterial({ map: TEX.ceil,  color: 0x8a8a84 })),
  metal: ps1ify(new THREE.MeshLambertMaterial({ map: TEX.metal, color: 0xa6a29a })),
  seal:  ps1ify(new THREE.MeshLambertMaterial({ map: TEX.seal,  color: 0x8e887c })),
  amber: new THREE.MeshBasicMaterial({ color: 0xe8a63c }),
  red:   new THREE.MeshBasicMaterial({ color: 0xc0432c }),
  water: new THREE.MeshLambertMaterial({ color: 0x29394a, transparent: true, opacity: 0.7 }),
  dark:  new THREE.MeshLambertMaterial({ color: 0x101215 }),
};

(function loadStrip() {
  if (!TEXSTRIP || TEXSTRIP.indexOf('data:') !== 0) return;
  const img = new Image();
  img.onload = () => {
    const n = 4, w = Math.floor(img.width / n), h = img.height;
    [['wall', TEX.wall], ['floor', TEX.floor], ['ceil', TEX.ceil], ['metal', TEX.metal]]
      .forEach(([k, t], i) => {
        const [c, x] = mkc(w, h);
        x.drawImage(img, i*w, 0, w, h, 0, 0, w, h);
        t.image = c; t.needsUpdate = true;
      });
  };
  img.src = TEXSTRIP;
})();

// ── geometry helpers ────────────────────────────────────────────
function boxInto(list, w, h, d, x, y, z, uvs) {
  const g = new THREE.BoxGeometry(w, h, d).toNonIndexed();
  if (uvs) { const uv = g.attributes.uv;
    for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i)*uvs[0], uv.getY(i)*uvs[1]); }
  g.translate(x, y, z);
  list.push(g);
}
function mergeGeoms(list) {
  if (!list.length) return null;
  let total = 0;
  for (const g of list) total += g.attributes.position.count;
  const pos = new Float32Array(total*3), nor = new Float32Array(total*3), uv = new Float32Array(total*2);
  let o = 0;
  for (const g of list) {
    pos.set(g.attributes.position.array, o*3);
    nor.set(g.attributes.normal.array, o*3);
    uv.set(g.attributes.uv.array, o*2);
    o += g.attributes.position.count;
    g.dispose();
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  out.setAttribute('normal',   new THREE.BufferAttribute(nor, 3));
  out.setAttribute('uv',       new THREE.BufferAttribute(uv, 2));
  return out;
}

// ── build the world around the player ───────────────────────────
// The current compartment and anything adjacent: you look through an open
// gate and must see the room on the other side, not a black card.
let world = null;

function rebuild() {
  if (world) { scene.remove(world); world.traverse(o => { if (o.geometry) o.geometry.dispose(); }); }
  world = new THREE.Group();
  scene.add(world);

  const F = [], W = [], CL = [], MT = [], AM = [], WA = [];
  const here = S.rooms[S.here];

  // rooms within one step of the current one
  const list = [here];
  for (const d of Object.keys(GATES)) {
    const v = GATES[d].v;
    const n = S.rooms[key(here.x + v[0], here.y + v[1], here.z + v[2])];
    if (n) list.push(n);
  }

  for (const r of list) {
    // Each room builds into its own lists and is moved into place exactly once.
    const lf = [], lw = [], lc = [], lm = [], la = [], lwa = [];
    buildRoom(r, r === here, lf, lw, lc, lm, la, lwa);
    const dx = r.x*C.size, dy = r.y*C.height, dz = r.z*C.size;
    for (const arr of [lf, lw, lc, lm, la, lwa]) {
      for (const g of arr) g.translate(dx, dy, dz);
    }
    for (const g of lf) F.push(g);
    for (const g of lw) W.push(g);
    for (const g of lc) CL.push(g);
    for (const g of lm) MT.push(g);
    for (const g of la) AM.push(g);
    for (const g of lwa) WA.push(g);
  }

  const add = (l, m) => { const g = mergeGeoms(l); if (g) world.add(new THREE.Mesh(g, m)); };
  add(F, M.floor); add(W, M.wall); add(CL, M.ceil);
  add(MT, M.metal); add(AM, M.amber); add(WA, M.water);

  // one failing light per room, amber where the room is powered
  for (const r of list) {
    const l = new THREE.PointLight(r === here ? 0xd6dbe1 : 0xa8aeb6, r === here ? 1.9 : 0.95, 15, 2);
    l.position.set(r.x*C.size, r.y*C.height + C.height - 0.6, r.z*C.size);
    world.add(l);
  }

  // doors are separate objects, not merged: a leaf has to move
  doors = [];
  for (const r of list) for (const d of r.gates) doors.push(mkDoor(r, d));
  for (const r of list) addSigil(r);

  placeCamera();
}

// ── doors ───────────────────────────────────────────────────────
// Two leaves that part into the wall. They are the reason a gate is not a
// black hole: nothing passes until the leaves are out of the way.
let doors = [];

function mkDoor(r, dir) {
  const HS = C.inner/2, GW = C.gateW, GH = C.gateH;
  const ox = r.x*C.size, oy = r.y*C.height, oz = r.z*C.size;
  const half = GW/2, leafW = half - 0.02, th = 0.07;
  const vert = (dir === 'UP' || dir === 'DOWN');

  // is there anything on the far side of this gate?
  const v = GATES[dir].v;
  const beyond = S.rooms[key(r.x + v[0], r.y + v[1], r.z + v[2])];
  const leafMat = beyond ? M.metal : M.seal;
  const seamMat = beyond ? M.amber : M.red;

  const group = new THREE.Group();
  const mk = (w, h, d) => new THREE.Mesh(new THREE.BoxGeometry(w, h, d), leafMat);
  const leaves = [], bases = [];

  for (let i = 0; i < 2; i++) {
    const s = i === 0 ? -1 : 1;
    let m, base;
    if (vert) {
      m = mk(leafW, th, 2.2);
      base = new THREE.Vector3(ox + s*GW/4, oy + (dir === 'UP' ? C.height - 0.06 : 0.06), oz);
    } else if (dir === 'N' || dir === 'S') {
      m = mk(leafW, GH, th);
      base = new THREE.Vector3(ox + s*GW/4,
                               oy + GH/2,
                               oz + (dir === 'N' ? -HS + 0.09 : HS - 0.09));
    } else {
      m = mk(th, GH, leafW);
      base = new THREE.Vector3(ox + (dir === 'E' ? HS - 0.09 : -HS + 0.09),
                               oy + GH/2,
                               oz + s*GW/4);
    }
    m.position.copy(base);
    group.add(m);
    leaves.push(m); bases.push(base.clone());
  }

  // seam where the leaves meet
  const seam = new THREE.Mesh(new THREE.BoxGeometry(0.03, vert ? 0.09 : GH - 0.1, 0.03), seamMat);
  if (vert) { seam.scale.z = 70; seam.position.set(ox, oy + (dir === 'UP' ? C.height - 0.09 : 0.09), oz); }
  else if (dir === 'N' || dir === 'S') seam.position.set(ox, oy + GH/2, oz + (dir === 'N' ? -HS + 0.12 : HS - 0.12));
  else seam.position.set(ox + (dir === 'E' ? HS - 0.12 : -HS + 0.12), oy + GH/2, oz);
  group.add(seam);

  world.add(group);
  return { dir: dir, room: r, leaves: leaves, bases: bases, seam: seam,
           open: 0, want: 0, vert: vert, half: half };
}

function animDoors(dt) {
  for (const d of doors) {
    d.open += (d.want - d.open) * Math.min(1, dt*11);
    const k = d.open;
    for (let i = 0; i < 2; i++) {
      const s = i === 0 ? -1 : 1;
      const m = d.leaves[i], b = d.bases[i];
      const slide = s * k * d.half;
      if (d.vert)        m.position.set(b.x + slide, b.y, b.z);
      else if (d.dir === 'N' || d.dir === 'S') m.position.set(b.x + slide, b.y, b.z);
      else               m.position.set(b.x, b.y, b.z + slide);
    }
    if (d.seam) d.seam.visible = d.open < 0.25;
  }
}

function doorsAt(r, dir) {
  return doors.filter(d => d.room === r && d.dir === dir);
}
function openDoor(r, dir) { for (const d of doorsAt(r, dir)) d.want = 1; }
function shutDoors(r) { for (const d of doors.filter(x => x.room === r)) d.want = 0; }

function buildRoom(r, isHere, F, W, CL, MT, AM, WA) {
  const S0 = C.size, I = C.inner, T = C.wallT, H = C.height;
  const ox = r.x*S0, oy = r.y*C.height, oz = r.z*S0;
  const HS = I/2, GW = C.gateW/2, GH = C.gateH;

  // floor and ceiling, with a hole where a vertical gate is
  const up = r.gates.indexOf('UP') >= 0, dn = r.gates.indexOf('DOWN') >= 0;
  const vw = 2.2/2;
  if (dn) {
    boxInto(F, I, T, HS - vw, 0, -T/2 + 0.0, -(vw + (HS-vw)/2));
    boxInto(F, I, T, HS - vw, 0, -T/2 + 0.0,  (vw + (HS-vw)/2));
    boxInto(F, HS - vw, T, vw*2, -(vw + (HS-vw)/2), -T/2 + 0.0, 0);
    boxInto(F, HS - vw, T, vw*2,  (vw + (HS-vw)/2), -T/2 + 0.0, 0);
  } else {
    boxInto(F, I + T*2, T, I + T*2, 0, -T/2, 0);
  }
  if (up) {
    boxInto(CL, I, T, HS - vw, 0, H + T/2, -(vw + (HS-vw)/2));
    boxInto(CL, I, T, HS - vw, 0, H + T/2,  (vw + (HS-vw)/2));
    boxInto(CL, HS - vw, T, vw*2, -(vw + (HS-vw)/2), H + T/2, 0);
    boxInto(CL, HS - vw, T, vw*2,  (vw + (HS-vw)/2), H + T/2, 0);
  } else {
    boxInto(CL, I + T*2, T, I + T*2, 0, H + T/2, 0);
  }

  // walls: a gate is a hole, so the wall is three pieces
  const sides = [
    ['N', -0.0, -HS - T/2, 'x'],
    ['S',  0.0,  HS + T/2, 'x'],
    ['E',  HS + T/2, 0.0, 'z'],
    ['W', -HS - T/2, 0.0, 'z'],
  ];
  for (const [name, px, pz, axis] of sides) {
    const has = r.gates.indexOf(name) >= 0;
    if (!has) {
      if (axis === 'x') boxInto(W, I + T*2, H, T, 0, H/2, pz);
      else              boxInto(W, T, H, I + T*2, px, H/2, 0);
      continue;
    }
    const seg = (HS - GW) + T;
    if (axis === 'x') {
      boxInto(W, seg, H, T, -(GW + seg/2), H/2, pz);
      boxInto(W, seg, H, T,  (GW + seg/2), H/2, pz);
      boxInto(W, GW*2, H - GH, T, 0, GH + (H-GH)/2, pz);
    } else {
      boxInto(W, T, H, seg, px, H/2, -(GW + seg/2));
      boxInto(W, T, H, seg, px, H/2,  (GW + seg/2));
      boxInto(W, T, H - GH, GW*2, px, GH + (H-GH)/2, 0);
    }
    // the lock frame: two posts and a lintel, amber on the sill
    const fw = 0.14;
    if (axis === 'x') {
      boxInto(MT, fw, GH, fw, -GW, GH/2, pz);
      boxInto(MT, fw, GH, fw,  GW, GH/2, pz);
      boxInto(MT, GW*2 + fw, fw, fw, 0, GH, pz);
      boxInto(AM, GW*2, 0.05, 0.06, 0, GH - 0.06, pz);
    } else {
      boxInto(MT, fw, GH, fw, px, GH/2, -GW);
      boxInto(MT, fw, GH, fw, px, GH/2,  GW);
      boxInto(MT, fw, fw, GW*2 + fw, px, GH, 0);
      // a hairline of amber on the jamb, not a slab across the opening
      boxInto(AM, 0.05, GH - 0.1, 0.05, px, GH/2, -GW + fw);
    }
  }

  // ── dressing ──────────────────────────────────────────────────
  // Furniture keeps out of two places: the corridor in front of a gate, and
  // the middle of the room, which is where you arrive and where you turn.
  // A crate in a doorway reads as a bug, not as a room.
  const keep = [];
  const GAP = 1.75, DEEP = 2.5;
  if (r.gates.indexOf('N') >= 0) keep.push({ x0:-GAP, x1:GAP, z0:-HS, z1:-HS+DEEP });
  if (r.gates.indexOf('S') >= 0) keep.push({ x0:-GAP, x1:GAP, z0:HS-DEEP, z1:HS });
  if (r.gates.indexOf('W') >= 0) keep.push({ x0:-HS, x1:-HS+DEEP, z0:-GAP, z1:GAP });
  if (r.gates.indexOf('E') >= 0) keep.push({ x0:HS-DEEP, x1:HS, z0:-GAP, z1:GAP });
  keep.push({ x0:-1.9, x1:1.9, z0:-1.9, z1:1.9 });

  const fits = (x, z, w, d) => {
    const a = { x0:x - w/2, x1:x + w/2, z0:z - d/2, z1:z + d/2 };
    for (const k of keep) {
      if (a.x1 > k.x0 && a.x0 < k.x1 && a.z1 > k.z0 && a.z0 < k.z1) return false;
    }
    return true;
  };
  const take = (x, z, w, d) => {
    keep.push({ x0:x - w/2 - 0.2, x1:x + w/2 + 0.2, z0:z - d/2 - 0.2, z1:z + d/2 + 0.2 });
  };
  // a wall without a gate, for the things that must stand against something
  const freeWall = () => {
    for (const d of ['S','W','N','E']) if (r.gates.indexOf(d) < 0) return d;
    return null;
  };
  const wallSpot = (w, d) => {
    const f = freeWall();
    if (f === 'S') return { x:0, z:HS - d/2 - 0.25, ry:0 };
    if (f === 'N') return { x:0, z:-HS + d/2 + 0.25, ry:0 };
    if (f === 'W') return { x:-HS + d/2 + 0.25, z:0, ry:0 };
    if (f === 'E') return { x:HS - d/2 - 0.25, z:0, ry:0 };
    return { x:-(HS - 1.3), z:-(HS - 1.3), ry:0 };      // every wall gated
  };

  const t = r.card;
  if (t.type === 'хаб') {
    // the regulator's compartment: a plate on the floor, a console, warm light
    boxInto(MT, 2.8, 0.06, 2.8, 0, 0.04, 0);
    boxInto(AM, 2.4, 0.02, 0.06, 0, 0.08, -1.35);
    boxInto(AM, 2.4, 0.02, 0.06, 0, 0.08,  1.35);
    const cw = 1.7, cd = 0.85, sp = wallSpot(cw, cd);
    boxInto(MT, cw, 1.15, cd, sp.x, 0.60, sp.z);
    boxInto(AM, cw - 0.4, 0.03, 0.05, sp.x, 1.18, sp.z + (sp.z > 0 ? -cd/2 : cd/2));
    take(sp.x, sp.z, cw, cd);
  } else if (t.type === 'вода') {
    boxInto(WA, I - 0.3, 0.04, I - 0.3, 0, 0.06, 0);
    boxInto(MT, 0.3, H, 0.3, -HS + 0.55, H/2, -HS + 0.55);
    boxInto(MT, 0.3, H, 0.3,  HS - 0.55, H/2,  HS - 0.55);
  } else if (t.type === 'питание') {
    const cw = 1.2, cd = 1.2, sp = wallSpot(cw, cd);
    boxInto(MT, cw, 1.0, cd, sp.x, 0.5, sp.z);
    boxInto(AM, 0.12, H*0.6, 0.12, sp.x, H*0.42, sp.z);
    take(sp.x, sp.z, cw, cd);
  } else if (t.type === 'опора') {
    for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
      boxInto(MT, 0.55, H, 0.55, sx*(HS - 0.6), H/2, sz*(HS - 0.6));
    }
    const cw = 1.1, cd = 0.55, sp = wallSpot(cw, cd);
    boxInto(MT, cw, 1.5, cd, sp.x, 0.75, sp.z);
    boxInto(AM, cw - 0.32, 0.04, 0.05, sp.x, 1.06, sp.z + (sp.z > 0 ? -cd/2 : cd/2));
    r.cabLocal = { x: sp.x, z: sp.z };
    take(sp.x, sp.z, cw, cd);
  } else {
    // проход: a rail along the ceiling and a lamp in the middle
    boxInto(MT, 0.2, 0.2, I - 1.4, 0, H - 0.45, 0);
    boxInto(AM, 0.9, 0.04, 0.9, 0, H - 0.2, 0);
  }

  // debris wherever something died — the skirmish leaves a mark on the room
  if (r.fight) {
    const R = mulberry32(r.x*31 + r.y*17 + r.z*7 + 5);
    let n = 0;
    for (let i = 0; i < 40 && n < 7; i++) {
      const w = 0.4 + R()*0.7, d = 0.4 + R()*0.7;
      const x = (R()-0.5)*(I - 2.0), z = (R()-0.5)*(I - 2.0);
      const h = 0.25 + R()*0.6;
      if (!fits(x, z, w, d)) continue;
      boxInto(MT, w, h, d, x, 0.11 + h/2, z);
      take(x, z, w, d);
      n++;
    }
  }
  // the sealed cabinet stands in support compartments
  // a cabinet is not standard furniture: roughly one support compartment in
  // three carries one, decided by the cell itself so it can be learned
  const cabHash = (((r.x*3 + r.y*5 + r.z*7) % 3) + 3) % 3;
  if (t.type === 'опора' && cabHash === 0 && r.cabLocal === undefined) {
    const cw = 1.1, cd = 0.55, sp = wallSpot(cw, cd);
    boxInto(MT, cw, 1.5, cd, sp.x, 0.75, sp.z);
    boxInto(AM, cw - 0.32, 0.04, 0.05, sp.x, 1.06, sp.z + (sp.z > 0 ? -cd/2 : cd/2));
    r.cabLocal = { x: sp.x, z: sp.z };
    take(sp.x, sp.z, cw, cd);
  }

  // flooded from above: water that ran down the column is visible on the floor
  if (r.flood) boxInto(WA, I - 0.45, 0.04, I - 0.45, 0, 0.085, 0);

  // the vertical shafts get a collar so the hole reads as engineering
  if (dn) {
    const e = vw + 0.12;
    boxInto(MT, e*2, 0.22, 0.12, 0, -0.1, -e);
    boxInto(MT, e*2, 0.22, 0.12, 0, -0.1,  e);
    boxInto(MT, 0.12, 0.22, e*2, -e, -0.1, 0);
    boxInto(MT, 0.12, 0.22, e*2,  e, -0.1, 0);
  }
  if (up) {
    const e = vw + 0.12;
    boxInto(MT, e*2, 0.22, 0.12, 0, H + 0.1, -e);
    boxInto(MT, e*2, 0.22, 0.12, 0, H + 0.1,  e);
    boxInto(MT, 0.12, 0.22, e*2, -e, H + 0.1, 0);
    boxInto(MT, 0.12, 0.22, e*2,  e, H + 0.1, 0);
  }

  // nothing to do here: the caller moves this room's geometry into place.
  // It used to translate the shared lists, which moved every room built
  // before it — the reason floors went missing after a few gates.
}

// ── camera / movement ───────────────────────────────────────────
function placeCamera() {
  const r = S.rooms[S.here];
  rig.position.set(r.x*C.size + S.pos.x, r.y*C.height + C.eye, r.z*C.size + S.pos.z);
  rig.rotation.y = S.yaw;
  camera.rotation.x = S.pitch;
}

const keys = {};
function tickMove(dt) {
  // walking never depends on the mouse being captured: if the capture fails
  // the player still moves, and looking falls back to drag
  if (S.draft || S.over || S.cross) return;
  let fw = 0, sd = 0;
  if (keys['KeyW']) fw += 1;
  if (keys['KeyS']) fw -= 1;
  if (keys['KeyD']) sd += 1;
  if (keys['KeyA']) sd -= 1;
  if (!fw && !sd) return;
  const len = Math.hypot(fw, sd) || 1;
  const sp = C.speed * dt;
  const s = Math.sin(S.yaw), c = Math.cos(S.yaw);
  S.pos.x += (-s * fw / len + c * sd / len) * sp;
  S.pos.z += (-c * fw / len - s * sd / len) * sp;
  const lim = C.inner/2 - 0.42;
  S.pos.x = Math.max(-lim, Math.min(lim, S.pos.x));
  S.pos.z = Math.max(-lim, Math.min(lim, S.pos.z));
  placeCamera();
}

// ── gates ───────────────────────────────────────────────────────
function gateNear() {
  const r = S.rooms[S.here];
  const HS = C.inner/2;
  let best = null;
  for (const d of r.gates) {
    const G = GATES[d];
    let gx = 0, gy = 0, gz = 0;
    if (d === 'N') gz = -HS; else if (d === 'S') gz = HS;
    else if (d === 'E') gx = HS; else if (d === 'W') gx = -HS;
    const dist = Math.hypot(S.pos.x - gx, S.pos.z - gz);
    // vertical gates are entered by standing under/over the collar
    const v = d === 'UP' || d === 'DOWN';
    const near = v ? dist < 1.5 : dist < C.reach;
    if (!near) continue;
    // and you must be looking at it
    const fx = -Math.sin(S.yaw), fz = -Math.cos(S.yaw);
    const dot = (G.v[0]*fx + G.v[2]*fz);
    const facing = v ? true : dot > 0.35;
    if (!facing) continue;
    if (!best || dist < best.dist) best = { dir: d, dist: dist, vertical: v };
  }
  return best;
}

function promptFor(gate) {
  if (!gate) return null;
  const r = S.rooms[S.here];
  const v = GATES[gate.dir].v;
  const n = S.rooms[key(r.x + v[0], r.y + v[1], r.z + v[2])];
  const name = GATES[gate.dir].name;
  if ((gate.dir === 'UP' || gate.dir === 'DOWN') && !hasGrapple()) {
    return { text: 'E · ' + name + ' · нужен трос', mode: 'locked' };
  }
  if (r.sealed && r.sealed[gate.dir]) {
    return { text: 'E · ' + name + ' · запечатано сверкой', mode: 'sealed' };
  }
  const verb = gate.dir === 'DOWN' ? 'спуститься'
             : gate.dir === 'UP'   ? 'подняться' : 'пройти';
  const verb2 = gate.dir === 'DOWN' ? 'пробить шахту'
              : gate.dir === 'UP'   ? 'пробить люк' : 'открыть шлюз';
  return n ? { text: 'E · ' + name + ' · ' + verb, mode: 'enter' }
           : { text: 'E · ' + name + ' · ' + verb2, mode: 'draft' };
}

// ── the column above you ────────────────────────────────────────
// Water runs down, power runs down, support holds what is above. What stands
// over a cell is the state that cell is drafted from — the one input of the
// deal you can plan.
function columnState(x, y, z) {
  const s = { water:0, power:0, support:0, rooms:0 };
  for (let k = 1; k <= 4; k++) {
    const r = S.rooms[key(x, y + k, z)];
    if (!r) continue;
    s.rooms++;
    if (r.card.type === 'вода') s.water++;
    if (r.card.type === 'опора') s.support++;
    if (r.card.type === 'питание') s.power += (r.card.pit === '+' ? -1 : 1);
  }
  return s;
}
// ── draft ───────────────────────────────────────────────────────
function openDraft(dir) {
  const r = S.rooms[S.here];
  const v = GATES[dir].v;
  const cell = { x: r.x + v[0], y: r.y + v[1], z: r.z + v[2] };
  const col = columnState(cell.x, cell.y, cell.z);
  const d = deal(-r.y, cell, S.came, col.water, col.power, col.support, Math.min(3, S.placed));
  S.draft = { dir: dir, cards: d.cards, sel: -1, bad: d.bad };
  paintDraft();
  document.getElementById('prompt').classList.remove('on');
  document.getElementById('lock').classList.add('off');
  document.getElementById('sheet').classList.add('on');
  document.getElementById('lock').classList.add('off');
  sizeRT();
  hud();
}

function paintDraft() {
  const d = S.draft;
  document.getElementById('draftWhere').textContent = GATES[d.dir].name;
  document.getElementById('draftNote').innerHTML = d.bad
    ? 'заглушён, за ним пусто · <em>сектор в плохом состоянии: одна запись нечитаема</em>'
    : 'заглушён, за ним пусто · три записи реестра: поля читаются, личность — нет';
  const box = document.getElementById('cards');
  box.innerHTML = d.cards.map((c, i) => {
    const blind = !!c.blind;
    const known = !!KNOWN[c.id] && !blind;
    const art = ROOMART[c.type];
    return '<div class="card' + (blind ? ' blind' : '') + (d.sel === i ? ' sel' : '') + '" data-i="' + i + '">' +
      (art
        ? '<div class="art" style="background-image:url(' + art + ')"></div>'
        : '<div class="art"><span>' + (TYPE_GLYPH[c.type] || '·') + '</span></div>') +
      '<div class="k">' + c.id + ' · ' + c.type + '</div>' +
      '<div class="n">' + (known ? c.eff : '· · · · ·') + '</div>' +
      '<div class="f">⌀ <b>' + c.size + '</b> м · пит <b>' + c.pit + '</b>' +
      (c.down ? '<br><b>шахта вниз</b>' : '') + (c.up ? '<br><b>люк вверх</b>' : '') + '</div>' +
      '<div class="p">' + c.ticks + ' т</div>' +
      '</div>';
  }).join('');
  Array.prototype.forEach.call(box.querySelectorAll('.card'), el => {
    el.onclick = () => { S.draft.sel = +el.dataset.i; paintDraft(); };
  });
  document.getElementById('place').disabled = d.sel < 0;
}

function closeDraft() {
  S.draft = null;
  document.getElementById('sheet').classList.remove('on');
  if (!S.over && !locked) document.getElementById('lock').classList.remove('off');
  sizeRT();
  hud();
}

function placeChosen() {
  const d = S.draft;
  if (!d || d.sel < 0) return;
  const card = d.cards[d.sel];
  KNOWN[card.id] = true;
  const here = S.rooms[S.here];
  const v = GATES[d.dir].v;
  const nx = here.x + v[0], ny = here.y + v[1], nz = here.z + v[2];
  const seed = (nx*13 + ny*7 + nz*17 + card.ticks) & 0xffff;
  const room = {
    card: card, x: nx, y: ny, z: nz,
    gates: gatesFor(card, GATES[d.dir].opp, seed),
    seen: true,
  };
  const col2 = columnState(nx, ny, nz);
  room.flood = col2.water >= 2;
  room.fight = fightAt(room);
  S.rooms[key(nx, ny, nz)] = room;
  S.placed++;
  closeDraft();
  transition(d.dir);
}

// ── moving through a gate ───────────────────────────────────────
function transition(dir) {
  const here = S.rooms[S.here];
  const oldHere = here;
  const G = GATES[dir];
  const v = G.v;
  const nk = key(here.x + v[0], here.y + v[1], here.z + v[2]);
  const n = S.rooms[nk];
  if (!n) return;

  openDoor(here, dir);
  const fromPos = rig.position.clone();
  const fromYaw = S.yaw, fromPitch = S.pitch;

  // step out of the new compartment's opposite gate, facing inwards
  const back = GATES[G.opp];
  const HS = C.inner/2 - 0.95;
  const vertical = v[1] !== 0;
  S.here = nk;
  S.pos.x = back.v[0] * HS;
  S.pos.z = back.v[2] * HS;          // both zero for a shaft: you land under it
  if (!vertical) S.yaw = Math.atan2(v[0], v[2]) - Math.PI;
  S.pitch = 0;
  S.came = n.card;

  // The wall you came through must be a door on this side too. It is not
  // always: a compartment can be entered through a gate that was added on the
  // far side, and then you arrive facing into a room whose wall behind you is
  // solid — you turn around and there is nothing to go back through. Opening
  // the reciprocal gate fixes both the view and the dead end.
  const backDir = G.opp;
  if (n.gates.indexOf(backDir) < 0) n.gates.push(backDir);

  // remember which gates have actually been walked
  S.passed = S.passed || {};
  S.passed[key(here.x, here.y, here.z) + '|' + dir] = true;
  S.passed[nk + '|' + backDir] = true;

  S.ticks += n.card.ticks;          // the turn is the gate-to-gate crossing

  // a skirmish resolves the moment you are inside: no second screen, no
  // turn order. The room decides whether it happens, so it can be learned.
  let fightNote = '';
  if (n.fight && !n.fought) {
    n.fought = true;
    const cost = 2 + (n.card.size >= 11 ? 2 : 0);
    const loot = 1 + (n.card.type === 'опора' ? 1 : 0);
    S.ticks += cost; S.mat += loot;
    fightNote = ' · стычка +' + cost + ' такта, материал +' + loot;
  }
  rebuild();

  // the leaf you just passed through must stay open while the camera crosses
  for (const d of doorsAt(oldHere, dir)) { d.want = 1; d.open = 1; }
  for (const d of doorsAt(n, back))      { d.want = 1; d.open = 0.55; }

  S.cross = {
    t0: performance.now(), dur: vertical ? 900 : 760,
    from: fromPos,
    to: new THREE.Vector3(n.x*C.size + S.pos.x, n.y*C.height + C.eye, n.z*C.size + S.pos.z),
    fromYaw: fromYaw, toYaw: S.yaw, fromPitch: fromPitch,
    // a shaft is climbed on its axis: get over the hole, then drop or rise
    vert: vertical,
    axis: vertical ? { x:n.x*C.size, z:n.z*C.size } : null,
  };

  if (fightNote) callout('ВХОД В ОТСЕК' + fightNote);
  if (S.ticks >= nextSync()) sync();
  hud();
}

function nextSync() { return (Math.floor(S.ticks / C.syncEvery) + 1) * C.syncEvery; }

function sync() {
  // The audit is an event, not a counter reset. It takes a drafting option
  // away: one gate in the compartment you are standing in gets capped, so the
  // structure you were about to extend is closed to you. It never takes the
  // last one — that would be a coin toss, and this world has no coin.
  const r = S.rooms[S.here];
  S.syncs = (S.syncs || 0) + 1;

  const empty = r.gates.filter(d => {
    const v = GATES[d].v;
    return !S.rooms[key(r.x + v[0], r.y + v[1], r.z + v[2])]
        && !(r.sealed && r.sealed[d]);
  });
  let capped = null;
  if (empty.length > 1) {
    capped = empty[0];
    r.sealed = r.sealed || {};
    r.sealed[capped] = true;
  }

  // water standing above you makes the audit worse: the compartment floods
  const col = columnState(r.x, r.y, r.z);
  let floodNote = false;
  if (col.water >= 1 && !r.flood) { r.flood = true; floodNote = true; }

  rebuild();
  flashSync();
  const msg = capped
    ? 'СВЕРКА · шлюз ' + GATES[capped].name + ' запечатан' + (floodNote ? ' · отсек затоплен' : '')
    : (floodNote ? 'СВЕРКА · отсек затоплен' : 'СВЕРКА · правки откатаны');
  callout(msg);

  const usable = r.gates.filter(d => {
    const v = GATES[d].v;
    return S.rooms[key(r.x + v[0], r.y + v[1], r.z + v[2])]
        || !(r.sealed && r.sealed[d]);
  });
  if (!usable.length) { finish('тупик', 'сверка запечатала последний шлюз.'); return; }
  hud();
}

// a line of text that means something happened, gone in a couple of seconds
let calloutT = 0;
function callout(text) {
  const el = document.getElementById('event');
  el.textContent = text;
  el.classList.add('on');
  calloutT = performance.now() + 2600;
}

function flashSync() {
  const hz = document.getElementById('hazard');
  hz.classList.add('on');
  setTimeout(() => hz.classList.toggle('on', (nextSync() - S.ticks) <= 5), 900);
}

// ── hud ─────────────────────────────────────────────────────────
function hud() {
  const r = S.rooms[S.here];
  const m = document.getElementById('mode');
  m.textContent = S.over ? 'end' : (S.draft ? 'draft' : 'descend');
  m.className = S.draft ? 'amber' : '';

  document.getElementById('s-tick').textContent = S.ticks;
  const nx = nextSync();
  document.getElementById('s-sync').textContent = Math.max(0, nx - S.ticks);
  document.getElementById('s-rooms').textContent = Object.keys(S.rooms).length;
  document.getElementById('s-syncbox').className =
    'stat' + ((nx - S.ticks) <= 5 ? ' warn' : ((nx - S.ticks) <= 10 ? ' hot' : ''));
  document.getElementById('hazard').className = (nx - S.ticks) <= 5 ? 'on' : '';

  const col = columnState(r.x, r.y, r.z);
  // the room's own sigil sits in the readout, so the language of marks is
  // learned just by walking: this is what a sigil is, and here is mine
  document.getElementById('crumbs').innerHTML =
    ARCH[S.team[S.arch]].name + (hasGrapple() ? ' · трос' : '') + ' · мат ' + (S.mat||0) +
    ' · отсек ' + (r.card.id) + ' · ярус ' + (r.y >= 0 ? '+' + r.y : r.y) +
    ' · шлюзов ' + r.gates.length +
    ' · над тобой вода ' + col.water + ' пит ' + col.power + ' опора ' + col.support +
    ' · клеймо <img src="' + SIGURL[sigilOf(r)] +
    '" width="14" height="14" style="vertical-align:-3px;opacity:.9">';

  if (!S.draft) {
    const g = gateNear();
    const p = promptFor(g);
    const el = document.getElementById('prompt');
    const cross = document.getElementById('cross');
    if (p) {
      el.innerHTML = '<b>' + p.text.slice(0,1) + '</b>' + p.text.slice(3);
      el.classList.add('on');
      cross.classList.add('hot');
    } else if (nearCabinet()) {
      el.innerHTML = '<b>E</b> · опечатанный шкаф';
      el.classList.add('on');
      cross.classList.add('hot');
    } else {
      el.classList.remove('on');
      cross.classList.remove('hot');
    }
  }
}

function bump() {}
function finish(title, text) {
  S.over = true;
  document.getElementById('endtitle').textContent = title;
  document.getElementById('endtext').textContent =
    text + ' тактов: ' + S.ticks + ' · отсеков: ' + Object.keys(S.rooms).length +
    ' · глубина: ' + S.rooms[S.here].y;
  document.getElementById('end').classList.add('on');
  if (document.pointerLockElement) document.exitPointerLock();
}

// ── the map: the structure itself, turned in the hand ───────────
// A section drawing was never going to carry a clue you have to find. The
// structure is three-dimensional, so the map is too: drag to turn it, wheel
// to pull back. Each compartment shows its sigil on the face you can see,
// which is how you read a code off a column you have already climbed.
let mapScene = null, mapCam = null, mapOpen = false;
let mapYaw = 0.85, mapPitch = 0.52, mapDist = 52;

const MAP_COL = {
  'вода':   0x2b3d4d,
  'питание':0x4a3a1c,
  'опора':  0x3c3f45,
  'проход': 0x34383d,
  'хаб':    0x5b4a22,
};

function mapCenter() {
  let x0=9e9, x1=-9e9, y0=9e9, y1=-9e9, z0=9e9, z1=-9e9;
  for (const k in S.rooms) {
    const r = S.rooms[k];
    x0=Math.min(x0,r.x); x1=Math.max(x1,r.x);
    y0=Math.min(y0,r.y); y1=Math.max(y1,r.y);
    z0=Math.min(z0,r.z); z1=Math.max(z1,r.z);
  }
  if (x0 > x1) return new THREE.Vector3(0,0,0);
  return new THREE.Vector3((x0+x1)/2*C.size, (y0+y1)/2*C.height + C.height/2, (z0+z1)/2*C.size);
}

function buildMap() {
  if (mapScene) {
    mapScene.traverse(o => { if (o.geometry) o.geometry.dispose(); });
    mapScene = null;
  }
  mapScene = new THREE.Scene();
  mapScene.background = new THREE.Color(0x060708);
  mapScene.add(new THREE.AmbientLight(0xffffff, 0.42));
  const d = new THREE.DirectionalLight(0xffffff, 0.72);
  d.position.set(1, 2.2, 1.4);
  mapScene.add(d);

  mapBlocks = [];
  const S0 = C.size, H = C.height;
  const geo = new THREE.BoxGeometry(S0*0.9, H*0.82, S0*0.9);
  const edgeGeo = new THREE.EdgesGeometry(geo);

  for (const k in S.rooms) {
    const r = S.rooms[k];
    const col = MAP_COL[r.card.type] !== undefined ? MAP_COL[r.card.type] : 0x2a2d32;
    const m = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ color: col }));
    m.userData.room = r;
    m.position.set(r.x*S0, r.y*H + H/2, r.z*S0);
    mapScene.add(m);
    mapBlocks.push(m);

    const edges = new THREE.LineSegments(edgeGeo, new THREE.LineBasicMaterial({
      color: k === S.here ? 0xe8a63c : 0x1a1d21 }));
    edges.position.copy(m.position);
    edges.scale.set(k === S.here ? 1.03 : 1, k === S.here ? 1.06 : 1, k === S.here ? 1.03 : 1);
    mapScene.add(edges);

    // the sigil sits on the roof of the block: seen from above, the
    // arrangement of marks is what you read, the way a plan is read
    const sg = new THREE.Mesh(new THREE.PlaneGeometry(S0*0.6, S0*0.6),
      new THREE.MeshBasicMaterial({ map: SIGTEX[sigilOf(r)], transparent: true, opacity: 0.95 }));
    sg.rotation.x = -Math.PI/2;
    sg.position.set(r.x*S0, r.y*H + H/2 + H*0.42, r.z*S0);
    mapScene.add(sg);

    // every gate this compartment has, marked on the face it sits in:
    // green if you have walked through it, red if you have not
    for (const d of r.gates) {
      const walked = S.passed && S.passed[k + '|' + d];
      const mk = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 1.5),
        new THREE.MeshBasicMaterial({ color: walked ? 0x63c47a : 0xc2402c,
          transparent: true, opacity: 0.9, side: THREE.DoubleSide }));
      const off = S0 * 0.47;
      if (d === 'N') { mk.position.set(r.x*S0, r.y*H + H/2, r.z*S0 - off); }
      if (d === 'S') { mk.position.set(r.x*S0, r.y*H + H/2, r.z*S0 + off); }
      if (d === 'W') { mk.position.set(r.x*S0 - off, r.y*H + H/2, r.z*S0); mk.rotation.y = Math.PI/2; }
      if (d === 'E') { mk.position.set(r.x*S0 + off, r.y*H + H/2, r.z*S0); mk.rotation.y = -Math.PI/2; }
      if (d === 'UP')   { mk.position.set(r.x*S0, r.y*H + H*0.93, r.z*S0); mk.rotation.x = -Math.PI/2; }
      if (d === 'DOWN') { mk.position.set(r.x*S0, r.y*H + H*0.07, r.z*S0); mk.rotation.x = Math.PI/2; }
      mapScene.add(mk);
    }

    // where you are, as a pin
    if (k === S.here) {
      const pin = new THREE.Mesh(new THREE.SphereGeometry(0.5, 8, 6),
        new THREE.MeshBasicMaterial({ color: 0xffd479 }));
      pin.position.set(r.x*S0 + S.pos.x, r.y*H + C.eye, r.z*S0 + S.pos.z);
      mapScene.add(pin);
    }
  }

  const g = new THREE.GridHelper(160, 20, 0x1b2026, 0x101316);
  g.position.y = -0.01;
  mapScene.add(g);

  if (!mapCam) mapCam = new THREE.PerspectiveCamera(46, innerWidth/innerHeight, 0.5, 600);
  mapCam.aspect = innerWidth / innerHeight;
  mapCam.updateProjectionMatrix();
  updateMapCam();
}

function updateMapCam() {
  if (!mapCam) return;
  const t = mapCenter();
  const cp = Math.cos(mapPitch), sp = Math.sin(mapPitch);
  mapCam.position.set(
    t.x + Math.sin(mapYaw) * cp * mapDist,
    t.y + sp * mapDist,
    t.z + Math.cos(mapYaw) * cp * mapDist);
  mapCam.lookAt(t);
}

function openMap() {
  if (document.pointerLockElement) document.exitPointerLock();
  buildMap();
  mapOpen = true;
  document.getElementById('cut').classList.add('on');
  document.getElementById('prompt').classList.remove('on');
  mapSel = null; mapHover = null; mapHighlight(null); mapInfo(null);
}
function closeMap() {
  mapOpen = false;
  document.getElementById('cut').classList.remove('on');
}

function mapSide() {
  const r = S.rooms[S.here];
  const col = columnState(r.x, r.y, r.z);
  document.getElementById('cutside').innerHTML =
    '<h3>структура</h3>' +
    '<div class="row"><span>отсеков</span><b>' + Object.keys(S.rooms).length + '</b></div>' +
    '<div class="row"><span>ты в</span><b>' + r.card.id + '</b></div>' +
    '<div class="row"><span>ярус</span><b>' + (r.y >= 0 ? '+' + r.y : r.y) + '</b></div>' +
    '<div class="row"><span>архетип</span><b>' + ARCH[S.team[S.arch]].name + '</b></div>' +
    '<div class="row"><span>над тобой</span><b>вода ' + col.water + ' · пит ' + col.power + ' · опора ' + col.support + '</b></div>' +
    '<p class="maphint">тяни мышью — повернуть<br>колесо — приблизить<br>m — закрыть</p>' +
    '<p class="maphint dim">клейма на крышах отсеков</p>';
}
// ── sigils, and a cabinet that wants three of them ──────────────
// The code is never written down: it is the three sigils of the compartments
// stacked directly above this one. You find it by climbing and looking.
// Clue colour. Amber is structure and red is you, so a clue needs a third hue
// of its own — cold cyan, the colour of a registry annotation, never of a wall.
const SIG_COL = '#7fd4e8';
const SIGTEX = [];
function sigilCanvas(i) {
  const [c, x] = mkc(64, 64);
  x.strokeStyle = SIG_COL; x.lineWidth = 3; x.lineCap = 'square';
  x.shadowColor = SIG_COL; x.shadowBlur = 7;
  const C0 = 32;
  if (i === 0) { x.beginPath(); x.arc(C0, C0, 16, 0, 6.2832); x.stroke();
                 x.beginPath(); x.moveTo(C0, 8); x.lineTo(C0, 56); x.stroke(); }
  if (i === 1) { x.beginPath(); x.moveTo(C0, 10); x.lineTo(52, 50); x.lineTo(12, 50); x.closePath(); x.stroke();
                 x.beginPath(); x.arc(C0, 38, 3, 0, 6.2832); x.stroke(); }
  if (i === 2) { x.beginPath(); x.moveTo(14, 18); x.lineTo(50, 46); x.stroke();
                 x.beginPath(); x.moveTo(50, 18); x.lineTo(14, 46); x.stroke();
                 x.beginPath(); x.arc(C0, C0, 20, 0, 6.2832); x.stroke(); }
  if (i === 3) { for (let k = 0; k < 3; k++) { const y = 16 + k * 14;
                   x.beginPath(); x.moveTo(14, y); x.lineTo(C0, y + 8); x.lineTo(50, y); x.stroke(); } }
  if (i === 4) { x.beginPath(); x.rect(12, 12, 40, 40); x.stroke();
                 x.beginPath(); x.moveTo(12, 52); x.lineTo(52, 12); x.stroke(); }
  if (i === 5) { x.beginPath(); x.moveTo(18, 48); x.lineTo(18, 26); x.lineTo(40, 26);
                 x.lineTo(40, 40); x.lineTo(28, 40); x.stroke(); }
  const tt = new THREE.CanvasTexture(c);
  tt.magFilter = THREE.NearestFilter; tt.minFilter = THREE.NearestFilter;
  return tt;
}
for (let i = 0; i < 6; i++) SIGTEX.push(sigilCanvas(i));
const SIGURL = SIGTEX.map(t => t.image.toDataURL());

function sigilOf(r) { return ((r.x * 7 + r.y * 13 + r.z * 23) % 6 + 6) % 6; }

function addSigil(r) {
  const HS = C.inner/2;
  const free = ['S','W','N','E'].filter(d => r.gates.indexOf(d) < 0);
  const d = free.length ? free[free.length - 1] : null;
  if (!d) return;
  const plate = new THREE.Mesh(new THREE.PlaneGeometry(1.35, 1.35),
    new THREE.MeshBasicMaterial({ color: 0x0b0c0e, transparent: true, opacity: 0.85 }));
  const m = new THREE.Mesh(new THREE.PlaneGeometry(1.15, 1.15),
    new THREE.MeshBasicMaterial({ map: SIGTEX[sigilOf(r)], transparent: true }));
  const y = 1.8;
  if (d === 'S') { m.position.set(r.x*C.size, r.y*C.height + y, r.z*C.size + HS - 0.03); m.rotation.y = Math.PI; }
  if (d === 'N') { m.position.set(r.x*C.size, r.y*C.height + y, r.z*C.size - HS + 0.03); }
  if (d === 'W') { m.position.set(r.x*C.size - HS + 0.03, r.y*C.height + y, r.z*C.size); m.rotation.y = Math.PI/2; }
  if (d === 'E') { m.position.set(r.x*C.size + HS - 0.03, r.y*C.height + y, r.z*C.size); m.rotation.y = -Math.PI/2; }
  plate.position.copy(m.position); plate.rotation.copy(m.rotation);
  const off = 0.01;
  if (d === 'S') { plate.position.z -= off; } else if (d === 'N') { plate.position.z += off; }
  else if (d === 'W') { plate.position.x += off; } else { plate.position.x -= off; }
  world.add(plate);
  world.add(m);
}

function codeFor(r) {
  const a = S.rooms[key(r.x, r.y + 1, r.z)];
  const b = S.rooms[key(r.x, r.y + 2, r.z)];
  const c = S.rooms[key(r.x, r.y + 3, r.z)];
  if (!a || !b || !c) return null;
  return [sigilOf(a), sigilOf(b), sigilOf(c)];
}

function nearCabinet() {
  const r = S.rooms[S.here];
  if (!r.cabLocal || r.cabOpen) return null;
  const dx = S.pos.x - r.cabLocal.x, dz = S.pos.z - r.cabLocal.z;
  return Math.hypot(dx, dz) < 2.4 ? r : null;
}

function openCode(r) {
  S.code = { room: r, entered: [] };
  paintCode();
  document.getElementById('code').classList.add('on');
  document.getElementById('prompt').classList.remove('on');
}
function closeCode() {
  S.code = null;
  document.getElementById('code').classList.remove('on');
}
function paintCode() {
  const need = codeFor(S.code.room);
  const slots = [0,1,2].map(i => {
    const v = S.code.entered[i];
    return '<div class="slot">' + (v === undefined ? '' :
      '<img src="' + SIGTEX[v].image.toDataURL() + '">') + '</div>';
  }).join('');
  const pal = SIGTEX.map((t, i) =>
    '<button class="sig" data-i="' + i + '"><img src="' + t.image.toDataURL() + '"></button>').join('');
  document.getElementById('codebody').innerHTML =
    '<div class="slots">' + slots + '</div>' +
    '<div class="pal">' + pal + '</div>' +
    '<div class="hint">код — клейма трёх отсеков, что стоят над этим: сначала ближний, потом выше, потом верхний</div>' +
    (need
      ? '<div class="hint dim">клеймо отсека нарисовано на его стене · и на крыше отсека на карте (M)</div>'
      : '<div class="hint amber">над этим отсеком меньше трёх — кода нет, и шкаф не открыть</div>');
  Array.prototype.forEach.call(document.querySelectorAll('#codebody .sig'), el => {
    el.onclick = () => {
      if (S.code.entered.length >= 3) S.code.entered = [];
      S.code.entered.push(+el.dataset.i);
      paintCode();
      if (S.code.entered.length === 3) setTimeout(tryCode, 220);
    };
  });
}
function tryCode() {
  const r = S.code.room, need = codeFor(r);
  const got = S.code.entered;
  if (need && got.length === 3 && got[0] === need[0] && got[1] === need[1] && got[2] === need[2]) {
    r.cabOpen = true;
    closeCode();
    if (S.team.indexOf('VECTOR') < 0) {
      S.team.push('VECTOR');
      callout('КВАЛИА · АРХЕТИП «ВЕКТОР» · ТРОС И НОВЫЕ ОТСЕКИ');
    } else {
      S.mat = (S.mat || 0) + 3;
      callout('ШКАФ ОТКРЫТ · МАТЕРИАЛ +3');
    }
    hud();
  } else {
    S.code.entered = [];
    paintCode();
    callout('НЕ ПОДХОДИТ');
  }
}
// ── pointing at the map ─────────────────────────────────────────
// A block you can point at is a block you can ask about. Hover marks it and
// fills the panel; a click pins it, so the answer stays while you turn the
// structure to look at something else.
let mapBlocks = [];
const mapRay = new THREE.Raycaster();
const mapPtr = new THREE.Vector2();
let mapHi = null, mapHover = null, mapSel = null, mapDown = null;

function mapPick(clientX, clientY) {
  if (!mapScene || !mapCam || !mapBlocks.length) return null;
  mapPtr.x = (clientX / innerWidth) * 2 - 1;
  mapPtr.y = -(clientY / innerHeight) * 2 + 1;
  mapRay.setFromCamera(mapPtr, mapCam);
  const hits = mapRay.intersectObjects(mapBlocks, false);
  return hits.length ? hits[0].object.userData.room : null;
}

function mapHighlight(r) {
  if (!mapHi) {
    mapHi = new THREE.LineSegments(
      new THREE.EdgesGeometry(new THREE.BoxGeometry(C.size*0.95, C.height*0.87, C.size*0.95)),
      new THREE.LineBasicMaterial({ color: 0x7fd4e8 }));
    mapScene.add(mapHi);
  }
  if (!r) { mapHi.visible = false; return; }
  mapHi.visible = true;
  mapHi.position.set(r.x*C.size, r.y*C.height + C.height/2, r.z*C.size);
}

function gateList(r) {
  const out = [];
  for (const d of r.gates) {
    const v = GATES[d].v;
    const n = S.rooms[key(r.x + v[0], r.y + v[1], r.z + v[2])];
    const sealed = r.sealed && r.sealed[d];
    out.push('<div class="row"><span>' + GATES[d].name + '</span><b>' +
      (sealed ? 'запечатан' : (n ? n.card.id : 'пусто')) + '</b></div>');
  }
  return out.join('');
}

function mapInfo(r) {
  const box = document.getElementById('cutside');
  if (!r) {
    const here = S.rooms[S.here];
    const col = columnState(here.x, here.y, here.z);
    box.innerHTML =
      '<h3>структура</h3>' +
      '<div class="row"><span>отсеков</span><b>' + Object.keys(S.rooms).length + '</b></div>' +
      '<div class="row"><span>архетип</span><b>' + ARCH[S.team[S.arch]].name + '</b></div>' +
      '<div class="row"><span>над тобой</span><b>вода ' + col.water + ' · пит ' + col.power + ' · опора ' + col.support + '</b></div>' +
      '<p class="maphint"><span style="color:#63c47a">■</span> прошёл · <span style="color:#c2402c">■</span> ещё не ходил</p>' +
      '<p class="maphint">наведи на отсек — покажу, что в нём<br>клик — закрепить<br>тяни — повернуть · колесо — масштаб</p>';
    return;
  }
  const col = columnState(r.x, r.y, r.z);
  const isHere = key(r.x, r.y, r.z) === S.here;
  box.innerHTML =
    '<h3>отсек ' + r.card.id + '</h3>' +
    '<div class="row"><span>тип</span><b>' + r.card.type + '</b></div>' +
    '<div class="row"><span>ярус</span><b>' + (r.y >= 0 ? '+' + r.y : r.y) + '</b></div>' +
    '<div class="row"><span>клеймо</span><b><img src="' + SIGURL[sigilOf(r)] + '" width="16" height="16" style="vertical-align:-4px"></b></div>' +
    '<div class="row"><span>стычка</span><b>' + (r.fight ? (r.fought ? 'была' : 'ждёт') : 'тихо') + '</b></div>' +
    (r.cabLocal ? '<div class="row"><span>шкаф</span><b>' + (r.cabOpen ? 'вскрыт' : 'опечатан') + '</b></div>' : '') +
    (isHere ? '<div class="row"><span>ты</span><b>здесь</b></div>' : '') +
    '<h3 style="margin-top:14px">шлюзы</h3>' + gateList(r) +
    '<h3 style="margin-top:14px">над ним</h3>' +
    '<div class="row"><span>вода</span><b>' + col.water + '</b></div>' +
    '<div class="row"><span>питание</span><b>' + col.power + '</b></div>' +
    '<div class="row"><span>опора</span><b>' + col.support + '</b></div>';
}

function mapPoint(clientX, clientY) {
  const r = mapPick(clientX, clientY);
  mapHover = r;
  mapHighlight(r || mapSel);
  mapInfo(r || mapSel);
}
// ── input ───────────────────────────────────────────────────────
let locked = false, dragging = false;
const lockEl = document.getElementById('lock');

function tryLock() {
  if (S.draft) return;
  const p = renderer.domElement.requestPointerLock();
  if (p && p.catch) p.catch(() => {});       // capture is a convenience, not a gate
}
let mapDrag = false;
renderer.domElement.addEventListener('mousedown', (e) => {
  if (e.button !== 0) return;
  if (mapOpen) { mapDrag = true; mapDown = { x: e.clientX, y: e.clientY, moved: false }; return; }
  dragging = true;
  tryLock();
});
addEventListener('wheel', (e) => {
  if (!mapOpen) return;
  e.preventDefault();
  mapDist = Math.max(14, Math.min(190, mapDist * (e.deltaY > 0 ? 1.1 : 0.9)));
  updateMapCam();
}, { passive: false });
addEventListener('mouseup', (e) => {
  dragging = false;
  if (mapDrag && mapDown) {
    const far = Math.hypot(e.clientX - mapDown.x, e.clientY - mapDown.y) > 5;
    if (!far) {
      const r = mapPick(e.clientX, e.clientY);
      mapSel = (r && mapSel === r) ? null : r;
      mapHighlight(r || mapSel);
      mapInfo(r || mapSel);
    }
  }
  mapDrag = false; mapDown = null;
});
renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());

document.addEventListener('pointerlockchange', () => {
  locked = document.pointerLockElement === renderer.domElement;
  lockEl.classList.toggle('off', locked);
});

document.addEventListener('mousemove', (e) => {
  if (mapOpen) {
    if (!mapDrag) { mapPoint(e.clientX, e.clientY); return; }
    mapYaw -= (e.movementX || 0) * 0.006;
    mapPitch = Math.max(-1.35, Math.min(1.35, mapPitch + (e.movementY || 0) * 0.005));
    updateMapCam();
    return;
  }
  if (S.draft || S.cross || S.over) return;
  if (!locked && !dragging) return;          // drag-look when the capture is refused
  S.yaw -= (e.movementX || 0) * 0.0024;
  S.pitch -= (e.movementY || 0) * 0.0024;
  S.pitch = Math.max(-1.15, Math.min(1.15, S.pitch));
  placeCamera();
});

addEventListener('keydown', (ev) => {
  const k = ev.code;
  keys[k] = true;

  // keyboard look, so a lost mouse capture never strands the player
  if (!S.draft && !S.cross && !S.over) {
    const step = 0.05;
    if (k === 'ArrowLeft')  { S.yaw += step; placeCamera(); return; }
    if (k === 'ArrowRight') { S.yaw -= step; placeCamera(); return; }
    if (k === 'ArrowUp')    { S.pitch = Math.min(1.15, S.pitch + step); placeCamera(); return; }
    if (k === 'ArrowDown')  { S.pitch = Math.max(-1.15, S.pitch - step); placeCamera(); return; }
  }

  if (k === 'KeyM') { ev.preventDefault();
    document.getElementById('cut').classList.contains('on') ? closeMap() : openMap(); return; }
  if (k === 'Tab') {
    ev.preventDefault();
    if (S.team.length > 1) {
      S.arch = (S.arch + 1) % S.team.length;
      callout('АРХЕТИП · ' + ARCH[S.team[S.arch]].name + (hasGrapple() ? ' · трос' : ' · без троса'));
      hud();
    }
    return;
  }
  if (k === 'KeyR') { newRun(); document.getElementById('end').classList.remove('on'); return; }
  if (k === 'Escape') { if (S.draft) closeDraft(); else if (S.code) closeCode(); else closeMap(); return; }
  if (S.over) return;
  if (S.draft) {
    if (k === 'Digit1' || k === 'Digit2' || k === 'Digit3') {
      S.draft.sel = +k.slice(5) - 1; paintDraft(); return;
    }
    if (k === 'Enter' || k === 'Space') { ev.preventDefault(); placeChosen(); return; }
    return;
  }
  if (S.code) {
    if (k === 'Escape') { closeCode(); return; }
    if (/^Digit[1-6]$/.test(k)) {
      if (S.code.entered.length >= 3) S.code.entered = [];
      S.code.entered.push(+k.slice(5) - 1);
      paintCode();
      if (S.code.entered.length === 3) setTimeout(tryCode, 220);
    }
    return;
  }
  if (k === 'KeyE' || k === 'Enter') {
    ev.preventDefault();
    if (S.cross) return;
    const cab = nearCabinet();
    if (cab) { openCode(cab); return; }
    const g = gateNear();
    if (!g) { bump(); return; }
    const r = S.rooms[S.here];
    const v = GATES[g.dir].v;
    if ((g.dir === 'UP' || g.dir === 'DOWN') && !hasGrapple()) {
      callout('НУЖЕН ТРОС · ЭТОТ АРХЕТИП ХОДИТ ТОЛЬКО ПО СВОЕМУ ЯРУСУ'); return;
    }
    if (r.sealed && r.sealed[g.dir]) { callout('ШЛЮЗ ' + GATES[g.dir].name.toUpperCase() + ' ЗАПЕЧАТАН СВЕРКОЙ'); return; }
    const n = S.rooms[key(r.x + v[0], r.y + v[1], r.z + v[2])];
    if (n) {
      // the leaves part first, then you cross
      openDoor(r, g.dir);
      setTimeout(() => { if (!S.draft && !S.over) transition(g.dir); }, 220);
    } else {
      // sealed: leaves stay shut, the registry asks what goes behind them.
      // Opening a bulkhead onto nothing was the black rectangle.
      openDraft(g.dir);
    }
  }
});
addEventListener('keyup', (ev) => { keys[ev.code] = false; });

document.getElementById('place').onclick = placeChosen;
document.getElementById('cancel').onclick = closeDraft;
document.getElementById('fab').onclick = () => {
  document.getElementById('cut').classList.contains('on') ? closeMap() : openMap();
};
document.getElementById('restart').onclick = () => {
  document.getElementById('end').classList.remove('on'); newRun();
};
addEventListener('resize', () => { sizeRT(); });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

// ── loop ────────────────────────────────────────────────────────
let last = performance.now(), hudT = 0;
function tick(now) {
  requestAnimationFrame(tick);
  const dt = Math.min(0.05, (now - last)/1000); last = now;
  tickMove(dt);
  animDoors(dt);
  animCross(now);
  if (mapOpen) renderer.render(mapScene, mapCam); else renderer.render(scene, camera);
  if (now - hudT > 120) { hudT = now; if (!S.draft) hud(); }
  if (calloutT && now > calloutT) { calloutT = 0; document.getElementById('event').classList.remove('on'); }
}

// the walk through the gate: the camera travels the doorway instead of being
// teleported, so the compartment on the other side arrives by being entered
function animCross(now) {
  const c = S.cross;
  if (!c) return;
  // clamp at BOTH ends: the frame timestamp and performance.now() are not
  // guaranteed to agree, and a negative k feeds a cubic that flies the camera
  // hundreds of metres out of the structure
  const k = Math.max(0, Math.min(1, (now - c.t0) / c.dur));
  const e = k * k * (3 - 2 * k);
  if (c.vert) {
    // over the hole first, then straight down or up the shaft
    const hk = Math.min(1, e * 2.6);
    rig.position.x = c.from.x + (c.axis.x - c.from.x) * hk;
    rig.position.z = c.from.z + (c.axis.z - c.from.z) * hk;
    rig.position.y = c.from.y + (c.to.y - c.from.y) * e;
  } else {
    rig.position.set(
      c.from.x + (c.to.x - c.from.x) * e,
      c.from.y + (c.to.y - c.from.y) * e + Math.sin(k * Math.PI) * 0.05,
      c.from.z + (c.to.z - c.from.z) * e);
  }
  let dy = c.toYaw - c.fromYaw;
  while (dy > Math.PI) dy -= Math.PI*2;
  while (dy < -Math.PI) dy += Math.PI*2;
  rig.rotation.y = c.fromYaw + dy * e;
  camera.rotation.x = c.fromPitch * (1 - e);
  if (k >= 1) { S.cross = null; placeCamera(); }
}

document.title = 'DATUM v2 · ' + BUILD;
sizeRT();
newRun();
requestAnimationFrame(tick);
</script>
</body>
</html>
